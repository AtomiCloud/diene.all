name: diene_flutter_base
description: Production-grade, flavor-aware Flutter application template.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.3
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logto_dart_sdk: ^3.0.0
  go_router: ^17.0.1
  provider: ^6.1.5+1
  retrofit: ^4.9.2
  shared_preferences: ^2.5.4
  slang: ^4.12.0
  slang_flutter: ^4.12.0
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.10.4
  flutter_flavorizr: ^2.4.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  retrofit_generator: ^10.2.1
  swagger_parser: ^1.44.0

flavorizr:
  flavors:
    lapras:
      app:
        name: Diene Mobile (Lapras)
      android:
        applicationId: cloud.atomi.lapras.platform.service.app
      ios:
        bundleId: cloud.atomi.lapras.platform.service.app
    pichu:
      app:
        name: Diene Mobile (Pichu)
      android:
        applicationId: cloud.atomi.pichu.platform.service.app
      ios:
        bundleId: cloud.atomi.pichu.platform.service.app
    pikachu:
      app:
        name: Diene Mobile (Pikachu)
      android:
        applicationId: cloud.atomi.pikachu.platform.service.app
      ios:
        bundleId: cloud.atomi.pikachu.platform.service.app
    raichu:
      app:
        name: Diene Mobile
      android:
        applicationId: cloud.atomi.raichu.platform.service.app
      ios:
        bundleId: cloud.atomi.raichu.platform.service.app

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - config/base.yaml
    - config/lapras.yaml
    - config/pichu.yaml
    - config/pikachu.yaml
    - config/raichu.yaml
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-VariableFont_wght.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-VariableFont_opsz,wght.ttf
