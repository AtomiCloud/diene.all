name: diene_problems
description: >-
  RFC 9457 problem-details machinery for the Dart family — envelope with the
  `data` extension, a single-source type-URI builder, a typed registry, an
  error→Problem transformer, LocalError wrapping, and per-endpoint catalog
  export including the recoverable flag.
version: 0.1.0
repository: https://github.com/AtomiCloud/diene.dart_problems
issue_tracker: https://github.com/AtomiCloud/diene.dart_problems/issues
topics:
  - rfc-9457
  - problem-details
  - errors
  - api

environment:
  sdk: '>=3.12.0 <4.0.0'

# Dependency-light by design: the `data` extension payload is a plain JSON map
# and its catalog schema is authored as a JSON-Schema-shaped Map, so there are
# no runtime dependencies. `diene_result` and `diene_core_utils` will be added
# as path dependencies once those sibling packages land (documented stacking —
# see docs/); they are not required to use this machinery today.
dependencies: {}

dev_dependencies:
  coverage: ^1.8.0
  lints: ^5.0.0
  test: ^1.25.0
