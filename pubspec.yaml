name: diene_auth_engine
description: >-
  Frontend auth engine for the AtomiCloud Diene Dart family — Logto flows,
  per-resource tokens, multi-backend claims-first onboarding, deferred-login
  redeem, returnTo continuation, and the signup-only landscape selector.
version: 0.0.0
publish_to: https://pub.dev
repository: https://github.com/AtomiCloud/diene.dart_auth_engine
homepage: https://github.com/AtomiCloud/diene.dart_auth_engine
issue_tracker: https://github.com/AtomiCloud/diene.dart_auth_engine/issues

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  logto_dart_sdk: ^3.0.0
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Pure-Dart + Flutter-adapter library package — no application assets.
