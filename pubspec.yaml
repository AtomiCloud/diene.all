name: diene_api_engine
description: >-
  Typed OA3 backend-client engine for the diene Dart family: wraps generated
  OpenAPI SDKs into Result/Problem outcomes, registers N backends on the LPSM
  client tree, retries once on hard network failure, and ships a dormant
  disk-cached rescue router for address failover.
version: 0.0.0
publish_to: https://pub.dev
repository: https://github.com/AtomiCloud/diene.dart_api_engine
homepage: https://github.com/AtomiCloud/diene.dart_api_engine

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  collection: ^1.19.0
  dio: ^5.7.0
  # Owned sibling contracts (dependency-honest hosted declarations, matching the
  # siblings' current 0.1.x/0.0.x versions). Built this session via a gitignored
  # pubspec_overrides.yaml that points diene_result/diene_problems at the ACTUAL
  # sibling worktree packages and diene_auth_engine at a session-only stub (the
  # real auth-engine is a Flutter package with pre-unification contracts). The
  # override is deleted at the conductor-held deterministic swap.
  diene_auth_engine: '>=0.0.0 <1.0.0'
  diene_problems: ^0.1.0
  diene_result: ^0.1.0
  json_annotation: ^4.9.0
  meta: ^1.15.0
  retrofit: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.13
  coverage: ^1.11.0
  json_serializable: ^6.8.0
  lints: ^5.0.0
  retrofit_generator: ^10.2.7
  swagger_parser: ^1.44.0
  test: ^1.25.0
