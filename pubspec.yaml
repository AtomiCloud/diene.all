name: diene_e2e
description: >-
  L-dart family version-train and consumer test-harness: stub servers, journey
  drivers, and the shared C0 app-handoff (deferred-login) fixture.
version: 0.0.0
repository: https://github.com/AtomiCloud/diene.dart_e2e
homepage: https://github.com/AtomiCloud/diene.dart_e2e
topics:
  - testing
  - e2e
  - test-helper
  - atomicloud

environment:
  sdk: '>=3.4.0 <4.0.0'

# Runtime deps: none. The library is pure Dart (dart:io, dart:convert,
# dart:math). The version-train re-exports of the seven L-dart members are an
# INTEGRATION-HELD seam (see lib/diene_e2e.dart) — added, with their version
# constraints, when the member packages land under conductor integration.

dev_dependencies:
  coverage: ^1.11.0
  lints: ^5.1.1
  test: ^1.25.15
