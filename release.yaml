# ### workspace-release
# #### source: workspace
schemaVersion: 2

types:
  # THIS NODE'S OWN PRE-MERGE SET - kept, not chosen.
  # Ruled by coordinator-8: every node keeps the type/scope set its own
  # pre-merge tip carried, in BOTH directions. A GAIN from a parent is reverted
  # exactly as a LOSS from a parent is restored, because either way the node
  # stops speaking its own vocabulary on the strength of a parent edit alone.
  #
  # MEASURED ON THIS NODE (bun-cli), and the measurement differs from the
  # parent's, so do not carry the parent's numbers over: the pre-merge tip
  # 0344cfd6 carried 17 type/scope pairs, and the parent bun-base-wo-helm at
  # b694f4d2 carries the same 17. The pair-set difference is empty in BOTH
  # directions - nothing was lost to restore and nothing was gained to remove -
  # so the set below is the pre-merge tip's own, unchanged. The parent had
  # already been reverted to its own pre-merge set before this merge; that is
  # why the merge did not push this node's vocabulary up.
  #
  # A PARENT EDIT IS NOT A RULING. Whether this vocabulary applies fleet-wide
  # is still the owner's to decide. A later cascade must not read this file
  # as a decision in either direction, and must not add or drop pairs on the
  # strength of a parent merge alone.
  #
  # RENAME HAZARD, for whoever compares next. This node's pre-merge file was
  # named atomi_release.yaml and the parent RENAMES it to release.yaml, so a
  # same-path comparison compares nothing at all and silently reports no
  # change. Resolve the rename first. And do not compare TYPE counts: a count
  # is not a set. On this node both counts happen to agree (13 types / 17 pairs
  # on each side), and agreeing counts still prove nothing - only a pair-set
  # diff run in both directions does, because equal counts can hide an equal
  # number of losses and gains.
  #
  # docs/developer/CommitConventions.md is generated from this file: any
  # change here must regenerate it in the same commit.
  - type: amend
    desc: Small amendments and typo fixes
    scopes:
      default:
        desc: Amend existing work
        release: false
  - type: build
    desc: Build-system changes
    scopes:
      default:
        desc: Update build machinery
        release: false
  - type: chore
    desc: Repository chores
    scopes:
      default:
        desc: Perform a chore
        release: false
  - type: ci
    desc: CI/CD changes
    scopes:
      default:
        desc: Update CI/CD
        release: false
  - type: config
    desc: Configuration changes
    scopes:
      default:
        desc: Update configuration
        release: false
  - type: dep
    desc: Dependency updates
    section: 🔼 Dependency Upstreams 🔼
    scopes:
      default:
        desc: Update a dependency
        release: false
      patch:
        desc: Patch dependency update
        release: patch
      minor:
        desc: Minor dependency update
        release: minor
      major:
        desc: Major dependency update
        release: major
  - type: docs
    desc: Documentation changes
    section: 📜 Documentation 📜
    scopes:
      default:
        desc: Update documentation
        release: false
  - type: feat
    desc: New features
    section: ✨ Features ✨
    scopes:
      default:
        desc: Add a feature
        release: minor
      breaking:
        desc: Add a breaking feature
        release: major
  - type: fix
    desc: Bug fixes
    section: 🐛 Bug Fixes 🐛
    scopes:
      default:
        desc: Fix a bug
        release: patch
  - type: perf
    desc: Performance improvements
    section: 🚀 Performance Improvement 🚀
    scopes:
      default:
        desc: Improve performance
        release: patch
  - type: refactor
    desc: Refactors
    scopes:
      default:
        desc: Refactor implementation
        release: minor
  - type: style
    desc: Non-functional style changes
    scopes:
      default:
        desc: Update style
        release: patch
  - type: test
    desc: Test changes
    section: 🧪 Tests 🧪
    scopes:
      default:
        desc: Add or correct tests
        release: minor

specialScopes:
  no-release:
    desc: Prevent release from happening
    release: false

keywords:
  - BREAKING CHANGE
  - BREAKING CHANGES
  - BREAKING

lint:
  header:
    maxLength: 72
    minLength: 5
    forbiddenWords:
      - WIP
    forbidTrailingPunctuation: true
  body:
    maxLineLength: 80
    minLengthWhenPresent: 20
    requireBlankSecondLine: true
  ignore:
    - merge
    - revert
    - fixup
    - fixup-amend
    - squash

conventions:
  path: docs/developer/CommitConventions.md
  template: |-
    # Commit conventions

    This repository follows [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

    - `release.yaml` is the machine-readable source of truth: it owns the
      commit types, the scopes valid for each one, and the version bump each scope
      causes.
    - [The conventional-commits standard](../standards/conventional-commits/index.md)
      explains how to read that vocabulary and how to mark a breaking change.

    ## Status of this file

    This file is generated. `release.yaml` names this path in its
    `conventions.path` value, `releaser conventions` writes it, and a release run
    rewrites it as well. Change `release.yaml` and regenerate rather than
    editing this file: everything up to here comes from that file's
    `conventions.template`, and everything from the `type(scope)` line below is
    generated from the commit vocabulary.

    CONVENTION_DOCS_PLACEHOLDER

release:
  branches:
    - main
  tagFormat: 'v${version}'
  changelog:
    path: Changelog.md
    title: '# Changelog'
  commit:
    message: |-
      release: ${version}

      ${notes}
    assets:
      - Changelog.md
      - Changelog.old.md
      - package.json
      - docs/developer/CommitConventions.md
  # FALSE on this node, and deliberately so. GoReleaser owns the GitHub release
  # here: scripts/release/publish.sh builds the archives, checksums, deb/rpm
  # packages and the Homebrew cask and publishes them against this tag. Letting
  # the releaser publish a release as well would put two publishers on one tag.
  # This is the node's own pre-merge value, kept across the cascade.
  github: false
  hooks:
    # The hook point the parent leaves empty, filled here. This node's version
    # lives in `package.json` rather than in a `VERSION` file, so the manifest
    # the command below stamps is the same file listed in `commit.assets` above -
    # written and committed by the same edit, which is what stops a version
    # record going stale in silence.
    #
    # The beforeWrite entry is this node's own and has no counterpart upstream:
    # it snapshots Changelog.md to Changelog.old.md BEFORE the release writes the
    # new changelog, so scripts/release/publish.sh can diff the two into
    # IncrementalChangelog.md and hand GoReleaser exactly this version's notes.
    # It must stay ordered before the afterWrite bump, and Changelog.old.md is
    # listed in commit.assets above because this hook writes it.
    prepare:
      - phase: beforeWrite
        command: ./scripts/release/backup-changelog.sh
      - phase: afterWrite
        command: './scripts/release/bump.sh ${version}'
    success: []
