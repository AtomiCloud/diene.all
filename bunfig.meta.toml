[test]
root = "tests/meta"
timeout = 120000
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/meta"
coverageSkipTestFiles = true
# Meta ledger = TestHelper code only; all current non-helper source tiers (presets/register/adapters) and tests never count.
coveragePathIgnorePatterns = ["src/adapters/**", "src/index.ts", "src/presets/**", "src/register.ts", "tests/**"]
