[test]
root = "tests/meta"
timeout = 120000
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/meta"
coverageSkipTestFiles = true
# Meta ledger = TestHelper code only; the domain (src/lib) and adapters tiers and tests never count.
coveragePathIgnorePatterns = ["src/adapters/**", "src/index.ts", "src/lib/**", "tests/**"]
