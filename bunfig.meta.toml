[test]
root = "tests/meta"
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/meta"
coverageSkipTestFiles = true
# Meta ledger = TestHelper code only; all current non-helper source tiers and tests never count.
coveragePathIgnorePatterns = ["src/*.ts", "src/adapters/**", "src/lib/**", "tests/**"]
coverageThreshold = { lines = 0.9, functions = 0.9, statements = 0.9 }
