version: '2'

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - noctx
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: exported
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      # The pinned C0 §4 conformance vectors must carry plain-http endpoints
      # verbatim: the contract's own canonical example is
      # `http://collector:4318`, and the invalid-endpoint vectors exist precisely
      # to prove rejection of malformed http URLs. Rewriting them to https would
      # stop testing the contract. Exclude only revive's URL-scheme preference
      # for that one vector file; every other rule stays active everywhere.
      - path: (^|/)lib/otel/c0\.go$
        linters:
          - revive
        text: unsecure-url-scheme

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
