version: '2'

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - modernize
    - musttag
    - nilerr
    - noctx
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      # A default case that handles the remaining enum values counts as exhaustive.
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: exported
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      # Kubernetes API types require the ",inline" json tag on embedded TypeMeta
      # and ListMeta; revive's struct-tag rule does not recognise it. The path
      # covers every API version directory (the sample api/v1alpha1, the fleet
      # api/fleet/v1alpha1, and the future api/problems/v1alpha1) so each API
      # root need not carry a per-line nolint; the specific text keeps this from
      # suppressing any other revive finding in those packages.
      - path: 'api/([a-z0-9-]+/)?v1alpha1/'
        linters: [revive]
        text: 'struct-tag: unknown option "inline"'
      # The composition root parses flags in run() (returning an exit code) so it
      # stays testable; main() only wraps it.
      - path: cmd/manager/
        linters: [revive]
        text: deep-exit
      # TestMain must call os.Exit to propagate the code after deferred envtest
      # teardown.
      - path: _test\.go
        linters: [revive]
        text: redundant-test-main-exit
      # Test helpers legitimately fix some parameters across call sites.
      - path: _test\.go
        linters: [unparam]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
