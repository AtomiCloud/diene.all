# yaml-language-server: $schema=../schemas/go-consumer.schema.json
app:
  landscape: lapras
  platform: diene
  service: go-consumer
  module: worker
  version: 0.0.0
otel:
  logs:
    enabled: true
    exporter:
      console:
        enabled: false
      otlp:
        enabled: false
        endpoint: ''
        protocol: http/protobuf
        headers:
          x-service: go-consumer
        timeout: PT10S
  metrics:
    enabled: true
    exporter:
      console:
        enabled: false
      otlp:
        enabled: false
        endpoint: ''
        protocol: http/protobuf
        headers:
          x-service: go-consumer
        timeout: PT10S
    interval: PT10S
  traces:
    enabled: true
    sampler:
      type: parentbased_traceidratio
      ratio: 1
    exporter:
      console:
        enabled: false
      otlp:
        enabled: false
        endpoint: ''
        protocol: http/protobuf
        headers:
          x-service: go-consumer
        timeout: PT10S
auth:
  idp:
    issuer: http://logto:3001/oidc
    audience: go-consumer
    jwksUri: http://logto:3001/oidc/jwks
    algorithms:
      - RS256
    clockSkewSeconds: 30
    management:
      endpoint: http://logto:3001/api
      resource: https://default.logto.app/api
      clientId: ''
      clientSecret: ''
  minting:
    tokenEndpoint: http://logto:3001/oidc/token
    clientId: ''
    clientSecret: ''
    handoffPath: /app-handoff
    cacheNamespace: go-consumer
    refreshSkewSeconds: 30
    concurrency: 4
  resources: []
  policies: {}
api:
  backends:
    control-plane:
      baseUrl: http://control-plane:8080
      resource: control-plane
      indicator: https://control-plane.atomi.cloud
      scopes:
        - read
      timeout: PT15S
  retry:
    network: true
    delay: PT0.2S
postgres:
  MAIN:
    host: postgres
    port: 5432
    database: go_consumer
    username: go_consumer
    password: ''
    ssl: false
    pool:
      min: 0
      max: 10
cache:
  MAIN:
    host: cache
    port: 6379
    password: ''
    db: 0
    tls: false
kv:
  MAIN:
    host: kv
    port: 6379
    password: ''
    db: 0
    tls: false
storage:
  MAIN:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: go-consumer
    accessKeyId: ''
    secretAccessKey: ''
    forcePathStyle: true
  ARCHIVE:
    endpoint: http://minio:9000
    region: us-east-1
    bucket: go-consumer-archive
    accessKeyId: ''
    secretAccessKey: ''
    forcePathStyle: true
encryption:
  key: ''
transport:
  stream: go-consumer.messages
  consumerGroup: go-consumer
  consumerName: worker-main
  blockMs: 1000
  idleMs: 5000
  batchSize: 10
errorPortal:
  scheme: https
  host: errors.atomi.cloud
  landscape: lapras
  platform: diene
  service: go-consumer
  module: worker
  version: v1
domain:
  blobPrefix: processed
  maxMessageBytes: 1048576
dbInit:
  createBucket: false
  migrationsDir: migrations/pg
  redisMigrationKey: go-consumer:migrations:v1
  seedDir: seed
health:
  heartbeatFile: dist/run/worker-heartbeat.json
  maxAgeMs: 30000
