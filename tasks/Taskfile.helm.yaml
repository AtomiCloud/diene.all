version: '3'

# One task set per chart under infra/. The task key is the chart directory's own
# name, so `infra/root_chart` is `root_chart:<verb>`. A new chart gets its own
# tasks and its own vars block; never re-point a shared chart variable.
tasks:
  root_chart:deps:
    desc: Build dependencies for infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm dependency build {{.CHART}}

  root_chart:lint:
    desc: Lint infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm lint {{.CHART}}

  root_chart:template:
    desc: Render infra/root_chart
    vars:
      CHART: infra/root_chart
    cmds:
      - helm template diene-workspace {{.CHART}} {{.CLI_ARGS}}

  root_chart:debug:
    desc: Render infra/root_chart with debug output
    vars:
      CHART: infra/root_chart
    cmds:
      - helm template diene-workspace {{.CHART}} --debug {{.CLI_ARGS}}

  # ### bun-consumer-primordial-chart
  # #### source: bun-consumer
  primordial_chart:deps:
    desc: Build dependencies for infra/primordial_chart
    vars:
      CHART: infra/primordial_chart
    cmds:
      - helm dependency build {{.CHART}}

  primordial_chart:lint:
    desc: Lint infra/primordial_chart
    vars:
      CHART: infra/primordial_chart
    cmds:
      - helm lint {{.CHART}}

  primordial_chart:template:
    desc: Render infra/primordial_chart
    vars:
      CHART: infra/primordial_chart
    cmds:
      - helm template bun-consumer-primordial {{.CHART}} {{.CLI_ARGS}}

  primordial_chart:debug:
    desc: Render infra/primordial_chart with debug output
    vars:
      CHART: infra/primordial_chart
    cmds:
      - helm template bun-consumer-primordial {{.CHART}} --debug {{.CLI_ARGS}}
