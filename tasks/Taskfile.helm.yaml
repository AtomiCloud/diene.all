# ### workspace-helm
# #### source: workspace
version: '3'

vars:
  CHART: infra/root_chart
  # ### go-consumer-primordial-chart
  # #### source: go-consumer
  PRIMORDIAL_CHART: infra/primordial_chart

tasks:
  deps:
    desc: Build chart dependencies
    cmds:
      - helm dependency build {{.CHART}}
      # ### go-consumer-primordial-chart
      # #### source: go-consumer
      - helm dependency build {{.PRIMORDIAL_CHART}}

  lint:
    desc: Lint the root chart
    cmds:
      - helm lint {{.CHART}}
      # ### go-consumer-primordial-chart
      # #### source: go-consumer
      - helm lint {{.PRIMORDIAL_CHART}}

  template:
    desc: Render the root chart
    cmds:
      - helm template diene-go-consumer {{.CHART}} {{.CLI_ARGS}}
      # ### go-consumer-primordial-chart
      # #### source: go-consumer
      - helm template go-consumer-primordial {{.PRIMORDIAL_CHART}} {{.CLI_ARGS}}

  debug:
    desc: Render the root chart with debug output
    cmds:
      - helm template diene-go-consumer {{.CHART}} --debug {{.CLI_ARGS}}
      # ### go-consumer-primordial-chart
      # #### source: go-consumer
      - helm template go-consumer-primordial {{.PRIMORDIAL_CHART}} --debug {{.CLI_ARGS}}
