version: '3'

# Every render/install route uses the independent base -> landscape -> cluster
# stacking order and runs from the repository root.

tasks:
  debug:
    desc: Render the stacked chart with debug output
    cmds:
      - '{{.ROOT_DIR}}/scripts/local/render-stacked.sh debug {{.RELEASE_NAME}} {{.NAMESPACE}} chart/values.{{.LANDSCAPE}}.yaml chart/values.{{.CLUSTER}}.yaml {{.CLI_ARGS}}'

  template:
    desc: Render the stacked chart
    cmds:
      - '{{.ROOT_DIR}}/scripts/local/render-stacked.sh template {{.RELEASE_NAME}} {{.NAMESPACE}} chart/values.{{.LANDSCAPE}}.yaml chart/values.{{.CLUSTER}}.yaml {{.CLI_ARGS}}'

  install:
    desc: Install or upgrade the stacked chart
    cmds:
      - '{{.ROOT_DIR}}/scripts/local/render-stacked.sh install {{.RELEASE_NAME}} {{.NAMESPACE}} chart/values.{{.LANDSCAPE}}.yaml chart/values.{{.CLUSTER}}.yaml {{.CLI_ARGS}}'

  remove:
    desc: Remove the installed release
    cmds:
      - helm uninstall {{.RELEASE_NAME}} --namespace {{.NAMESPACE}} {{.CLI_ARGS}}
