version: '3'

tasks:
  debug:
    desc: Render the landscape overlay with debug output
    dir: '{{.ROOT_DIR}}/chart'
    cmds:
      - helm template {{.RELEASE_NAME}} . --namespace {{.NAMESPACE}} --debug --values values.{{.LANDSCAPE}}.yaml {{.CLI_ARGS}}

  template:
    desc: Render the landscape overlay
    dir: '{{.ROOT_DIR}}/chart'
    cmds:
      - helm template {{.RELEASE_NAME}} . --namespace {{.NAMESPACE}} --values values.{{.LANDSCAPE}}.yaml {{.CLI_ARGS}}

  install:
    desc: Install or upgrade the landscape overlay
    dir: '{{.ROOT_DIR}}/chart'
    cmds:
      - helm upgrade --install {{.RELEASE_NAME}} . --namespace {{.NAMESPACE}} --create-namespace --values values.{{.LANDSCAPE}}.yaml --wait --timeout 5m {{.CLI_ARGS}}

  remove:
    desc: Remove the installed release
    cmds:
      - helm uninstall {{.RELEASE_NAME}} --namespace {{.NAMESPACE}} {{.CLI_ARGS}}
