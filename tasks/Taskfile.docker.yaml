# ### workspace-docker
# #### source: workspace
version: '3'

vars:
  IMAGE: diene-dotnet-base:local

tasks:
  build:
    desc: Build the local .NET base image
    cmds:
      - docker build -f infra/Dockerfile -t {{.IMAGE}}{{if .CLI_ARGS}}-{{.CLI_ARGS}}{{end}} .

  run:
    desc: Run the local .NET base image
    cmds:
      - docker run --rm {{.IMAGE}}{{if .CLI_ARGS}}-{{.CLI_ARGS}}{{end}}

  clean:
    desc: Remove the local .NET base image
    cmds:
      - docker image rm {{.IMAGE}}{{if .CLI_ARGS}}-{{.CLI_ARGS}}{{end}} || true
