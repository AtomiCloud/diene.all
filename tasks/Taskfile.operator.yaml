# ### operator-template-tasks
# #### source: operator-template
version: '3'

tasks:
  generate:
    desc: Regenerate operator CRDs, RBAC, and deepcopy from the Go types
    cmds:
      - ./scripts/local/operator-manifests.sh

  e2e:
    desc: Run the k3d end-to-end operator journey
    cmds:
      - ./scripts/local/operator-e2e.sh

  e2e:names:
    desc: Unit-check shared e2e resource-name derivation (no Docker/k3d)
    cmds:
      - ./scripts/local/lib/cluster-name.test.sh
