[test]
root = "tests/unit"
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/unit"
coverageSkipTestFiles = true
# Unit ledger = the domain tier only (src/lib, 100% goal); adapters/glue belong to other tiers, tests/** never counts.
coveragePathIgnorePatterns = ["src/adapters/**", "src/test-helper/**", "src/index.ts", "tests/**", "fixtures/**"]

# Imports every src/lib module so an untested one is measured at 0% rather than absent.
preload = ["./tests/support/unit-ledger.ts"]

# Scalar form only: Bun 1.3.13 does not enforce the per-metric object.
coverageThreshold = 1.0
