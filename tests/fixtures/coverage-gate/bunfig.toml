# Fixture ledger for the coverage-gate sabotage check. It mirrors the real tiers — all-files
# scoping, an lcov artifact, a hard threshold — over a throwaway source file, so the check can prove
# the gate bites without ever weakening a real suite. Driven by tests/unit/coverage-gate.test.ts.
[test]
root = "tests/fixtures/coverage-gate/spec"
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/fixture"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/**", "tests/support/**", "tests/unit/**", "tests/integration/**"]
coverageThreshold = 1.0
