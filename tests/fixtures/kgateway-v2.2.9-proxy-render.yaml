# Source-derived projection of kgateway v2.2.9's generated proxy contract.
# GenerateListenerNameFromPort produces listener~<port>, the embedded Envoy
# chart sanitizes that to listener-<port>, and GetPortsValues copies each
# Gateway listener number to the Service targetPort and proxy containerPort.
apiVersion: v1
kind: Service
metadata:
  name: platinum-gateway
spec:
  ports:
    - name: listener-80
      port: 80
      protocol: TCP
      targetPort: 80
    - name: listener-443
      port: 443
      protocol: TCP
      targetPort: 443
  selector:
    app.kubernetes.io/instance: platinum-gateway
    app.kubernetes.io/name: platinum-gateway
    gateway.networking.k8s.io/gateway-name: platinum-gateway
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platinum-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: platinum-gateway
      app.kubernetes.io/name: platinum-gateway
      gateway.networking.k8s.io/gateway-name: platinum-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platinum-gateway
        app.kubernetes.io/name: platinum-gateway
        gateway.networking.k8s.io/gateway-name: platinum-gateway
    spec:
      containers:
        - name: kgateway-proxy
          ports:
            - containerPort: 80
              name: listener-80
              protocol: TCP
            - containerPort: 443
              name: listener-443
              protocol: TCP
