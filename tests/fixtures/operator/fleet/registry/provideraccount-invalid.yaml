# vendor and name are DNS-label constrained: the account context feeds the
# derived credential pointer's grammar, so an out-of-charset vendor (uppercase
# here) is refused at admission rather than producing an unaddressable account.
apiVersion: fleet.atomi.cloud/v1alpha1
kind: ProviderAccount
metadata:
  name: invalid-provideraccount
  namespace: nitroso
spec:
  vendor: Neon
  name: nonprod
