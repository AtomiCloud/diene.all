# a platform with no promotion steps renders no Kargo stages at all, so an
# empty DAG is rejected rather than compiling to silence.
apiVersion: fleet.atomi.cloud/v1alpha1
kind: Platform
metadata:
  name: invalid-platform
  namespace: nitroso
spec:
  infisical:
    projectSlug: nitroso
    serviceFolders: true
  sos:
    register: true
  pipeline:
    stages: []
