# A ProviderAccount names a vendor/account context only. It carries NO
# credential source or path: the account's credential lives in Infisical at a
# path the dependency consumer DERIVES from the consuming module's runtime
# coordinate plus this vendor/name, never a field on this CR.
apiVersion: fleet.atomi.cloud/v1alpha1
kind: ProviderAccount
metadata:
  name: prod-neon
  namespace: nitroso
spec:
  vendor: neon
  name: prod
  plan: scale
  quotas:
    - resource: projects
      limit: 100
