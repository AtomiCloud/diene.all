apiVersion: fleet.atomi.cloud/v1alpha1
kind: PlatformDependency
metadata:
  name: nitroso-raichu-invalid-dependencies
  namespace: nitroso
spec:
  platform: nitroso
  landscape: raichu
  placement:
    preferredHost: raichu
  database:
    maindb:
      type: cnpg
      delivery: local
      credentialMode: standard
      rotation: 'off'
      engine:
        cnpg: {}
  deletionPolicy:
    retainSecret: 168h
