name: diene_interfaces
description: Result-based System, VFS, Terminal, logging, and metrics seams for Dart applications, with dependency-light in-memory fakes.
version: 1.0.0
repository: https://github.com/AtomiCloud/diene.dart_interfaces
issue_tracker: https://github.com/AtomiCloud/diene.dart_interfaces/issues
homepage: https://github.com/AtomiCloud/diene.dart_interfaces

topics:
  - interfaces
  - filesystem
  - logging
  - metrics
  - testing

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  diene_problems: ^0.1.0
  diene_result: ^1.0.0

dev_dependencies:
  coverage: ^1.15.1
  crypto: ^3.0.6
  dart_code_linter: ^4.1.7
  lints: ^6.1.0
  pana: ^0.23.14
  test: ^1.31.2
