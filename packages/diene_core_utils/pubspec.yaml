name: diene_core_utils
description: Pure Dart utilities for slugs, namespaced keys, layered configuration merges, environment coercions, and C0 ISO 8601 / RFC 3339 / IANA wire forms.
version: 1.0.0
repository: https://github.com/AtomiCloud/diene.dart_core_utils
issue_tracker: https://github.com/AtomiCloud/diene.dart_core_utils/issues
homepage: https://github.com/AtomiCloud/diene.dart_core_utils

topics:
  - utilities
  - slug
  - configuration
  - datetime
  - serialization

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  diene_interfaces: ^1.0.0
  diene_problems: ^0.1.0
  diene_result: ^1.0.0
  unorm_dart: ^0.3.2

dev_dependencies:
  coverage: ^1.15.1
  crypto: ^3.0.6
  dart_code_linter: ^4.1.7
  lints: ^6.1.0
  pana: ^0.23.14
  test: ^1.31.2
