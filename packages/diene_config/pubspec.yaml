name: diene_config
description: Layered, schema-composed configuration for Dart and Flutter apps — base YAML, landscape overlay, dev override, then Dart defines, validated once.
version: 1.0.0
repository: https://github.com/AtomiCloud/diene.dart_config
issue_tracker: https://github.com/AtomiCloud/diene.dart_config/issues
homepage: https://github.com/AtomiCloud/diene.dart_config

topics:
  - configuration
  - yaml
  - schema
  - layered

resolution: workspace

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  diene_core_utils: ^1.0.0
  diene_problems: ^0.1.0
  diene_result: ^1.0.0
  yaml: ^3.1.3

dev_dependencies:
  coverage: ^1.15.1
  crypto: ^3.0.6
  dart_code_linter: ^4.1.7
  lints: ^6.1.0
  pana: ^0.23.14
  test: ^1.31.2
