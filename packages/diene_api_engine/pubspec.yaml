name: diene_api_engine
description: >-
  Typed OA3 backend-client engine for the diene Dart family: wraps generated
  OpenAPI SDKs into Result/Problem outcomes, registers N backends on the LPSM
  client tree, retries once on hard network failure, and ships a dormant
  disk-cached rescue router for same-landscape address failover.
version: 0.0.0
repository: https://github.com/AtomiCloud/diene.dart_api_engine
issue_tracker: https://github.com/AtomiCloud/diene.dart_api_engine/issues
homepage: https://github.com/AtomiCloud/diene.dart_api_engine

topics:
  - api
  - openapi
  - http
  - result
  - resilience

resolution: workspace

# This package depends on the Flutter SDK, transitively and unavoidably:
# diene_auth_engine (the IAuth / ResourceKey / ResourceToken seam this engine
# keys its per-backend tokens off) declares `flutter: '>=3.24.0'`. MEASURED, not
# reasoned — `dart pub get` on a manifest whose only dependency is
# diene_auth_engine ^1.0.1 refuses outright:
#   "Because sdk_probe depends on diene_auth_engine >=1.0.1 which requires the
#    Flutter SDK, version solving failed. Flutter users should use `flutter pub`
#    instead of `dart pub`."
# So every gate invokes the Flutter SDK's tooling. See
# exec/nodes/lib__dart__api-engine/evidence/flutter-toolchain-delta.md, which
# adopts the auth-engine family precedent for Flutter-dependent dart libs.
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  collection: ^1.19.0
  # Owned sibling contracts, each pinned to the NEWEST published version. Under
  # the untracked-lockfile rule (pubspec.lock is gitignored here) a local gate run
  # only proves the bytes CI will resolve if the locked version equals the newest
  # satisfying the constraint — and "am I on the newest?" is also the only
  # currently-implementable retraction control, because retraction is always
  # declared by something published AFTER the retracted version. Read live from
  # the pub.dev API at this head: auth_engine 1.0.1, problems 0.1.1, result 1.0.0.
  # diene_problems is pinned ^0.1.1 so the solver cannot reach 0.1.0, which
  # R-E24a and 0.1.1's own changelog both declare was published from rejected
  # content while the registry still reports retracted=false for it.
  diene_auth_engine: ^1.0.1
  diene_problems: ^0.1.1
  diene_result: ^1.0.0
  dio: ^5.7.0
  flutter:
    sdk: flutter
  json_annotation: ^4.9.0
  meta: ^1.15.0
  retrofit: ^4.4.0

dev_dependencies:
  dart_code_linter: ^4.1.7
  # `flutter_test` REPLACES the `test` dev_dependency the pure-Dart siblings
  # carry. A Dart pub workspace shares ONE resolution across every member, so
  # `test` is solved against flutter_test's pins and becomes unsolvable:
  #   "Because test >=1.31.2 depends on test_api 0.7.13 and every version of
  #    flutter_test from sdk depends on test_api 0.7.11, test >=1.31.2 is
  #    incompatible with flutter_test from sdk."
  # flutter_test re-exports the test framework, so no tier loses coverage.
  # `pana` is likewise absent — it needs analyzer ^13 / test ^1.26.2 and cannot
  # co-resolve with flutter_test even from the workspace root manifest; it is
  # activated into its own isolated resolution by scripts/ci/setup.sh.
  # `coverage` is absent because `flutter test --coverage` emits LCOV directly,
  # so the coverage:format_coverage conversion step does not exist here.
  # scripts/validate/dart-package.sh ASSERTS all three absences, so a
  # well-meaning re-add surfaces as a red gate instead of an opaque solver wall.
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
