# Source: vanadium/templates/policies.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vanadium-restrictvolumetypes
  labels:
    helm.sh/chart: vanadium-0.1.0
    app.kubernetes.io/name: vanadium
    app.kubernetes.io/instance: vanadium
    atomi.cloud/cluster: "lapras"
    atomi.cloud/landscape: "example"
    atomi.cloud/layer: "0"
    atomi.cloud/module: "admission"
    atomi.cloud/platform: "fleet"
    atomi.cloud/service: "vanadium"
    app.kubernetes.io/version: "1.30.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    atomi.cloud/cluster: "lapras"
    atomi.cloud/landscape: "example"
    atomi.cloud/layer: "0"
    atomi.cloud/module: "admission"
    atomi.cloud/platform: "fleet"
    atomi.cloud/service: "vanadium"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps, batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, jobs]
  validations:
    - expression: |-

        !has(object.spec.template.spec.volumes) ||
        object.spec.template.spec.volumes.all(v,
          has(v.configMap) || has(v.csi) || has(v.downwardAPI) || has(v.emptyDir) ||
          has(v.ephemeral) || has(v.persistentVolumeClaim) || has(v.projected) ||
          has(v.secret) ||
          (has(v.hostPath) && has(object.spec.template.spec.serviceAccountName) &&
           object.spec.template.spec.serviceAccountName == 'alloy-logs' && has(v.hostPath.path) &&
           (v.hostPath.path == '/var/log' || v.hostPath.path.startsWith('/var/log/'))))
      message: hostPath volumes are forbidden outside the alloy /var/log container-logs carve-out.
