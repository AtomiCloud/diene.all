apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: diene-carbon-workload-baseline
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps, batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, jobs]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
          c.image.contains(':') && !c.image.endsWith(':latest'))
      message: Workload images must use an explicit non-latest tag.
    - expression: >-
        object.spec.template.spec.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
          has(c.resources.limits.cpu) && has(c.resources.limits.memory))
      message: Every container must declare CPU and memory requests and limits.
    - expression: >-
        has(object.spec.template.spec.securityContext) &&
        object.spec.template.spec.securityContext.runAsNonRoot == true &&
        object.spec.template.spec.containers.all(c,
          has(c.securityContext) && c.securityContext.runAsNonRoot == true &&
          c.securityContext.allowPrivilegeEscalation == false &&
          c.securityContext.readOnlyRootFilesystem == true &&
          has(c.securityContext.capabilities) &&
          c.securityContext.capabilities.drop.exists(x, x == 'ALL'))
      message: Workloads must run non-root with baseline-plus container hardening.
