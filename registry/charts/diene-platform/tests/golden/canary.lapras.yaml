# Source: diene-platform/templates/appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: canary
  namespace: argocd
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # g1 — git-files over landscapes/<l>/<svc>.yaml → one primordial Application
    # per row, destined for the Primordial central cluster.
    - git:
        repoURL: https://github.com/AtomiCloud/fleet
        revision: HEAD
        files:
          - path: platforms/canary/landscapes/*/*.yaml
        template:
          metadata:
            name: 'canary-{{ index .path.segments 3 }}-{{ trimSuffix ".yaml" .path.filename }}-primordial'
          spec:
            project: default
            destination:
              server: https://kubernetes.default.svc
              namespace: canary
            sources:
              - repoURL: 'oci://registry.atomi.cloud/canary-{{ trimSuffix ".yaml" .path.filename }}-primordial'
                targetRevision: '{{ .pin.tag }}'
                helm:
                  values: '{{ .values | default dict | toRawJson }}'
    # g2 — g1 × cluster generator (label-selected by landscape) → one per-cluster
    # Application per row per matching cluster. This is the SOLE membership
    # mechanism, so delivery: replicated modules land on EVERY landscape cluster.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/AtomiCloud/fleet
              revision: HEAD
              files:
                - path: platforms/canary/landscapes/*/*.yaml
          - clusters:
              selector:
                matchLabels:
                  atomi.cloud/landscape: '{{ index .path.segments 3 }}'
        template:
          metadata:
            name: 'canary-{{ index .path.segments 3 }}-{{ trimSuffix ".yaml" .path.filename }}-{{ .name }}'
          spec:
            project: default
            destination:
              server: '{{ .server }}'
              namespace: canary
            sources:
              - repoURL: 'oci://registry.atomi.cloud/canary-{{ trimSuffix ".yaml" .path.filename }}'
                targetRevision: '{{ .pin.tag }}'
                helm:
                  values: '{{ .values | default dict | toRawJson }}'
  # Base template: the two generator-level templates above override per row.
  template:
    metadata:
      name: canary-row
      labels:
        atomi.cloud/platform: "canary"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: canary
      source:
        repoURL: https://github.com/AtomiCloud/fleet
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
---
# Source: diene-platform/templates/cloudflare-deploy.yaml
apiVersion: edge.atomi.cloud/v1alpha1
kind: CloudflareDeploy
metadata:
  name: canary-web
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  scriptName: canary-web
  # tag-addressed version (never a hand-pinned version id): CI uploads
  # versions, Kargo freight pins the tag, cf-deploy resolves tag → version.
  desiredVersionFrom:
    tag: "0.1.0"
  rollout:
    steps:
    - percent: 10
      soak: 10m
    - percent: 100
    strategy: gradual
  pin: true
---
# Source: diene-platform/templates/platform.yaml
apiVersion: fleet.atomi.cloud/v1alpha1
kind: Platform
metadata:
  name: canary
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  infisical:
    projectSlug: canary
    serviceFolders: true
  sos:
    register: true
  pipeline:
    # Rendered 1:1 from carbon's platform.yaml stages: — the derived Kargo
    # Stages live in kargo.yaml; this is the DAG of record.
    stages:
      - pichu
      - pikachu
      - - raichu
        - gate: manual
          landscape: amphoros
          soak: 1h
          verification:
            analysisTemplates:
            - name: canary-smoke
      - lapras
---
# Source: diene-platform/templates/platform-dependency.yaml
apiVersion: fleet.atomi.cloud/v1alpha1
kind: PlatformDependency
metadata:
  name: canary-raichu
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
  annotations:
    atomi.cloud/profile: "lapras"
spec:
  platform: canary
  landscape: raichu
  placement:
    preferredHost: raichu
  database:
    localdb:
      cpu: 1
      credentialMode: standard
      delivery: local
      engine:
        cnpg: {}
      ram: 1Gi
      rotation: "off"
      storage: 10Gi
      type: cnpg
      version: "16"
    maindb:
      backup:
        crossVendor: true
      cpu: 1
      credentialMode: standard
      delivery: external
      engine:
        neon:
          tier: free
      providerAccountRef: canary-neon
      ram: 1Gi
      rotation: "on"
      storage: 10Gi
      type: neon
      version: "16"
  kv:
    sessions:
      credentialMode: standard
      delivery: external
      engine:
        upstash: {}
      providerAccountRef: canary-upstash
      ram: 128Mi
      rotation: "on"
      type: upstash
  cache:
    hot:
      credentialMode: standard
      delivery: replicated
      engine:
        dragonfly: {}
      ram: 128Mi
      rotation: "on"
      type: dragonfly
  store:
    assets:
      credentialMode: standard
      delivery: external
      engine:
        tigris: {}
      providerAccountRef: canary-tigris
      rotation: "on"
      type: tigris
    localassets:
      credentialMode: standard
      delivery: local
      engine:
        minio: {}
      rotation: "off"
      type: minio
  deletionPolicy:
    retainSecret: 168h
  # render-split summary (compiler assertion surface):
  # externalOffRail: assets,maindb,sessions
  # replicatedOnRail: hot
  # localStrippedFromProd: -
