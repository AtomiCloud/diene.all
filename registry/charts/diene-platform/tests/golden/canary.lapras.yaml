# Source: diene-platform/templates/kargo.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: dummy
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
spec:
  # chart Version == image Tag is enforced by the tag-aligned subscription —
  # the mercury-stable pin resolves as this ordinary image+chart pin too.
  subscriptions:
    - image:
        repoURL: registry.atomi.cloud/canary/dummy
        semverConstraint: ">=0.0.0"
        discoveryLimit: 5
    - chart:
        repoURL: oci://registry.atomi.cloud/canary-dummy
        semverConstraint: ">=0.0.0"
