# Source: diene-platform/templates/kargo.yaml
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: canary-dummy-pichu
  namespace: canary
  labels:
    helm.sh/chart: diene-platform-0.1.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: diene-fleet
    atomi.cloud/platform: "canary"
    atomi.cloud/landscape: "pichu"
  annotations:
    atomi.cloud/promotion-gate: "auto"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: dummy
      sources:
        # first step subscribes directly to the service's Warehouse
        direct: true
  promotionTemplate:
    spec:
      # Fixed git-update promotion template (identical for auto and manual
      # gates). It bumps ONLY the pin in the row file and preserves any
      # human `values:` override block byte-for-byte.
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/AtomiCloud/fleet
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/platforms/canary/landscapes/pichu/dummy.yaml
            updates:
              - key: pin.tag
                value: ${{ imageFrom "registry.atomi.cloud/canary/dummy" | .Tag }}
        - uses: git-commit
          config:
            path: ./repo
            author:
              name: kargo-bot
              email: kargo-bot@atomi.cloud
            message: "chore(canary): promote dummy to pichu"
        - uses: git-push
          config:
            path: ./repo
