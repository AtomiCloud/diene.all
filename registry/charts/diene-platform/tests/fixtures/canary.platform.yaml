# canary platform.yaml — golden-render fixture.
#
# In production this file lives in AtomiCloud/canary.carbon (source B of the
# three-source compiler Application), exactly like any real platform. It is
# committed here ONLY as the golden-render fixture: canary's job is to touch
# EVERY platform.yaml feature the compiler chart understands, so the render
# exercises every code path.
#
# Derive-don't-declare: only pipeline DAG + dependency/VLS/webhook/deploy
# declarations that genuinely originate at the platform appear here — never DNS,
# discovery docs, the belt, or webhook targets.

infisical:
  projectSlug: canary
  serviceFolders: true
sos:
  register: true

# FULL declared landscape set (canary declares every registered landscape; real
# business workloads never run — sync is manual + human-gated).
landscapes:
  - pichu
  - pikachu
  - raichu
  - amphoros
  - lapras

# Pipeline DAG across the FULL declared landscape set: a bare-landscape step,
# another bare step, then a [parallel, set] step mixing a bare name with the
# full object form (manual gate + soak + verification), then a trailing bare
# step — every DAG shape the compiler understands, touching every landscape.
stages:
  - pichu
  - pikachu
  - - raichu
    - landscape: amphoros
      gate: manual
      soak: 1h
      verification:
        analysisTemplates:
          - name: canary-smoke
  - lapras

# ≥1 PlatformDependency module per class family, plus local-delivery variants
# (cnpg/minio) so every delivery rail renders: external (Primordial, off-rail),
# replicated (g2 every-cluster), local (lapras-only; stripped from prod).
dependencies:
  landscape: raichu
  placement:
    preferredHost: raichu
  database:
    maindb:
      type: neon
      delivery: external
      providerAccountRef: canary-neon
      credentialMode: standard
      rotation: 'on'
      cpu: 1
      ram: 1Gi
      storage: 10Gi
      version: '16'
      backup:
        crossVendor: true
      engine:
        neon:
          tier: free
    localdb:
      type: cnpg
      delivery: local
      credentialMode: standard
      rotation: 'off'
      cpu: 1
      ram: 1Gi
      storage: 10Gi
      version: '16'
      engine:
        cnpg: {}
  kv:
    sessions:
      type: upstash
      delivery: external
      providerAccountRef: canary-upstash
      credentialMode: standard
      rotation: 'on'
      ram: 128Mi
      engine:
        upstash: {}
  cache:
    hot:
      type: dragonfly
      delivery: replicated
      credentialMode: standard
      rotation: 'on'
      ram: 128Mi
      engine:
        dragonfly: {}
  store:
    assets:
      type: tigris
      delivery: external
      providerAccountRef: canary-tigris
      credentialMode: standard
      rotation: 'on'
      engine:
        tigris: {}
    localassets:
      type: minio
      delivery: local
      credentialMode: standard
      rotation: 'off'
      engine:
        minio: {}

# VirtualLandscapeService fragment (mew envelope rendering).
virtualLandscapeServices:
  - service: dummy
    module: api
    vlandscape: mew
    landscape: raichu
    serve: true

# WebhookEngine config (post-Q-WH1/WH3 shape — retention/backoff/dedup/quotas/
# customDomains; NO worker/d1/hostname/engine-version fields).
webhookEngine:
  home:
    vlandscape: mew
  retention:
    cycle: monthly
    keepMonths: 2
    archive:
      store: tigris
      bucket: canary-webhook-archive
  retryWindow: 72h
  backoff:
    initial: 5s
    shape: exponential
  circuitBreaker:
    failWindow: 24h
  dedupWindow: 72h
  quotas:
    intakeRps: 50
    burst: 200
  customDomains: []

# CloudflareDeploy block (frontend/erbium Worker rail — tag-addressed, gradual).
cloudflareDeploy:
  - scriptName: canary-web
    tag: 0.1.0
    pin: true
    rollout:
      strategy: gradual
      steps:
        - percent: 10
          soak: 10m
        - percent: 100

# Problem catalog fragment (RFC7807).
problems:
  - service: dummy
    landscape: raichu
    version: 0.1.0
    entries:
      - id: CANARY_DUMMY
        type: https://errors.atomi.cloud/canary/dummy
        title: Canary dummy problem
        status: 418
        recoverable: false
        schema: {}
        endpoints:
          - method: GET
            path: /
