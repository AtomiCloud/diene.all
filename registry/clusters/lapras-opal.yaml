# ClusterRegistration CR (T3-DESIGN.md §2, §3.1). lapras is the merged
# single-cluster profile: the cluster carries the garden-supplied CNPG/MinIO/
# Mailpit operators plus the fleet-wide Dragonfly operator, so the compiler
# chart renders delivery: local modules here as direct Applications. The Argo
# cluster-Secret label landscape=lapras the controller stamps is the SOLE
# membership truth for replicated delivery; there is no pinned-mode override.
apiVersion: fleet.atomi.cloud/v1alpha1
kind: ClusterRegistration
metadata:
  name: lapras-opal
  labels:
    atomi.cloud/landscape: lapras
spec:
  landscape: lapras
  mark: opal
  provider: k3d
  originMode: loadbalancer
  traffic: true
