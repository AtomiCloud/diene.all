schemaVersion: 1
checks:
  action-pins:
    trustedPattern: ^AtomiCloud/
    workflowsDir: .github/workflows
  exec-bits:
    globs:
      - '*.sh'
  ci-wiring:
    workflowsDir: .github/workflows
    entrypointPattern: scripts/ci/[A-Za-z0-9._-]+[.]sh
    orchestrators:
      - .github/workflows/ci.yaml
      - .github/workflows/cd.yaml
      - .github/workflows/release.yaml
  toolchain-smoke:
    shell: default
    binaries:
      - actionlint
      - bash
      - cyanprint
      - dlint
      - git
      - gomplate
      - infisical
      - jq
      - nix
      - pre-commit
      - releaser
      - rg
      - shellcheck
      - task
      - treefmt
      - yq
  no-custom-derivations:
    paths:
      - nix/packages.nix
      - nix/env.nix
      - nix/shells.nix
  workflow-policy:
    assertions:
      - file: .github/workflows/release.yaml
        path: .on.workflow_run.workflows
        equals: ['CI']
        reason: release must trigger from CI
      - file: .github/workflows/release.yaml
        path: .on.workflow_run.branches
        equals: [main]
        reason: release must be limited to main
      - file: .github/workflows/release.yaml
        path: .on.workflow_run.types
        equals: [completed]
        reason: release workflow_run type must be completed
      - file: .github/workflows/release.yaml
        path: .jobs.release.if
        equals: github.event.workflow_run.conclusion == 'success'
        reason: release job must require CI success
      - file: .github/workflows/release.yaml
        path: .concurrency.group
        equals: release
        reason: release concurrency group must be release
