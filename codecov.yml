# Coverage statuses are informational (non-blocking): they annotate PRs but never
# fail CI. Thresholds are stated explicitly so the allowed drop is unambiguous.
coverage:
  status:
    project:
      default:
        target: auto # compare against the base commit
        threshold: 1% # tolerate up to a 1% project coverage drop
        informational: true
    patch:
      default:
        target: auto # coverage expected on the changed lines
        threshold: 1% # tolerate up to a 1% patch coverage drop
        informational: true

# One flag per tier, each scoped to the same source the tier's local ledger measures, so the
# uploaded trend and the blocking local threshold are reading the same thing. Tiers are never
# merged into a single number.
flags:
  unit:
    paths:
      - src/lib/
    carryforward: true
  int:
    paths:
      - src/adapters/
    carryforward: true

comment:
  layout: 'reach, diff, flags, files'
  require_changes: false
