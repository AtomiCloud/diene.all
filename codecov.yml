# Coverage annotations are informational; explicit thresholds document allowed drops without blocking CI.
coverage:
  status:
    project:
      default:
        target: auto # compare against the base commit
        threshold: 1% # tolerate up to a 1% project coverage drop
        informational: true
    patch:
      default:
        target: auto # coverage expected on the changed lines
        threshold: 1% # tolerate up to a 1% patch coverage drop
        informational: true

# Keep each uploaded flag scoped to the source measured by its blocking local ledger.
flags:
  unit:
    paths:
      - src/lib/
    carryforward: true
  int:
    paths:
      - src/adapters/
    carryforward: true

comment:
  layout: 'reach, diff, flags, files'
  require_changes: false
