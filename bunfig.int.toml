[test]
root = "tests/integration"
timeout = 120000
# All-files scoping: loads every src/adapters module so an untested adapter is a 0% row rather than
# an absent one the threshold cannot see.
preload = ["./tests/support/int-ledger.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
# Int ledger = the adapters tier only; the domain is the unit ledger, the glue is not an adapter, tests/** never counts.
coveragePathIgnorePatterns = ["src/index.ts", "src/lib/**", "tests/**"]
# Every adapter path is reachable from a container or a rogue-endpoint test, so the tier is held at
# 100%. Scalar form only: bun 1.3.13 parses the table forms and then ignores them, exiting 0 under
# target. Measured, not assumed.
coverageThreshold = 1.0
