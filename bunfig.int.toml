[test]
root = "tests/integration"
timeout = 120000
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
# Int ledger = the adapters tier only; the domain is the unit ledger, the glue is not an adapter,
# src/config is the schema composition root (declaration only, proven through the adapters that read it),
# and tests/** never counts.
coveragePathIgnorePatterns = ["src/index.ts", "src/lib/**", "src/config/**", "tests/**"]
