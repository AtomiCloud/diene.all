[test]
root = "tests/integration"
timeout = 120000
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
# Int ledger = browser/framework adapters only; domain and public entry glue belong to other ledgers.
coveragePathIgnorePatterns = ["src/entries/**", "src/index.ts", "src/lib/**", "src/test-helper/**", "tests/**"]
