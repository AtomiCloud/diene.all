[test]
root = "tests/integration"
coverageReporter = ["text", "lcov"]
coverageDir = "coverage/int"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/index.ts", "src/lib/**", "tests/**"]

# Real containers; the first run of a lane pulls the image.
timeout = 120000

# Imports every src/adapters module so an untested one is measured at 0% rather than absent.
preload = ["./tests/support/int-ledger.ts"]

# Scalar form only: Bun 1.3.13 does not enforce the per-metric object.
coverageThreshold = 1.0
