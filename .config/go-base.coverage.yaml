tiers:
  unit:
    tests: ./tests/unit/...
    packages: ./lib/...
    pathMarker: /lib/
    threshold: 100
  int:
    tests: ./tests/int/...
    packages: ./adapters/...
    pathMarker: /adapters/
    # 85% is sanctioned because healthy envtest/MinIO cannot deterministically schedule residual transport-failure and defensive-marshal branches; all functional paths and injected faults remain covered.
    threshold: 85
