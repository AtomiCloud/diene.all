coverage:
  unit:
    minimum: 100
    projects:
      - UnitTest/UnitTest.csproj
    include:
      - '[Lib*]*'
    exclude:
      - '[App*]*'
      - '[*.TestHelper]*'
      - '[*]*.Program'
  int:
    minimum: 80
    projects:
      - IntTest/IntTest.csproj
    include:
      - '[App*]*'
    exclude:
      - '[Lib*]*'
      - '[*]*.Program'
  # Dormant until a descendant opts into a TestHelper. The shared filter and
  # threshold live here once; that descendant only registers its meta test project.
  meta:
    minimum: 100
    projects: []
    include:
      - '[*.TestHelper]*'
    exclude:
      - '[Lib*]*'
      - '[App*]*'
      - '[*]*.Program'
