# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      # ### dart-auth-engine-setup
      # #### source: lib/dart/auth-engine
      - flutter pub get
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### dart-auth-engine-tasks
  # #### source: lib/dart/auth-engine
  analyze:
    desc: Analyze the package source and tests
    cmds:
      - flutter analyze

  format:
    desc: Format Dart sources
    cmds:
      - dart format .

  format:check:
    desc: Verify Dart formatting
    cmds:
      - dart format --output=none --set-exit-if-changed .

  test:
    desc: Run unit, conformance, and meta tests
    cmds:
      - flutter test

  test:coverage:
    desc: Run tests with the unit coverage ledger (excludes the TestHelper)
    cmds:
      - flutter test --coverage
      - bun tool/coverage_ledger.ts coverage/lcov.info unit 80 --include lib/src --exclude test_helper --exclude /logto/

  test:meta:
    desc: Run the meta tier over the TestHelper with the meta coverage ledger
    cmds:
      - flutter test --coverage test/meta
      - bun tool/coverage_ledger.ts coverage/lcov.info meta 85 --include lib/src/test_helper

  deadcode:
    desc: Two-pass dead-code gate (no exclusion lists)
    cmds:
      - ./scripts/validate/deadcode.sh

  guard:manifest:
    desc: Verify pubspec version matches VERSION (and an optional tag)
    cmds:
      - ./scripts/validate/manifest-tag.sh

  publish:dryrun:
    desc: Validate package hygiene without publishing
    cmds:
      - flutter pub publish --dry-run

  gates:
    desc: Run the full host-safe gate chain
    cmds:
      - ./scripts/ci/test.sh
