# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      # ### flutter-base-setup
      # #### source: flutter-base
      - flutter pub get
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### flutter-base-tasks
  # #### source: flutter-base
  mobile:analyze:
    desc: Analyze Flutter source and tests
    cmds:
      - flutter analyze

  mobile:test:
    desc: Run Flutter unit and widget tests
    cmds:
      - flutter test

  mobile:build-flavors:
    desc: Build all four Android flavor smoke artifacts
    cmds:
      - ./scripts/validate/flavor-builds.sh

  mobile:generate-sdk:
    desc: Regenerate the typed OA3 client
    cmds:
      - ./scripts/local/generate-sdk.sh

  mobile:generate-translations:
    desc: Regenerate typed Slang translations
    cmds:
      - ./scripts/local/generate-translations.sh

  mobile:generate-config:
    desc: Regenerate the Flutter config schema
    cmds:
      - ./scripts/local/generate-config-schema.sh

  mobile:doctor-signing:
    desc: Run locally provable signing and stamp doctors
    cmds:
      - ./scripts/validate/signing-doctors.sh

  mobile:register-apple:
    desc: Register Apple identifiers, groups, capabilities, and app records
    cmds:
      - ./scripts/local/register-apple.sh
