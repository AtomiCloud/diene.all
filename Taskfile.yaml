# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - dart pub get
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### dart-lib-tasks
  # #### source: lib/dart/problems
  analyze:
    desc: Analyze Dart source and tests
    cmds:
      - dart analyze

  test:
    desc: Run Dart unit tests
    cmds:
      - dart test

  test:coverage:
    desc: Run Dart tests with coverage (lcov input for the coverage ledger)
    cmds:
      - dart test --coverage=coverage
      - dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

  test:meta:
    desc: Run the meta tier (assert-the-asserter over test_helper.dart)
    cmds:
      - dart test test/meta

  deadcode:
    desc: 'Deadcode pass 1 — whole package (lib + test)'
    cmds:
      - dart analyze

  deadcode:no-tests:
    desc: 'Deadcode pass 2 — production only (lib)'
    cmds:
      - dart analyze lib

  manifest:check:
    desc: Verify pubspec version matches tag (manifest==tag guard). Set TAG=vX.Y.Z
    cmds:
      - ./scripts/validate/manifest-tag.sh ${TAG}

  publish:dry-run:
    desc: Validate the package shape without publishing
    cmds:
      - dart pub publish --dry-run
