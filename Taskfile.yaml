# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: lithium
      NAMESPACE: lithium-lapras-001
      LANDSCAPE: example
      CLUSTER: lapras

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - skills-sync sync

  build:
    desc: Vendor config and build chart dependencies
    cmds:
      - ./scripts/local/vendor-chart-config.sh
      - helm dependency build chart

  update:
    desc: Refresh the pinned upstream chart dependency
    cmds:
      - helm dependency update chart

  latest:
    desc: Resolve the latest real upstream chart and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:
    desc: Run the Lithium host-safe validation tier
    cmds:
      - ./scripts/ci/lithium.sh

  test:unit:
    desc: Run schema, lint, render, policy, and contract validation
    cmds:
      - ./scripts/ci/lithium.sh

  test:int:
    desc: Run the local k3d installation proof
    cmds:
      - K3D_ISOLATE_BY_PATH=true ./scripts/validate/lithium-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
