# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Resolve dependencies and synchronize generated workspace assets
    cmds:
      - dart pub get
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### lib-dart-tasks
  # #### source: lib/dart/api-engine
  analyze:
    desc: Analyze library and test sources
    cmds:
      - dart analyze

  format:
    desc: Check Dart formatting
    cmds:
      - dart format --output=none --set-exit-if-changed lib test

  test:
    desc: Run unit, C0-conformance, and meta suites
    cmds:
      - dart test

  test:coverage:
    desc: Run tests with coverage collection (generated code ignored)
    cmds:
      - dart test --coverage=coverage
      - dart run coverage:format_coverage --lcov --check-ignore --in=coverage --out=coverage/lcov.info --report-on=lib

  test:meta:
    desc: Run the meta tier (TestHelper assertions, parity, fixtures)
    cmds:
      - dart test test/meta

  deadcode:
    desc: Two dead-code passes (as-is + production only), no exclusion lists
    cmds:
      - ./scripts/validate/deadcode.sh

  manifest-guard:
    desc: Verify pubspec/VERSION/tag agree, and drill the negative path
    cmds:
      - ./scripts/validate/manifest-tag.sh check
      - ./scripts/validate/manifest-tag.sh selftest

  generate-sdk:
    desc: Regenerate the typed OA3 client from the reviewed spec
    cmds:
      - ./scripts/local/generate-sdk.sh

  publish:dry-run:
    desc: Validate package hygiene without publishing (0 warnings; hints allowed)
    cmds:
      - ./scripts/validate/publish-dry-run.sh
