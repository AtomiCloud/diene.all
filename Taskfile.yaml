# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml
  # ### dart-result-test-includes
  # #### source: lib/dart/result
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  meta:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: meta

tasks:
  setup:
    desc: Resolve Dart dependencies and synchronize installed package skills
    cmds:
      - ./scripts/ci/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### dart-result-tasks
  # #### source: lib/dart/result
  clean:
    desc: Remove Dart dependency, build, coverage, and generated-doc artifacts
    cmds:
      - rm -rf .dart_tool build coverage doc/api

  build:
    desc: Validate the publishable Dart library and example
    deps: [setup]
    cmds:
      - dart analyze --fatal-infos lib example

  analyze:
    desc: Analyze library source, tests, and tooling
    deps: [setup]
    cmds:
      - dart analyze --fatal-infos

  deadcode:
    desc: Run repository and production-only dead-code passes
    cmds:
      - ./scripts/local/deadcode.sh

  package:validate:
    desc: Validate package metadata, pana score, and pub.dev dry-run contents
    cmds:
      - ./scripts/ci/package-validate.sh

  test:
    desc: Run unit/C0 and TestHelper meta suites without coverage
    cmds:
      - task: unit:default
      - task: meta:default

  test:unit:
    desc: Run unit and C0 conformance suites without coverage
    cmds:
      - task: unit:default

  test:int:
    desc: No-op because this dependency-free package has no integration tier
    cmds:
      - echo 'No integration tier for diene_result.'

  test:meta:
    desc: Run assert-the-asserter tests for TestHelper
    cmds:
      - task: meta:default

  test:coverage:
    desc: Run every coverage-capable tier with its isolated ledger
    cmds:
      - task: unit:coverage
      - task: meta:coverage

  test:unit:coverage:
    desc: Run unit and C0 tests with the unit-only coverage ledger
    cmds:
      - task: unit:coverage

  test:int:coverage:
    desc: No-op because this dependency-free package has no integration tier
    cmds:
      - echo 'No integration coverage tier for diene_result.'

  test:meta:coverage:
    desc: Run TestHelper meta tests with the helper-only coverage ledger
    cmds:
      - task: meta:coverage

  test:watch:
    desc: Re-run the fast unit and C0 suites when Dart files change
    cmds:
      - ./scripts/local/watch-tests.sh
