version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    # Releaser v2 hard-renamed its config; keep the explicit path beside the
    # binary move so setup never depends on a stale default. Skills sync is the
    # only writer of the vendor tree and setup is its repair-capable tier.
    cmds:
      - releaser conventions -c release.yaml
      - skills-sync sync --tier setup

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
