version: '3'

includes:
  # ### dotnet-base-test-includes
  # #### source: dotnet-base
  test:unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  test:int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
  # This node carries a third tier the parent does not (it holds a TestHelper
  # project). It is named into the parent's `test:<tier>` include scheme rather
  # than left as a bare `meta:`, so `test:meta`, `test:meta:coverage` and
  # `test:meta:watch` derive from the include exactly as the other two tiers do.
  test:meta:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: meta

tasks:
  setup:
    desc: Set up the workspace
    cmds:
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Verify the repository's explicit no-runtime skills contract
    cmds:
      - skills-sync sync

  # ### dotnet-base-tasks
  # #### source: dotnet-base
  clean:
    desc: Remove .NET build and test artifacts
    cmds:
      - find . -mindepth 2 -maxdepth 2 -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
      - rm -rf TestResults

  build:
    desc: Build the .NET solution in Release
    cmds:
      - ./scripts/local/build.sh

  dev:
    desc: Watch and run the sample App in development mode
    cmds:
      - dotnet watch --project App/App.csproj run -- {{.CLI_ARGS}}

  run:
    desc: Run the sample App in development mode
    cmds:
      - dotnet run --project App/App.csproj -- {{.CLI_ARGS}}

  preview:
    desc: Build and run the compiled Release artifact
    deps: [build]
    cmds:
      - dotnet App/bin/Release/net10.0/App.dll {{.CLI_ARGS}}

  up:
    desc: Confirm the harness needs no local dependencies
    cmds:
      - echo "No local dependencies; SIT uses in-process or Garden."

  down:
    desc: Confirm there are no local dependencies to stop
    cmds:
      - echo "No local dependencies to stop."

  deadcode:
    desc: Emit the non-blocking LLM dead-code review
    cmds:
      - ./scripts/local/dotnet-dead-code.sh --llm

  test:
    desc: Run unit, integration, and TestHelper meta tests
    cmds:
      - task: test:unit
      - task: test:int
      - task: test:meta

  test:coverage:
    desc: Run every test tier with merged blocking coverage
    cmds:
      - task: test:unit:coverage
      - task: test:int:coverage
      - task: test:meta:coverage
