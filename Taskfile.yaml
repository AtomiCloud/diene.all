# ### workspace-root
# #### source: workspace
version: '3'

vars:
  # ### bun-consumer-identity
  # #### source: bun-consumer
  ARTIFACT:
    sh: jq -r '.bin | to_entries[0].key' package.json

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  # ### bun-base-test-includes
  # #### source: bun-base
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
      CONFIG: bunfig.unit.toml
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int
      CONFIG: bunfig.int.toml
  # ### bun-consumer-test-includes
  # #### source: bun-consumer
  sit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: sit
      CONFIG: bunfig.sit.toml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh
      # ### bun-base-setup
      # #### source: bun-base
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### bun-base-tasks
  # #### source: bun-base
  clean:
    desc: Remove Bun build, dependency, and coverage artifacts
    cmds:
      - rm -rf dist coverage
      - '[ -d node_modules ] && find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true'

  build:
    desc: Build the Bun bundle to dist/
    cmds:
      - ./scripts/local/build.sh

  deadcode:
    desc: Review strict and LLM-assisted dead-code findings
    cmds:
      - ./scripts/local/deadcode.sh

  test:
    desc: Run unit, integration, and SIT suites without coverage
    cmds:
      - task: unit:default
      - task: int:default
      - task: test:sit

  test:unit:
    desc: Run the unit suite without coverage
    cmds:
      - task: unit:default

  test:int:
    desc: Run the integration suite without coverage
    cmds:
      - task: int:default

  test:coverage:
    desc: Run every coverage-capable suite with coverage
    cmds:
      - task: unit:coverage
      - task: int:coverage
      - task: test:sit:coverage

  test:unit:coverage:
    desc: Run the unit suite with coverage
    cmds:
      - task: unit:coverage

  test:int:coverage:
    desc: Run the integration suite with coverage
    cmds:
      - task: int:coverage

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - task: unit:watch

  run:
    desc: Run the Bun consumer source entry point
    cmds:
      - ./scripts/local/run.sh {{.CLI_ARGS}}

  preview:
    desc: Compile and run the Bun consumer artifact
    cmds:
      - ./scripts/local/preview.sh {{.CLI_ARGS}}

  # ### bun-consumer-tasks
  # #### source: bun-consumer
  dev:
    desc: Run the worker with hot reload against the local dependency stack
    cmds:
      - ./scripts/local/dev.sh {{.CLI_ARGS}}

  up:
    desc: Start every local dependency and telemetry backend
    cmds:
      - ./scripts/local/up.sh

  down:
    desc: Stop every local dependency and telemetry backend
    cmds:
      - ./scripts/local/down.sh

  test:sit:
    desc: Run black-box journeys through the compiled binary
    cmds:
      - ./scripts/local/test-sit.sh binary

  test:sit:coverage:
    desc: Run SIT journeys in-process with coverage
    cmds:
      - ./scripts/local/test-sit.sh coverage
