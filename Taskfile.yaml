# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: cert-manager
      LANDSCAPE: lapras

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  test:
    desc: Run the zinc unit/static tier
    cmds:
      - ./scripts/ci/zinc.sh

  test:unit:
    desc: Run schema, lint, render, labels, LE-directory map, issuer, ENTEI, no-Certificate, VAP, and publish validation
    cmds:
      - ./scripts/ci/zinc.sh

  test:int:
    desc: Run the k3d integration tier (ClusterIssuers apply with CRDs present)
    cmds:
      - ./scripts/validate/zinc-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
