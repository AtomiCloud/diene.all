# ### workspace-root
# #### source: workspace
version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml

  # ### go-base-test-includes
  # #### source: go-base
  gotest:
    taskfile: tasks/Taskfile.test.yaml
    internal: true

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh
      # ### go-base-setup
      # #### source: go-base
      - go mod download

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### go-base
  # #### source: go-base
  clean:
    desc: Remove Go build, coverage, and report outputs
    cmds:
      - rm -rf dist coverage reports

  build:
    desc: Build the Go binary
    cmds:
      - ./scripts/local/build.sh

  typecheck:
    desc: Typecheck Go source packages
    cmds:
      - ./scripts/local/typecheck.sh

  deadcode:
    desc: Run strict Go deadcode passes and the LLM-lax report
    cmds:
      - ./scripts/local/deadcode.sh strict

  test:
    desc: Run unit, integration, and system integration tiers
    deps: [test:unit, test:int, test:sit]

  test:unit:
    desc: Run black-box unit tests
    cmds:
      - task: gotest:run
        vars: { MODE: unit }

  test:int:
    desc: Run adapter integration tests
    cmds:
      - task: gotest:run
        vars: { MODE: int }

  test:coverage:
    desc: Run every coverage ledger
    deps: [test:unit:coverage, test:int:coverage]

  test:unit:coverage:
    desc: Enforce the unit coverage ledger
    cmds:
      - task: gotest:run
        vars: { MODE: unit, COVERAGE: 'true' }

  test:int:coverage:
    desc: Enforce the integration coverage ledger
    cmds:
      - task: gotest:run
        vars: { MODE: int, COVERAGE: 'true' }

  test:watch:
    desc: Re-run unit tests when Go files change
    cmds:
      - task: gotest:run
        vars: { MODE: unit, WATCH: 'true' }

  # ### go-consumer-tasks
  # #### source: go-consumer
  dev:
    desc: Run the worker against the local dependency stack
    cmds:
      - ./scripts/local/dev.sh {{.CLI_ARGS}}

  run:
    desc: Run the Go consumer source entry point
    cmds:
      - ./scripts/local/run.sh {{.CLI_ARGS}}

  preview:
    desc: Build and run the compiled Go consumer artifact
    cmds:
      - ./scripts/local/preview.sh {{.CLI_ARGS}}

  up:
    desc: Start every local dependency
    cmds:
      - ./scripts/local/up.sh

  down:
    desc: Stop every local dependency
    cmds:
      - ./scripts/local/down.sh

  test:sit:
    desc: Run black-box journeys through the compiled binary
    cmds:
      - ./scripts/local/test-sit.sh binary

  test:sit:parity:
    desc: Run compiled and in-process SIT drivers and require parity
    cmds:
      - ./scripts/local/test-sit.sh parity

  schema:gen:
    desc: Regenerate the Go consumer configuration schema
    cmds:
      - ./scripts/local/schema-gen.sh

  problems:export:
    desc: Export the Go consumer problem catalog for the primordial chart
    cmds:
      - ./scripts/local/problems-export.sh
