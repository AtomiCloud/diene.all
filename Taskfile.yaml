# ### workspace-root
# #### source: workspace
version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      # ### dart-lib-setup
      # #### source: dart-lib
      - dart pub get
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### dart-lib-tasks
  # #### source: dart-lib
  analyze:
    desc: Analyze the library and tests
    cmds:
      - dart analyze

  test:
    desc: Run the full test suite (unit + meta)
    cmds:
      - dart test

  test:unit:
    desc: Run the unit tier only
    cmds:
      - dart test test/unit

  test:meta:
    desc: Run the meta tier (TestHelper code) only
    cmds:
      - dart test test/meta

  coverage:
    desc: Unit coverage ledger over product code only (TestHelper excluded)
    cmds:
      - rm -rf coverage/unit
      - dart test test/unit --coverage=coverage/unit
      - >-
        dart run coverage:format_coverage
        --packages=.dart_tool/package_config.json
        --report-on=lib/diene_e2e.dart --report-on=lib/src/app_handoff
        -i coverage/unit -o coverage/unit.lcov --lcov
      - ./scripts/ci/coverage-report.sh coverage/unit.lcov unit

  coverage:meta:
    desc: Meta coverage ledger over TestHelper code only
    cmds:
      - rm -rf coverage/meta
      - dart test test/meta --coverage=coverage/meta
      - >-
        dart run coverage:format_coverage
        --packages=.dart_tool/package_config.json
        --report-on=lib/test_helper.dart --report-on=lib/src/stub
        --report-on=lib/src/journey --report-on=lib/src/assertions
        -i coverage/meta -o coverage/meta.lcov --lcov
      - ./scripts/ci/coverage-report.sh coverage/meta.lcov meta

  deadcode:
    desc: Dead-code pass 1 — whole package (as-is, tests included)
    cmds:
      - dart analyze .

  deadcode:no-tests:
    desc: Dead-code pass 2 — library only (excluding tests), no exclusion lists
    cmds:
      - dart analyze lib

  publish:dry-run:
    desc: Validate package hygiene without publishing
    cmds:
      - dart pub publish --dry-run
