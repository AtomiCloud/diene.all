version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml

tasks:
  setup:
    desc: Set up generated workspace assets
    # `releaser conventions` takes no config path and reads `atomi_release.yaml`
    # from the working directory.
    cmds:
      - releaser conventions

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files
