# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: carbon
      NAMESPACE: feature-carbon-123
      LANDSCAPE: example
      CLUSTER: lapras

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  test:
    desc: Run the Carbon host-safe validation tier
    cmds:
      - ./scripts/ci/carbon.sh

  test:unit:
    desc: Run schema, lint, render, policy, and contract validation
    cmds:
      - ./scripts/ci/carbon.sh

  test:int:
    desc: Run the local k3d installation proof
    cmds:
      - K3D_ISOLATE_BY_PATH=true ./scripts/validate/carbon-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
