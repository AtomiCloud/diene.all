# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: sulfur
      NAMESPACE: cert-manager
      LANDSCAPE: example
      CLUSTER: lapras

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  build:
    desc: Vendor and build the pinned cert-manager dependency
    cmds:
      - ./scripts/local/vendor-cert-manager.sh build

  update:
    desc: Refresh the pinned upstream chart dependency
    cmds:
      - ./scripts/local/vendor-cert-manager.sh update

  latest:
    desc: Resolve the latest real upstream chart and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:
    desc: Run the sulfur unit/static tier
    cmds:
      - ./scripts/ci/sulfur.sh

  test:unit:
    desc: Run schema, lint, render, policy, gateway, boundary, and upgrade validation
    cmds:
      - ./scripts/ci/sulfur.sh

  test:int:
    desc: Run the k3d integration tier (engine health + self-signed Certificate)
    cmds:
      - ./scripts/validate/sulfur-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
