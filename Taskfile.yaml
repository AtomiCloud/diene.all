# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: platinum
      NAMESPACE: sulfoxide
      LANDSCAPE: example
      CLUSTER: lapras

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  build:
    desc: Build chart dependencies (platinum is config-free; no config vendoring)
    cmds:
      - helm dependency build chart

  update:
    desc: Refresh the pinned upstream chart dependencies (kgateway + kgateway-crds)
    cmds:
      - helm dependency update chart

  latest:
    desc: Resolve the latest real upstream kgateway chart, CRD, and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:
    desc: Run the platinum unit/static tier
    cmds:
      - ./scripts/ci/platinum.sh

  test:unit:
    desc: Run schema, lint, render, VAP, gateway, LB, and publish dry-run validation
    cmds:
      - ./scripts/ci/platinum.sh

  test:int:
    desc: Run the local k3d installation + Gateway Programmed proof
    cmds:
      - ./scripts/validate/platinum-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
