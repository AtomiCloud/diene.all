# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  pichu:local:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: sample
      LANDSCAPE: pichu
      CLUSTER: local
  entei:local:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: zinc
      NAMESPACE: sample
      LANDSCAPE: entei
      CLUSTER: local

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  build:
    desc: Render the own-resource chart
    cmds:
      - helm template zinc chart --namespace sample --values chart/values.pichu.yaml --values chart/values.local.yaml >/dev/null

  test:
    desc: Run the zinc unit/static tier
    cmds:
      - ./scripts/ci/zinc.sh

  test:unit:
    desc: Run schema, lint, render, contract, and policy validation
    cmds:
      - ./scripts/ci/zinc.sh

  test:int:
    desc: Run the serialized k3d CRD/apply proof
    cmds:
      - ./scripts/validate/zinc-k3d.sh

  start:cluster:
    desc: Start the ownership-safe local k3d proof cluster
    cmds:
      - ./scripts/local/k3d-lifecycle.sh start

  stop:cluster:
    desc: Delete only the locally owned k3d proof cluster
    cmds:
      - ./scripts/local/k3d-lifecycle.sh stop
