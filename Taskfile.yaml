# ### workspace-root
# #### source: workspace
version: '3'

includes:
  docker: tasks/Taskfile.docker.yaml
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml

  # ### dotnet-base-test-includes
  # #### source: dotnet-base
  unit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: unit
  int:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: int

  # ### dotnet-api-sit-include
  # #### source: dotnet-api
  sit:
    taskfile: tasks/Taskfile.test.yaml
    vars:
      MODE: sit

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh
      # ### dotnet-base-setup
      # #### source: dotnet-base
      - ./scripts/local/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  # ### dotnet-base-tasks
  # #### source: dotnet-base
  clean:
    desc: Remove .NET build and test artifacts
    cmds:
      - find . -mindepth 2 -maxdepth 2 -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
      - rm -rf TestResults

  build:
    desc: Build the .NET solution in Release
    cmds:
      - ./scripts/local/build.sh

  dev:
    desc: Watch and run the sample App in development mode
    cmds:
      - dotnet watch --project App/App.csproj run -- {{.CLI_ARGS}}

  run:
    desc: Run the sample App in development mode
    cmds:
      - dotnet run --project App/App.csproj -- {{.CLI_ARGS}}

  preview:
    desc: Build and run the compiled Release artifact
    deps: [build]
    cmds:
      - dotnet App/bin/Release/net10.0/App.dll {{.CLI_ARGS}}

  up:
    desc: Start all local dependencies, detached
    cmds:
      - docker run -d --rm --name dotnet-base-redis -p 6379:6379 redis:8.2.1-alpine

  down:
    desc: Stop all local dependencies
    cmds:
      - docker stop dotnet-base-redis 2>/dev/null || true

  deadcode:
    desc: Emit the non-blocking LLM dead-code review
    cmds:
      - ./scripts/local/dotnet-dead-code.sh --llm

  test:
    desc: Run unit and integration tests
    cmds:
      - task: unit:default
      - task: int:default

  test:unit:
    desc: Run unit tests
    cmds:
      - task: unit:default

  test:int:
    desc: Run integration tests
    cmds:
      - task: int:default

  test:coverage:
    desc: Run every test tier with merged blocking coverage
    cmds:
      - task: unit:coverage
      - task: int:coverage

  test:unit:coverage:
    desc: Run unit tests with merged blocking coverage
    cmds:
      - task: unit:coverage

  test:int:coverage:
    desc: Run integration tests with merged blocking coverage
    cmds:
      - task: int:coverage

  test:watch:
    desc: Watch the fast unit suite
    cmds:
      - task: unit:watch

  # ### dotnet-api-sit-task
  # #### source: dotnet-api
  test:sit:
    desc: Run the Bruno SIT collection against the castform preview
    cmds:
      - task: sit:sit

  # ### dotnet-api-maintenance-tasks
  # #### source: dotnet-api
  # Build-time commands, not deployment run modes. A deployment only ever runs
  # `server` or `db-init`.
  config:schema:
    desc: Regenerate the configuration schema from the registered option blocks
    cmds:
      - dotnet run --project App/App.csproj -- config:schema

  config:schema:verify:
    desc: Fail when the generated configuration schema has drifted
    cmds:
      - dotnet run --project App/App.csproj -- config:schema:verify

  config:validate:
    desc: Bind and validate every config block against the final merged layer
    cmds:
      - dotnet run --project App/App.csproj -- config:validate

  problems:export:
    desc: Export the Problem catalog resources into the primordial chart
    cmds:
      - dotnet run --project App/App.csproj -- problems:export

  problems:verify:
    desc: Fail when the exported Problem catalog has drifted
    cmds:
      - dotnet run --project App/App.csproj -- problems:verify

  db:init:
    desc: Run the one-shot db-init path against the local dependencies
    cmds:
      - dotnet run --project App/App.csproj -- db-init
