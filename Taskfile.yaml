version: '3'

includes:
  secret: tasks/Taskfile.secret.yaml

tasks:
  setup:
    desc: Resolve Dart dependencies and synchronized skills
    cmds:
      - ./scripts/ci/setup.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  format:
    desc: Format Dart source
    cmds:
      - dart format lib test example

  analyze:
    desc: Analyze library, tests, and examples
    cmds:
      - dart analyze

  test:
    desc: Run unit, C0 conformance, and TestHelper meta tiers
    deps: [test:unit, test:meta]

  test:unit:
    desc: Run unit and C0 conformance tests
    cmds:
      - dart test test/unit test/conformance

  test:meta:
    desc: Run dependency-light TestHelper meta tests
    cmds:
      - dart test test/meta

  test:coverage:
    desc: Enforce unit and meta coverage ledgers
    deps: [test:unit:coverage, test:meta:coverage]

  test:unit:coverage:
    desc: Enforce production-library coverage
    cmds:
      - ./scripts/validate/coverage.sh unit

  test:meta:coverage:
    desc: Enforce TestHelper-only coverage
    cmds:
      - ./scripts/validate/coverage.sh meta

  deadcode:
    desc: Run whole-repository and production-only dead-code passes
    cmds:
      - ./scripts/validate/deadcode.sh all
      - ./scripts/validate/deadcode.sh production

  package:validate:
    desc: Validate pub.dev package hygiene and score
    cmds:
      - dart pub publish --dry-run
      - dart run pana --exit-code-threshold 20 .

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh
