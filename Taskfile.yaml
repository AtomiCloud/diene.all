# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  lapras:k3d:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: xenon
      NAMESPACE: sample
      LANDSCAPE: lapras
      CLUSTER: k3d

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  build:
    desc: Build chart dependencies
    cmds:
      - ./scripts/local/vendor-metrics-server.sh build

  update:
    desc: Refresh the pinned upstream chart dependency
    cmds:
      - ./scripts/local/vendor-metrics-server.sh update

  latest:
    desc: Resolve the latest real upstream chart and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:
    desc: Run the xenon unit/static tier
    cmds:
      - ./scripts/ci/xenon.sh

  test:unit:
    desc: Run schema, lint, render, policy, toggle, and contract validation
    cmds:
      - ./scripts/ci/xenon.sh

  test:int:
    desc: Run the SIT integration tier (install + kubectl top; orchestration-authorized)
    cmds:
      - ./scripts/validate/xenon-sit.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh
