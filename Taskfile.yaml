version: '3'

tasks:
  setup:
    desc: Resolve Dart package dependencies
    cmds:
      - dart pub get

  format:
    desc: Verify Dart formatting
    cmds:
      - dart format --output=none --set-exit-if-changed lib test

  analyze:
    desc: Analyze package source and tests
    cmds:
      - dart analyze

  test:unit:
    desc: Run unit and C0 conformance tests
    cmds:
      - dart test test/unit test/conformance

  test:unit:coverage:
    desc: Run unit and C0 tests with scoped coverage
    cmds:
      - ./scripts/local/coverage.sh unit

  test:meta:
    desc: Test the dependency-light TestHelper implementation
    cmds:
      - dart test test/meta

  test:meta:coverage:
    desc: Run TestHelper meta tests with scoped coverage
    cmds:
      - ./scripts/local/coverage.sh meta

  test:coverage:
    desc: Run both blocking coverage ledgers
    cmds:
      - ./scripts/local/coverage.sh unit
      - ./scripts/local/coverage.sh meta

  deadcode:whole:
    desc: Run whole-package dead-code analysis with tests
    cmds:
      - ./scripts/validate/dead-code.sh whole

  deadcode:production:
    desc: Run production-only dead-code analysis
    cmds:
      - ./scripts/validate/dead-code.sh production

  deadcode:
    desc: Run both strict dead-code passes
    cmds:
      - ./scripts/validate/dead-code.sh whole
      - ./scripts/validate/dead-code.sh production

  version:check:
    desc: Verify the manifest version against a tag
    cmds:
      - ./scripts/validate/publish-version.sh v$(cat VERSION)

  publish:dry-run:
    desc: Validate pub.dev package hygiene without publishing
    cmds:
      - dart pub publish --dry-run

  lint:
    desc: Run every registered repository gate
    cmds:
      - pre-commit run --all-files
