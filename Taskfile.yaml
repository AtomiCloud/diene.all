# ### workspace-root
# #### source: workspace
version: '3'

includes:
  helm: tasks/Taskfile.helm.yaml
  secret: tasks/Taskfile.secret.yaml
  example:lapras:
    taskfile: tasks/Taskfile.cluster.yaml
    vars:
      RELEASE_NAME: helm-wrapper
      NAMESPACE: sample
      LANDSCAPE: example
      CLUSTER: lapras

tasks:
  setup:
    desc: Set up generated workspace assets
    cmds:
      - ./scripts/local/skills-sync.sh

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  skills:sync:
    desc: Synchronize installed diene package skills
    cmds:
      - ./scripts/local/skills-sync.sh

  build:
    desc: Vendor config and build chart dependencies
    cmds:
      - ./scripts/local/vendor-chart-config.sh
      - helm dependency build chart

  update:
    desc: Refresh the pinned upstream chart dependency
    cmds:
      - helm dependency update chart

  latest:
    desc: Resolve the latest real upstream chart and image tags
    cmds:
      - ./scripts/local/latest-chart-upstreams.sh

  test:
    desc: Run the Helm wrapper unit/static tier
    cmds:
      - ./scripts/ci/helm-wrapper.sh

  test:unit:
    desc: Run schema, lint, render, policy, and contract validation
    cmds:
      - ./scripts/ci/helm-wrapper.sh

  test:int:
    desc: Run the local k3d installation proof
    cmds:
      - ./scripts/validate/helm-wrapper-k3d.sh

  start:cluster:
    desc: Start the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/create-k3d-cluster.sh

  stop:cluster:
    desc: Delete the local k3d lapras proof cluster
    cmds:
      - ./scripts/local/delete-k3d-cluster.sh

  garden:render:
    desc: Render the profile-filtered sulfoxide baseline from the owning definitions
    cmds:
      - ./scripts/local/garden-render.sh {{.CLI_ARGS | default "all"}}

  garden:doctor:
    desc: Report included members, pins, and every omission reason
    cmds:
      - ./scripts/local/garden-doctor.sh definition {{.CLI_ARGS | default "all"}}

  garden:doctor:installed:
    desc: Compare an installed tuple against the owning definitions
    cmds:
      - ./scripts/local/garden-doctor.sh installed {{.CLI_ARGS | default "all"}}

  test:parity:
    desc: Run the Garden parity unit tier
    cmds:
      - ./scripts/ci/garden-parity.sh
