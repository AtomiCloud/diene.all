version: '3'

tasks:
  setup:
    desc: Resolve Dart package dependencies
    cmds:
      - dart pub get

  clean:
    desc: Remove generated package evidence
    cmds:
      - dart run tool/clean.dart

  build:
    desc: Validate the publishable Dart package artifact
    cmds:
      - dart pub publish --dry-run

  format:
    desc: Format Dart sources and tests
    cmds:
      - dart format lib/diene_core_utils.dart lib/src test tool

  format:check:
    desc: Check Dart formatting
    cmds:
      - dart format --output=none --set-exit-if-changed lib/diene_core_utils.dart lib/src test tool

  analyze:
    desc: Analyze package source and tests
    cmds:
      - dart analyze

  lint:
    desc: Run all repository gates
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run package unit and C0 conformance tests
    cmds:
      - task: test:unit

  test:unit:
    desc: Run package unit and C0 conformance tests
    cmds:
      - dart test

  test:int:
    desc: Report the intentionally absent integration tier
    cmds:
      - echo 'No integration tier; diene_core_utils is a pure value package.'

  test:meta:
    desc: Report the TestHelper=NO meta-tier verdict
    cmds:
      - echo 'No TestHelper; meta tier is an intentional no-op and uploads no meta flag.'

  test:coverage:
    desc: Run targeted unit coverage and enforce its threshold
    cmds:
      - task: test:unit:coverage

  test:unit:coverage:
    desc: Run targeted unit coverage and enforce its threshold
    cmds:
      - dart test --coverage=coverage
      - dart run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --in=coverage --lcov --out=coverage/lcov.info
      - dart run tool/check_coverage.dart coverage/lcov.info

  test:int:coverage:
    desc: Report the intentionally absent integration ledger
    cmds:
      - echo 'No integration coverage ledger for a pure value package.'

  test:meta:coverage:
    desc: Report the intentionally absent TestHelper ledger
    cmds:
      - echo 'No TestHelper coverage ledger and no empty meta upload.'

  test:watch:
    desc: Watch package tests
    cmds:
      - dart test --chain-stack-traces

  deadcode:
    desc: Run dead-code checks with and without tests
    cmds:
      - dart run tool/dead_code.dart --with-tests
      - dart run tool/dead_code.dart --production

  iana:verify:
    desc: Verify the IANA allowlist reproduces from the pinned vendored source
    cmds:
      - ./scripts/validate/iana-source.sh

  manifest:check:
    desc: Verify the package manifest equals a release tag
    cmds:
      - ./scripts/validate/manifest-tag.sh {{.CLI_ARGS}}

  publish:dry-run:
    desc: Validate pub.dev package hygiene without publishing
    cmds:
      - dart pub publish --dry-run
