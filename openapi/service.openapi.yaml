openapi: 3.0.3
info:
  title: Diene Sample Service
  version: 1.0.0
  description: >-
    Minimal reviewed OA3 input for the diene_api_engine SDK-wrapper boundary.
    The generated retrofit client is wrapped into Result/Problem by OA3Adapter.
servers:
  - url: https://service.platform.lapras.cluster.atomi.cloud
paths:
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Problem (RFC 9457).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    UserProfile:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
