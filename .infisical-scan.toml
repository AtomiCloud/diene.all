title = "Diene scanner exceptions"

[extend]
useDefault = true

# chart/README.md is regenerated by helm-docs on every chart build —
# scripts/ci/publish.sh runs `helm-docs --chart-search-root chart`. Generated
# helm-docs output cannot carry an inline `# gitleaks:allow` marker: helm-docs
# renders each default value into a Markdown table cell and rewrites the whole
# file from its template on every run, so any hand-added marker is discarded on
# the next regeneration. The deterministic public preview lease-key fixture
# (`p00000000000000000000000000`) therefore needs a path-scoped exception here.
#
# `condition = "AND"` makes BOTH scopes mandatory: the exception fires only when
# the finding is in `chart/README.md` AND matches the exact lease-key literal.
# The Infisical/gitleaks default is OR, under which the `regexes` branch alone
# would suppress this literal in ANY file — a silent blanket allow should the
# fixture ever leak into a path that carries no inline marker. AND restores the
# defense the two scopes are meant to provide: `paths` confines the exception to
# the generated file and `regexes` narrows it to the one literal, so neither
# scope can widen the exception on its own. The fixture's source locations —
# chart/values.yaml and probes/wrapper-lpsm-hostnames.ts — keep inline
# `# gitleaks:allow` markers instead, and a leak of the literal anywhere else is
# reported, not swallowed.
[allowlist]
description = "Public deterministic preview lease-key fixture rendered by helm-docs into chart/README.md; never a credential"
condition = "AND"
paths = [
  '''^chart/README\.md$''',
]
regexTarget = "match"
regexes = [
  '''p00000000000000000000000000''',
]
