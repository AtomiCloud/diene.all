# ### workspace-dependabot
# #### source: workspace
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: daily
  - package-ecosystem: helm
    directory: /infra/root_chart
    schedule:
      interval: daily

  # ### go-base-dependabot
  # #### source: go-base
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
