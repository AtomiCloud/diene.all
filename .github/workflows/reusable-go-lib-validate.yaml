# ### go-lib-reusable-validate
# #### source: go-lib
name: ⚡ Reusable Go Library Validate

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

jobs:
  validate:
    name: Go library ${{ inputs.mode }}
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-go@v2
      - name: Validate Go library
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/pkg-validate.sh "${VALIDATION_MODE}"
