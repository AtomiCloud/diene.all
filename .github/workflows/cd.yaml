# ### dart-lib-cd
# #### source: lib/dart/problems
name: CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish diene_problems
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-publish-dart.yaml
    secrets: inherit
