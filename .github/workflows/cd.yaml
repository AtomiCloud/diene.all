name: CD

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish diene_config to pub.dev
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/dart-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/dart"
          printf '%s' "$PUB_CREDENTIALS_JSON" > "$XDG_CONFIG_HOME/dart/pub-credentials.json"
      - name: Publish
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/dart-config
        run: nix develop .#ci -c ./scripts/ci/publish.sh "$GITHUB_REF_NAME"
