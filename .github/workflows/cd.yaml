# ### workspace-cd
# #### source: workspace
# A version tag is the ONLY trigger and it publishes everything this service ships: the
# image to ghcr.io and BOTH charts to the same OCI registry. There is no downstream bump,
# no dispatch chain, and no umbrella — Kargo promotes this service by editing its own row
# file, so this pipeline ends at the published artifacts (R20).
name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-dotnet-api
      dockerfile: ./infra/Dockerfile
      version: ${{ github.ref_name }}

  # ### dotnet-api-cd
  # #### source: dotnet-api
  # `github.ref_name` is the one semver: it is the image tag, both chart `Version` fields,
  # and both `appVersion` fields. Charts publish only after the image they describe exists,
  # so a tag can never leave a chart pointing at an image that failed to build.
  helm:
    name: Helm Charts
    needs: docker
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_paths: ./infra/root_chart ./infra/primordial_chart
      version: ${{ github.ref_name }}
