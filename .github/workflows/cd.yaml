# ### workspace-cd
# #### source: workspace
name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  chart:
    name: OCI Chart
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/⚡reusable-chart-publish.yaml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
