# ### workspace-cd
# #### source: workspace
name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  helm:
    name: Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart
      version: ${{ github.ref_name }}
