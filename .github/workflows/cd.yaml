# ### workspace-cd
# #### source: workspace
name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-go-base
      dockerfile: ./infra/Dockerfile
      version: ${{ github.ref_name }}
