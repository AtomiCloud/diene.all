name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-dotnet-base
      dockerfile: ./infra/Dockerfile
      version: ${{ github.ref_name }}

  helm:
    name: Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart
      version: ${{ github.ref_name }}
