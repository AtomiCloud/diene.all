# ### nextjs-frontend-standby-synthetic
# #### source: nextjs-frontend
name: Standby Synthetic

on:
  schedule:
    # Weekly synthetic probe against the pre-provisioned standby (ARCHITECTURE
    # §4): proves the repointable CNAME target stays alive between releases.
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  synthetic:
    name: Weekly Standby Probe
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Probe the standby host
        env:
          STANDBY_URL: ${{ vars.STANDBY_URL }}
        run: nix develop .#ci -c ./scripts/ci/standby-synthetic.sh "$STANDBY_URL"
