name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  analyze:
    name: Static Analysis
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-analyze.yaml
    secrets: inherit

  unit:
    name: Unit and C0 Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit

  meta:
    name: TestHelper Meta Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: meta

  deadcode:
    name: Dead Code
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-deadcode.yaml
    secrets: inherit

  package-validate:
    name: Package Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-package-validate.yaml
    secrets: inherit

  nix-check:
    name: Nix Check
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-nix-check.yaml
    secrets: inherit
