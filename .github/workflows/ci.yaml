# ### workspace-ci
# #### source: workspace
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ### mercury-quality
  # #### source: mercury
  quality:
    name: Format, Lint, Typecheck, Dead Code
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-quality.yaml
    secrets: inherit

  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  # ### bun-base-ci
  # #### source: bun-base
  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit

  int:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: int

  build:
    name: Build Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-build.yaml
    secrets: inherit

  # ### mercury-product-ci
  # #### source: mercury
  container:
    name: Container Build and Scan
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: mercury-webhook
      dockerfile: ./infra/Dockerfile
      # Fast single-arch build/scan for ordinary CI; the CD path builds and scans
      # every target platform before any publish.
      platform: linux/amd64
      publish: false

  helm-app:
    name: App Chart
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart
      publish: false

  helm-primordial:
    name: Primordial Chart
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/primordial_chart
      publish: false

  sit:
    name: Garden System Integration Journey
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-sit.yaml
    secrets: inherit

  release-validation:
    name: Release Contract
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-release-validation.yaml
    secrets: inherit
