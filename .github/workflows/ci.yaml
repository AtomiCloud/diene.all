# ### workspace-ci
# #### source: workspace
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  # ### bun-base-ci
  # #### source: bun-base
  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit

  int:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: int

  build:
    name: Build Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-build.yaml
    secrets: inherit

  # ### nextjs-frontend-ci
  # #### source: nextjs-frontend
  opennext:
    name: OpenNext
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-opennext.yaml
    secrets: inherit

  standby:
    name: Standby
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-standby.yaml
    secrets: inherit

  e2e:
    name: E2E
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-e2e.yaml
    secrets: inherit

  helm:
    name: Helm
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
