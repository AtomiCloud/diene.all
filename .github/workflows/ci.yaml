name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  test:
    name: Dart Test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit

  quality:
    name: pub.dev Quality
    permissions:
      contents: read
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Validate package listing quality
        run: nix develop .#ci -c ./scripts/ci/quality.sh
