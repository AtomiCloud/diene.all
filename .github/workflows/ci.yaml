# ### workspace-ci
# #### source: workspace
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  # ### go-base-ci
  # #### source: go-base
  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-go-test.yaml
    secrets: inherit
    with:
      mode: unit

  integration:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-go-test.yaml
    secrets: inherit
    with:
      mode: int

  go-build:
    name: Go Build
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-go-build.yaml
    secrets: inherit

  deadcode:
    name: Deadcode
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-go-deadcode.yaml
    secrets: inherit

  vulnerability:
    name: Vulnerability
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-go-vuln.yaml
    secrets: inherit

  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-go-consumer
      dockerfile: ./infra/Dockerfile

  helm:
    name: Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart

  # ### go-consumer-ci
  # #### source: go-consumer
  sit:
    name: System Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-sit.yaml
    secrets: inherit

  helm-primordial:
    name: Primordial Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/primordial_chart
