name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  helm:
    name: Helm Chart
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_path: ./infra/root_chart

  # Fleet is an S30 materialized product: its compiler chart is validated by
  # the fleet job below, while the inherited wrapper job requires the probe
  # matrix that this branch deliberately removes.
  fleet:
    name: Fleet
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-fleet.yaml
    secrets: inherit
