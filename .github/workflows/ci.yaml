# ### workspace-ci
# #### source: workspace
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  # ### dotnet-base-ci
  # #### source: dotnet-base
  deadcode:
    name: Dead Code
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-dead-code.yaml
    secrets: inherit

  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit
      name: Unit

  int:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: int
      name: Integration

  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-build.yaml
    secrets: inherit

  docker:
    name: Docker Image
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-docker.yaml
    secrets: inherit
    with:
      image_name: diene-dotnet-api
      dockerfile: ./infra/Dockerfile

  # ### dotnet-api-ci
  # #### source: dotnet-api
  # Both charts go through ONE invocation so a single semver reaches both (R20).
  helm:
    name: Helm Charts
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/⚡reusable-helm.yaml
    secrets: inherit
    with:
      chart_paths: ./infra/root_chart ./infra/primordial_chart

  sit:
    name: System Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-sit.yaml
    secrets: inherit
    with:
      collection: tests/sit/bruno
      environment: sit
