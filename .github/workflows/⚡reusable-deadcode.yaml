# ### dart-lib-reusable-deadcode
# #### source: dart-lib
name: ⚡ Reusable Dart Dead Code

on:
  workflow_call:

jobs:
  deadcode:
    name: Repository and Production Dead Code
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run both dead-code passes
        run: nix develop .#ci -c ./scripts/ci/deadcode.sh
