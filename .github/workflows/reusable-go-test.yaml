# ### go-base-reusable-test
# #### source: go-base
name: ⚡ Reusable Go Test

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

jobs:
  test:
    name: Go ${{ inputs.mode }} Tests
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-go@v2
      # This library's TestHelper ships Testcontainers stack glue, so its meta
      # tier boots real containers to prove the emitted blocks address a live
      # dependency.
      - if: inputs.mode == 'int' || inputs.mode == 'meta'
        uses: AtomiCloud/actions.setup-docker@v2
      - name: Run Go tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "${TEST_MODE}"
      - name: Upload coverage
        if: inputs.mode != 'meta' || hashFiles('testhelper/**/*.go') != ''
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage/${{ inputs.mode }}.out
          flags: ${{ inputs.mode }}
          token: ${{ secrets.CODECOV_TOKEN }}
