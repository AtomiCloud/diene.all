name: ⚡ Reusable Pre-Commit

on:
  workflow_call:

jobs:
  precommit:
    name: Pre-Commit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-nix-store-cache-ubuntu-26.04-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Verify vendored skills
        run: nix develop .#ci -c skills-sync sync --tier ci
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
