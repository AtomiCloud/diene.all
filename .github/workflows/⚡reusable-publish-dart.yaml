# ### dart-lib-reusable-publish
# #### source: lib/dart/problems
# Reusable pub.dev publish job. Called by cd.yaml on a `v*.*.*` tag push;
# materializes the pub.dev credentials, then runs the manifest==tag guard and
# `dart pub publish --force` via scripts/ci/publish.sh. Execution is
# conductor-owned (credential/publish held); this workflow does not run on push
# to the branch, only on a release tag.
name: ⚡ Reusable Dart Publish

on:
  workflow_call:

jobs:
  publish:
    name: Publish to pub.dev
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
        run: |
          mkdir -p "${HOME}/.config/dart"
          printf '%s' "${PUB_CREDENTIALS_JSON}" > "${HOME}/.config/dart/pub-credentials.json"
          chmod 600 "${HOME}/.config/dart/pub-credentials.json"
      - name: Verify manifest==tag and publish
        run: nix develop .#ci -c ./scripts/ci/publish.sh "${GITHUB_REF_NAME}"
