name: ⚡ Reusable Dart Package Test

on:
  workflow_call:

jobs:
  test:
    name: Analyze, Test, and Package
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Run package gates
        run: nix develop .#ci -c ./scripts/ci/test.sh
      - name: Score pub package
        run: dart pub global activate pana && dart pub global run pana --exit-code-threshold 10 .
      - name: Upload unit coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: true
