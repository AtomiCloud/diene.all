# ### dart-lib-reusable-test
# #### source: dart-lib
name: ⚡ Reusable Dart Tests

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or meta)
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: ${{ inputs.mode == 'meta' && 'TestHelper Meta' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      # No meta skip condition: diene_config ships a TestHelper, so its meta tier
      # is mandatory. The inherited `hashFiles(... test_helper.dart) != ''` guard
      # meant that deleting the helper silently converted the meta job into a
      # green no-op that uploaded no coverage — the required TestHelper proof
      # would vanish without any job turning red. test.sh now fails closed when
      # the helper or the meta suite is missing, and this job always runs it.
      - name: Run ${{ inputs.mode }} tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "$TEST_MODE" coverage
      - name: Upload ${{ inputs.mode }} coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: packages/diene_config/coverage/${{ inputs.mode }}
          if-no-files-found: error
      - name: Upload ${{ inputs.mode }} coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: packages/diene_config/coverage/${{ inputs.mode }}/lcov.info
          flags: ${{ inputs.mode }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
