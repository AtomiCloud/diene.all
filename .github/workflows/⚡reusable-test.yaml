name: ⚡ Reusable Dart Tests

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or meta)
        required: true
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: ${{ inputs.mode == 'meta' && 'TestHelper Meta' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      # Meta-tier activation is owned by scripts/ci/test.sh, which exits 0 with
      # "Meta tier inactive" when the member has no TestHelper. The workflow does not
      # re-implement that decision: the script resolves the member via MEMBER_DIR /
      # TEST_HELPER_PATH, a workflow condition can only hardcode the path, and the two
      # copies drift silently the moment a descendant renames its package.
      - name: Run ${{ inputs.mode }} tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "$TEST_MODE" coverage
      # Uploads gate on the ARTIFACT rather than on a source file standing in for it.
      - name: Upload ${{ inputs.mode }} coverage artifact
        if: always() && hashFiles(format('packages/diene_dart_lib/coverage/{0}/lcov.info', inputs.mode)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ inputs.mode }}
          path: packages/diene_dart_lib/coverage/${{ inputs.mode }}
          if-no-files-found: warn
      - name: Upload ${{ inputs.mode }} coverage to Codecov
        if: always() && hashFiles(format('packages/diene_dart_lib/coverage/{0}/lcov.info', inputs.mode)) != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/diene_dart_lib/coverage/${{ inputs.mode }}/lcov.info
          flags: ${{ inputs.mode }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
