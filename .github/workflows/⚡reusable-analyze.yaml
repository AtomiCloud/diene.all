name: ⚡ Reusable Dart Analyze

on:
  workflow_call:

jobs:
  analyze:
    name: Static Analysis
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Analyze the workspace
        run: nix develop .#ci -c ./scripts/ci/analyze.sh
