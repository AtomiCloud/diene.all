# ### dart-lib-reusable-nix-check
# #### source: dart-lib
name: ⚡ Reusable Nix Check

on:
  workflow_call:

jobs:
  nix-check:
    name: Nix Flake Check
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Evaluate Nix checks
        run: nix develop .#ci -c ./scripts/ci/nix-check.sh
