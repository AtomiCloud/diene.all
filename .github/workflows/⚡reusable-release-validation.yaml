# ### mercury-reusable-release-validation
# #### source: mercury
name: ⚡ Reusable Release Validation

on:
  workflow_call:

jobs:
  release-validation:
    name: Release Contract
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Validate release contract
        run: nix develop .#ci -c ./scripts/ci/release-validation.sh
