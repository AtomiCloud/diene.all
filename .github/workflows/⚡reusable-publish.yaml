# ### dart-lib-reusable-publish
# #### source: dart-lib
# Reusable pub.dev publish job. Called by cd.yaml on a `v[0-9]+.[0-9]+.[0-9]+`
# tag push, or by workflow_dispatch with an explicit release tag. Materializes
# the AtomiCloud org pub.dev credential, pins the published member to the
# release tag's bytes, then runs the manifest==tag guard and
# `flutter pub publish --force`.
# pub.dev trusted publishing (OIDC) is deliberately NOT used (user ruling
# 2026-07-25); the long-lived org credential is the only publish credential.
name: ⚡ Reusable Dart Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose bytes are published (v*.*.*)
        required: true
        type: string

jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      contents: read
    environment: pub.dev
    timeout-minutes: 20
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-atomi-nix-store-cache-linux-amd64
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: Pin the published member to the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ ${TAG} =~ ^v[0-9]+[.][0-9]+[.][0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "❌ tag input must be a semantic v*.*.* release tag: ${TAG}" >&2
            exit 1
          }
          git fetch --tags --force origin
          git checkout "refs/tags/${TAG}" -- packages/diene_api_engine
          git --no-pager diff --stat "refs/tags/${TAG}" -- packages/diene_api_engine
      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS_JSON: ${{ secrets.PUB_CREDENTIALS_JSON }}
        run: |
          mkdir -p "${HOME}/.config/dart"
          printf '%s' "${PUB_CREDENTIALS_JSON}" > "${HOME}/.config/dart/pub-credentials.json"
          chmod 600 "${HOME}/.config/dart/pub-credentials.json"
          [ -s "${HOME}/.config/dart/pub-credentials.json" ] || {
            echo "❌ pub.dev credentials are empty — is the org secret visible to this repo?" >&2
            exit 1
          }
      - name: Verify manifest==tag and publish
        env:
          TAG: ${{ inputs.tag }}
        run: nix develop .#cd -c ./scripts/ci/publish.sh "${TAG}"
      - name: Remove pub.dev credentials
        if: always()
        run: rm -f "${HOME}/.config/dart/pub-credentials.json"
