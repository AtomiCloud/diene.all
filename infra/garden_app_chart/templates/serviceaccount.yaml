{{- /* ### nextjs-frontend-garden-app-serviceaccount */ -}}
{{- /* #### source: nextjs-frontend */ -}}
{{- if .Values.serviceAccount.create -}}
{{- include "gardenApp.validateIdentity" . -}}
{{- /* Optional dedicated identity for the workload. The server needs no
       Kubernetes API access, so the pod never mounts the token
       (`automountServiceAccountToken: false` on both ends) — the account exists
       only so the workload is not the namespace default. No Role or
       RoleBinding is owned here. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenApp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenApp.labels" . | nindent 4 }}
  annotations:
    {{- include "gardenApp.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
