{{- /* ### nextjs-frontend-primordial-logtoapp */ -}}
{{- /* #### source: nextjs-frontend */ -}}
{{- if .Values.logtoApp.enabled -}}
{{- include "nextjsPrimordial.validateServiceTree" . -}}
{{- /* Exactly ONE LogtoApp CR per (app x vlandscape) — the single home of all
       app-level truth (S6/Q-I36); per-row fragment CRs are abolished.

       PLACEMENT-OWNER CONDITION: render this only when THIS chart is the selected
       placement owner for the app — the chart that declares the app's serve-set.
       The frontend serves its own human rail, so it IS the owner and the flag
       defaults on.

       Redirect URIs are DERIVED, never declared per row: the operator resolves
       the live serve-set and builds `origin(L) + declaredPath`. This chart
       therefore declares PATHS only, matching the routes the app actually serves.
       Non-HTTPS / local / vendor exceptions are explicit through the `extra*`
       lists, and nothing here branches on environment. */ -}}
{{- $paths := .Values.logtoApp.paths -}}
{{- range $key := (list "redirectPath" "postLogoutPath") }}
{{- $value := get $paths $key }}
{{- if $value }}
{{- if not (hasPrefix "/" $value) }}
{{- fail (printf "logtoApp.paths.%s %q must be an absolute RFC 3986 path beginning with one `/` (C0 §8)" $key $value) }}
{{- end }}
{{- if regexMatch "^//|[?#]|(^|/)\\.{1,2}(/|$)|%2[fF]" $value }}
{{- fail (printf "logtoApp.paths.%s %q must carry no authority, query, fragment, empty/dot segment, or percent-encoded `/`" $key $value) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: {{ .Values.logtoApp.apiVersion }}
kind: LogtoApp
metadata:
  name: {{ include "nextjsPrimordial.resourceName" (dict "root" . "token" .Values.serviceTree.module) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextjsPrimordial.labels" . | nindent 4 }}
  annotations:
    {{- include "nextjsPrimordial.annotations" . | nindent 4 }}
spec:
  {{- /* The endpoint is DERIVED from identityRef + namespace, never configured. */}}
  identityRef: {{ required "logtoApp.identityRef is required when logtoApp.enabled" .Values.logtoApp.identityRef }}
  platform: {{ .Values.serviceTree.platform }}
  service: {{ .Values.serviceTree.service }}
  module: {{ .Values.serviceTree.module }}
  type: {{ .Values.logtoApp.type }}
  {{- with $paths.redirectPath }}
  redirectPath: {{ . | quote }}
  {{- end }}
  {{- with $paths.postLogoutPath }}
  postLogoutPath: {{ . | quote }}
  {{- end }}
  {{- with .Values.logtoApp.resourceRefs }}
  {{- /* Explicit LogtoResource CR names; a missing ref is a hard
         ResourceRefMissing error, never inferred. */}}
  resourceRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.logtoApp.extraRedirectUris }}
  extraRedirectUris:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.logtoApp.extraPostLogoutRedirectUris }}
  extraPostLogoutRedirectUris:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.logtoApp.extraCorsOrigins }}
  extraCorsOrigins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
