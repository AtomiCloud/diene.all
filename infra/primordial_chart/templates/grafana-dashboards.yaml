{{- /* ### flutter-e4-primordial-grafana-dashboards */ -}}
{{- /* #### source: flutter-e4 */ -}}
{{- if .Values.observability.enabled -}}
{{- include "flutterPrimordial.validateServiceTree" . -}}
{{- /* `dashboards/{purpose}.json` -> one GrafanaDashboard with deterministic uid
       `<platform>-<service>-<purpose>`.

       The repository root `observability/` is authoritative. Helm cannot read
       outside the chart directory, so the chart BUILD copies it into the
       gitignored `files/observability/` before lint/template/package/publish. The
       copy is never hand-edited or committed.

       This node currently ships ZERO dashboard files: the Faro rail is live but
       its curated content is owed (README.md, "Dashboards and alerts are owed").
       `.Files.Glob` then yields nothing and this template renders cleanly — no
       placeholder dashboard is ever added just to populate a directory. */ -}}
{{- $root := . -}}
{{- $prefix := include "flutterPrimordial.grafanaPrefix" . -}}
{{- $folderUid := include "flutterPrimordial.grafanaFolderUid" . -}}
{{- $base := trimSuffix "/" .Values.observability.path -}}
{{- range $path, $_ := .Files.Glob (printf "%s/dashboards/*.json" $base) }}
{{- $purpose := base $path | trimSuffix ".json" -}}
{{- $raw := trim ($root.Files.Get $path) -}}
{{- if not (hasPrefix "{" $raw) -}}
{{- fail (printf "%s is not a JSON object: a dashboard file must be valid dashboard JSON" $path) -}}
{{- end -}}
{{- $dashboard := fromJson $raw -}}
{{- $uid := printf "%s-%s" $prefix $purpose -}}
{{- if ne ($dashboard.uid | toString) $uid -}}
{{- fail (printf "%s declares uid %q but the deterministic uid is %q (<platform>-<service>-<purpose>)" $path ($dashboard.uid | toString) $uid) -}}
{{- end -}}
---
apiVersion: {{ $root.Values.observability.apiVersion }}
kind: GrafanaDashboard
metadata:
  name: {{ printf "%s-%s" $root.Values.serviceTree.service $purpose }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "flutterPrimordial.labels" $root | nindent 4 }}
  annotations:
    {{- include "flutterPrimordial.annotations" $root | nindent 4 }}
spec:
  folderRef: {{ $folderUid }}
  instanceSelector:
    {{- toYaml $root.Values.observability.instanceSelector | nindent 4 }}
  resyncPeriod: {{ $root.Values.observability.resyncPeriod }}
  json: |
    {{- $raw | nindent 4 }}
{{- end }}
{{- end }}
