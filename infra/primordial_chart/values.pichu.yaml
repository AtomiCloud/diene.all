# ### dotnet-api-primordial-values-pichu
# #### source: dotnet-api
# pichu — DEVELOPMENT (first evolution). The first landscape on managed classes, drawn from
# the NON-PRODUCTION provider accounts.
serviceTree:
  landscape: pichu

platformDependencies:
  - landscape: pichu
    placement:
      preferredHost: pichu
    deletionPolicy:
      retainSecret: 24h
    database:
      main:
        type: neon
        delivery: external
        providerAccountRef: nonprod-neon
        credentialMode: standard
        rotation: 'on'
        cpu: 1
        ram: 1Gi
        storage: 5Gi
        version: '16'
        engine:
          neon:
            tier: launch
    kv:
      main:
        type: upstash
        delivery: external
        providerAccountRef: nonprod-upstash
        credentialMode: standard
        rotation: 'on'
        engine:
          upstash: {}
    cache:
      main:
        type: dragonfly
        delivery: replicated
        credentialMode: standard
        rotation: 'on'
        cpu: 1
        ram: 256Mi
        engine:
          dragonfly: {}
    store:
      main:
        type: tigris
        delivery: external
        providerAccountRef: nonprod-tigris
        credentialMode: standard
        rotation: 'on'
        engine:
          tigris: {}

logtoApp:
  vlandscape: celebi
