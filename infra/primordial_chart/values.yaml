# ### go-consumer-primordial-values
# #### source: go-consumer

# -- Prefix used by every service-tree label and annotation helper. Single
# configurable key (R16/B26) — never hard-coded inside a helper.
labelPrefix: atomi.cloud

# @schema const:fleet.atomi.cloud/v1alpha1
# -- API group/version of the dependency-operator CRs.
dependencyApiVersion: fleet.atomi.cloud/v1alpha1

# -- Stable service-tree projection (LPSM). Landscape and cluster slots are added
# by the two independent overlay dimensions; the base file never carries them.
serviceTree:
  # -- Platform name. Also the Primordial namespace and the parent Grafana folder uid.
  platform: diene
  # -- Service name. Dash-less: every resource name is `<service>-<token>`.
  service: goconsumer
  # -- Module name for the workload these dependencies serve.
  module: worker
  # -- Architecture layer (application tier).
  layer: '2'

# -- Dependency declarations. ONE union-set `PlatformDependency` CR per landscape
# spanning the `database` / `kv` / `cache` / `store` modules this service needs.
# Dependencies are requested through CRs in EVERY landscape (B30) — the operator
# realizes CNPG/Dragonfly/MinIO in-cluster locally and the managed classes from
# Primordial. There is no local-subchart vs cloud-CR toggle and no per-kind CR.
#
# The redis-streams transport RIDES the kv/cache module: there is NO transport CR.
# A duplicate landscape is a loud render-time Conflict.
platformDependencies:
  - # -- Target landscape. May name a vlandscape; one CR per landscape, single writer.
    landscape: mew
    placement:
      # -- Required host preference for vlandscape externals.
      preferredHost: raichu
    deletionPolicy:
      # -- How long a materialized secret is retained after the CR is deleted.
      retainSecret: 168h
    # -- Postgres MAIN: the system of record for long-lived truth.
    database:
      type: neon
      delivery: external
      providerAccountRef: nonprod-neon
      credentialMode: standard
      rotation: 'on'
      cpu: 1
      ram: 1Gi
      storage: 10Gi
      version: '16'
      engine:
        neon:
          tier: launch
    # -- KV (Upstash class). Preferred on hot paths per S19/Q-WH2, and the host of
    # the redis-streams consumer-group transport.
    kv:
      type: upstash
      delivery: external
      providerAccountRef: nonprod-upstash
      credentialMode: standard
      rotation: 'on'
      engine:
        upstash:
          eviction: false
    # -- Ephemeral cache (dragonfly class, no disk).
    cache:
      type: dragonfly
      delivery: replicated
      credentialMode: standard
      rotation: 'on'
      cpu: 1
      ram: 512Mi
    # -- S3-compatible object storage, serving BOTH the `MAIN` and `ARCHIVE` keyed
    # adapters the config declares: one storage dependency, two logical buckets.
    # db-init creates the buckets MinIO will not.
    store:
      type: tigris
      delivery: external
      providerAccountRef: nonprod-tigris
      credentialMode: standard
      rotation: 'on'

# -- The Problem catalog row, rendered from the committed `problems:export` output.
problems:
  # -- Render the Problem CR set.
  enabled: true
  # @schema const:atomi.cloud/v1alpha1
  # -- API group/version of the Problem CRD (owned by T3).
  apiVersion: atomi.cloud/v1alpha1
  # -- Exporter output, relative to the chart directory. Committed, not vendored:
  # it is a real generated artifact of `problems:export`. Rendering tolerates the
  # file being absent so a fresh checkout stays green before the first export.
  path: files/problems.json
  # @schema pattern:^v[0-9]+$
  # -- Catalog version. One CR = one version snapshot; a bump is a NEW CR, never an
  # in-place mutation (D8).
  version: v1
  # @schema item:string;uniqueItems:true
  # -- Landscapes to materialize the row for. Problem content is
  # landscape-independent; rows for the same (platform, service, version, id) are
  # expected to be byte-identical.
  landscapes:
    - mew

# -- One vlandscape-targeted LogtoApp per app, rendered ONLY when this chart is the
# selected PLACEMENT OWNER for the app (S6/Q-I36).
#
# PLACEMENT-OWNER CONDITION: the owner is the chart that declares the app's
# serve-set. This template serves no HTTP and a worker is normally NOT the owner,
# so the default is OFF — but the surface ships so an app-owning consumer built
# from this template only flips `enabled`. See `values.example.yaml` for the ON shape.
logtoApp:
  # -- Render the LogtoApp CR. Off unless this chart owns the app's placement.
  enabled: false
  # @schema const:fleet.atomi.cloud/v1alpha1
  # -- API group/version of the LogtoApp CRD.
  apiVersion: fleet.atomi.cloud/v1alpha1
  # -- Virtual landscape this app resolves its Logto endpoint from (`mew` for prod
  # rows, `celebi` for staging). The endpoint itself is DERIVED from identityRef
  # plus the namespace — never configured per CR.
  identityRef: mew
  # -- Logto application type. The worker authenticates to published APIs with
  # client credentials, so machine-to-machine is the shape it would take.
  type: MachineToMachine
  # -- DECLARED PATHS ONLY. Redirect, post-logout, and CORS values are DERIVED by
  # the operator from the live serve-set (`origin(L) + declaredPath`); a chart never
  # writes a per-row redirect URI. Each must be an absolute path beginning with one
  # `/`, with no authority, query, fragment, dot segment, or percent-encoded `/`.
  paths:
    # -- Login callback path. Empty for a machine-to-machine app.
    redirectPath: ''
    # -- Post-logout path. Empty for a machine-to-machine app.
    postLogoutPath: ''
  # @schema item:string;uniqueItems:true
  # -- Explicit LogtoResource CR names this app takes tokens for. A missing ref is
  # a hard `ResourceRefMissing` error, never inferred.
  resourceRefs: []
  # @schema item:string;uniqueItems:true
  # -- Non-HTTPS / local / vendor redirect exceptions. The ONLY escape from the
  # derived set; no environment-specific implicit branch exists.
  extraRedirectUris: []
  # @schema item:string;uniqueItems:true
  # -- Post-logout exceptions, same rule.
  extraPostLogoutRedirectUris: []
  # @schema item:string;uniqueItems:true
  # -- CORS origin exceptions (scheme + host + optional non-default port only).
  extraCorsOrigins: []

# -- Grafana Operator rendering of the repository's `observability/` source
# (docs/standards/observability/primordial-chart.md). The root directory is
# authoritative; the chart build copies it into the gitignored
# `files/observability/` before lint/template/package/publish.
#
# The six-gate method legitimately yields ZERO dashboards and ZERO alerts, so every
# template renders cleanly with none present. No placeholder is ever added just to
# populate a directory.
observability:
  # -- Render the GrafanaFolder and any dashboards/alerts found.
  enabled: true
  # @schema const:grafana.integreatly.org/v1beta1
  # -- API group/version of the Grafana Operator CRDs.
  apiVersion: grafana.integreatly.org/v1beta1
  # -- Glob root, relative to the chart directory, for the copied `observability/`.
  path: files/observability
  # -- Which Grafana instances on Primordial pick these resources up.
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # -- Dashboard resync cadence.
  resyncPeriod: 10m
  # -- Alert-group evaluation interval.
  alertInterval: 1m
  # -- Lookback window, in seconds, for each rule's instant query.
  relativeTimeRangeFrom: 600
  # -- Platform-pinned datasource UIDs. An alert file's `datasource:` selects one
  # by name; an unknown name is a render-time failure.
  datasourceUids:
    # -- PromQL datasource.
    metrics: mimir
    # -- LogQL datasource.
    logs: loki
  # -- Repository base URL that every `runbook_url` annotation is built from.
  repositoryUrl: https://github.com/AtomiCloud/diene.go-consumer/blob/main
  # -- Generic LPSM dashboard an alert links when it declares no `panel`.
  genericDashboardUid: atomi-generic-lpsm
