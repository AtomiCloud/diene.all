# ### dotnet-api-values-raichu
# #### source: dotnet-api
# raichu — PRODUCTION (final evolution).
serviceTree:
  landscape: raichu

httpRoute:
  hostnames:
    - dotnet-api.atomi.cloud

# Two replicas is the floor: `maxUnavailable: 0` only actually keeps the service up during a
# rollout when there is more than one pod to roll.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

app:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi

dbInit:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi
