---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cloudflaredeploys.fleet.atomi.cloud
spec:
  group: fleet.atomi.cloud
  names:
    kind: CloudflareDeploy
    listKind: CloudflareDeployList
    plural: cloudflaredeploys
    shortNames:
    - cfd
    singular: cloudflaredeploy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scriptName
      name: Script
      type: string
    - jsonPath: .status.liveVersion
      name: Live
      type: string
    - jsonPath: .status.conditions[?(@.type=="RolloutComplete")].status
      name: Complete
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CloudflareDeploy is the Schema for the cloudflaredeploys API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CloudflareDeploySpec is per-version deployment intent. CI only uploads
              versions; this object is the sole deployment/pinning control.
            properties:
              desiredVersion:
                description: DesiredVersion selects an explicit uploaded version id.
                maxLength: 256
                minLength: 1
                type: string
              desiredVersionFrom:
                description: DesiredVersionFrom selects an uploaded version through
                  a Kargo-driven tag.
                properties:
                  tag:
                    description: Tag is the Kargo-driven version tag.
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - tag
                type: object
              pin:
                description: Pin repairs out-of-band deployment drift when true.
                type: boolean
              rollout:
                description: |-
                  Rollout is absent for a simple 100 percent deploy and present only when
                  gradual rollout is explicitly requested.
                properties:
                  steps:
                    description: Steps ends at a full 100 percent deployment.
                    items:
                      description: CloudflareRolloutStep is one Cloudflare-native
                        gradual deployment step.
                      properties:
                        percent:
                          description: Percent is the target version's Cloudflare
                            traffic percentage.
                          format: int32
                          maximum: 100
                          minimum: 1
                          type: integer
                        soak:
                          description: Soak is the optional health-stable wait before
                            advancing.
                          pattern: ^[0-9]+(ns|us|ms|s|m|h)$
                          type: string
                      required:
                      - percent
                      type: object
                    maxItems: 32
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: rollout steps must contain a 100 percent step
                      rule: self.exists(step, step.percent == 100)
                  strategy:
                    description: Strategy is Cloudflare-native gradual rollout.
                    enum:
                    - gradual
                    type: string
                required:
                - steps
                - strategy
                type: object
              scriptName:
                description: |-
                  ScriptName is the existing Worker script whose uploaded versions are
                  pinned and rolled out.
                maxLength: 128
                minLength: 1
                pattern: ^[A-Za-z0-9_-]+$
                type: string
            required:
            - pin
            - scriptName
            type: object
            x-kubernetes-validations:
            - message: exactly one of desiredVersion or desiredVersionFrom is required
              rule: has(self.desiredVersion) != has(self.desiredVersionFrom)
          status:
            description: CloudflareDeployStatus is the observed version and rollout
              state.
            properties:
              availableVersions:
                description: AvailableVersions is the uploaded-version catalog.
                items:
                  description: CloudflareAvailableVersion is one uploaded version
                    in the status catalog.
                  properties:
                    createdAt:
                      description: CreatedAt is the provider creation time.
                      format: date-time
                      type: string
                    id:
                      description: ID is the Cloudflare version id.
                      minLength: 1
                      type: string
                    tags:
                      description: Tags are provider/Kargo labels associated with
                        the version.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - id
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions use VersionFound, RolloutProgressing, RolloutComplete,
                  DriftDetected and Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployment:
                description: Deployment is the active rollout position.
                properties:
                  percent:
                    description: Percent is the target version's current traffic percentage.
                    format: int32
                    type: integer
                  step:
                    description: Step is the zero-based active rollout step.
                    format: int32
                    type: integer
                type: object
              liveVersion:
                description: LiveVersion is the currently deployed version id.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
