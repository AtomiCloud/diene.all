---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: exposures.boron.atomi.cloud
spec:
  group: boron.atomi.cloud
  names:
    kind: Exposure
    listKind: ExposureList
    plural: exposures
    shortNames:
    - be
    singular: exposure
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.hostname
      name: Hostname
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .status.conditions[?(@.type=="Conflicted")].status
      name: Conflict
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Exposure maps a derived hostname + path to one backend Service behind one CF
          Access Application.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ExposureSpec maps one derived hostname + path to one backend Service, gated
              by an ordered list of pre-existing Access policies: 1 CR = 1 CF Access
              Application. The hostname is never declared, always derived as
              <module>.<service>.<platform>.<instance>.<landscape>.<zone>. A different
              policy set for a different path is a SECOND Exposure (the superseded
              rules[]/defaultPolicyRef shapes are dead).
            properties:
              allowSharedBackend:
                default: false
                type: boolean
              backend:
                description: BackendReference names a k8s Service (and port) in the
                  Exposure's namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - name
                - port
                type: object
              coordinates:
                description: |-
                  Coordinates is the unchanged four-slot LPSM coordinate; instance is a
                  separate required projection field on ExposureSpec, never a fifth slot.
                properties:
                  landscape:
                    maxLength: 63
                    minLength: 1
                    type: string
                  module:
                    maxLength: 63
                    minLength: 1
                    type: string
                  platform:
                    maxLength: 63
                    minLength: 1
                    type: string
                  service:
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - landscape
                - module
                - platform
                - service
                type: object
              instance:
                maxLength: 63
                minLength: 1
                type: string
              path:
                default: /*
                maxLength: 253
                pattern: ^/.*
                type: string
              policies:
                description: |-
                  Policies is an ORDERED array of EXISTING, reusable CF Access policy
                  NAMES. The operator resolves each name to its policy id at reconcile
                  (names are unique-enforced; a rename is a BREAKING change) and never
                  authors a policy. Any missing name refuses the whole Exposure.
                items:
                  type: string
                minItems: 1
                type: array
              tunnelRef:
                description: SecretNameReference names an object in the referent's
                  own namespace.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - backend
            - coordinates
            - instance
            - policies
            - tunnelRef
            type: object
          status:
            description: ExposureStatus reports admission, ref resolution, programming,
              and conflict.
            properties:
              accessAppId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hostname:
                type: string
              observedGeneration:
                format: int64
                type: integer
              programmedRule:
                description: |-
                  ProgrammedRule is the ingress rule this Exposure contributes to its Tunnel's
                  remote configuration once programmed. Cleared while the Exposure is refused
                  or conflicted so a broken Exposure never holds a route.
                properties:
                  backend:
                    type: string
                  hostname:
                    type: string
                  path:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
