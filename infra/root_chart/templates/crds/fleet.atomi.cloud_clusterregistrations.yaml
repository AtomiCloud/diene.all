---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterregistrations.fleet.atomi.cloud
spec:
  group: fleet.atomi.cloud
  names:
    kind: ClusterRegistration
    listKind: ClusterRegistrationList
    plural: clusterregistrations
    shortNames:
    - creg
    singular: clusterregistration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.landscape
      name: Landscape
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.traffic
      name: Traffic
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.acceptingTraffic
      name: Accepting
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterRegistration is the Schema for the clusterregistrations
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterRegistrationSpec is the desired state of a ClusterRegistration.

              A physical cluster is identified by (landscape x mark). Provisioning runs
              through direct provider APIs and is ledger-backed; deletion is refused while
              anything still references the registration.
            properties:
              hostRole:
                description: |-
                  HostRole narrows what the registration carries. The only declared value is
                  anonymous-vcluster-host; absent means an ordinary workload cluster.
                enum:
                - anonymous-vcluster-host
                type: string
              landscape:
                description: |-
                  Landscape is the Landscape this cluster belongs to. Its Argo cluster-Secret
                  label is the sole membership truth for replicated delivery.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              mark:
                description: Mark distinguishes the clusters of one landscape from
                  each other.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              originMode:
                default: loadbalancer
                description: OriginMode is the public origin shape. It is fleet-wide
                  loadbalancer.
                enum:
                - loadbalancer
                type: string
              provider:
                description: Provider selects the direct provider API the cluster
                  controller drives.
                enum:
                - doks
                - eks
                - oke
                type: string
              traffic:
                description: |-
                  Traffic is the EXPLICIT answer-set dial and the canary/cutover control:
                  false leaves the A-set while the cluster keeps running, true joins it.
                  It is never a destruction signal. It is required rather than defaulted so
                  that joining the fleet's live answer set is always a declared act.
                type: boolean
            required:
            - landscape
            - mark
            - originMode
            - provider
            - traffic
            type: object
          status:
            description: ClusterRegistrationStatus is the observed state of a ClusterRegistration.
            properties:
              acceptingTraffic:
                description: |-
                  AcceptingTraffic is stamped by the traffic controller's unified poll loop
                  from the cluster's own gateway probe. It is an observation, not a dial:
                  the dial is spec.traffic.
                type: boolean
              argoSecret:
                description: |-
                  ArgoSecret points at the Argo cluster Secret this registration owns, in
                  namespace/name form. It is the only registry-to-Argo interface, and it is
                  a pointer: no credential material is ever mirrored into status.
                maxLength: 512
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              conditions:
                description: |-
                  Conditions follow the shared condition vocabulary. QuotaExhausted is
                  first-class here: a provider ceiling is reported before the vendor hard
                  rejects, and the same ceiling is an account-onboarding prerequisite.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lbIPs:
                description: LBIPs records the cluster's fixed ingress addresses per
                  guarantee class.
                items:
                  description: |-
                    LoadBalancerIP is one fixed ingress address of a registered cluster together
                    with the guarantee the provider makes about it.
                  properties:
                    guaranteeClass:
                      description: GuaranteeClass records what survives a load-balancer
                        deletion.
                      enum:
                      - reserved
                      - eip
                      - lb-lifetime
                      type: string
                    ip:
                      description: IP is the address itself.
                      maxLength: 45
                      minLength: 1
                      type: string
                  required:
                  - guaranteeClass
                  - ip
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - ip
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the provisioning state machine position.
                enum:
                - provisioning
                - ready
                - decommissioned
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
