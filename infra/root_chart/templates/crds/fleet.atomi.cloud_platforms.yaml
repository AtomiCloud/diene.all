---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: platforms.fleet.atomi.cloud
spec:
  group: fleet.atomi.cloud
  names:
    kind: Platform
    listKind: PlatformList
    plural: platforms
    shortNames:
    - plat
    singular: platform
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.infisical.projectSlug
      name: Project
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Platform is the Schema for the platforms API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PlatformSpec is the desired state of a Platform.

              A Platform is a singleton per platform, rendered by the fleet compiler chart.
              Its name must equal its namespace; that invariant spans metadata fields CRD
              validation cannot read, so it belongs to the deferred admission surface and
              is stated here rather than silently dropped.
            properties:
              infisical:
                description: Infisical is the platform's one project.
                properties:
                  projectSlug:
                    description: ProjectSlug is the project slug; one platform is
                      one Infisical project.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  serviceFolders:
                    description: ServiceFolders selects the folder-prefixed key layout
                      consumers depend on.
                    type: boolean
                required:
                - projectSlug
                - serviceFolders
                type: object
              pipeline:
                description: Pipeline is the promotion DAG the per-service Kargo objects
                  compile from.
                properties:
                  stages:
                    description: |-
                      Stages is the ordered promotion DAG, rendered one-to-one from the platform
                      home's own manifest and never hand-authored on this CR.
                    items:
                      description: |-
                        PipelineStage is ONE step of a platform's promotion DAG, held verbatim.

                        The step grammar is the platform home's own `stages:` grammar, rendered into
                        this CR one-to-one by the compiler chart: a step is a bare landscape name, a
                        parallel set of steps, or an object form carrying gate/soak/verification, and
                        the object form is mixable inside a parallel set. That union of scalar, list
                        and object is not expressible as a structural OpenAPI schema, so the step is
                        carried unpruned and unvalidated at the CRD layer rather than re-typed into a
                        normalized grammar this repository would have invented. Step-level validation
                        belongs to the admission surface recorded as deferred, and to the platform
                        controller's own compilation, which reports an unknown landscape as a
                        condition rather than a schema rejection.
                      x-kubernetes-preserve-unknown-fields: true
                    maxItems: 64
                    minItems: 1
                    type: array
                required:
                - stages
                type: object
              sos:
                description: SoS is the operator-internal registration half of the
                  secret-homes split.
                properties:
                  register:
                    description: Register requests SoS registration for this platform.
                    type: boolean
                required:
                - register
                type: object
            required:
            - infisical
            - pipeline
            - sos
            type: object
          status:
            description: PlatformStatus is the observed state of a Platform.
            properties:
              belt:
                description: |-
                  Belt is DERIVED from the platform's row CRs and is never authored in spec.
                  The Infisical environments this controller creates mirror it exactly.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                description: |-
                  Conditions follow the shared condition vocabulary; the platform controller
                  additionally reports InfisicalProvisioned, SoSRegistered and
                  PipelineRendered here.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
