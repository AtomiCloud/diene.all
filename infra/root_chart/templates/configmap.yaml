{{- /* ### bun-consumer-configmap */ -}}
{{- /* #### source: bun-consumer */ -}}
{{- if include "bunconsumer.hasConfig" . -}}
{{- include "bunconsumer.validateServiceTree" . -}}
{{- /* Build-phase config vendoring (B30.3): the app's config YAMLs live outside
       the chart and the helm build step copies them into `files/config/`. The dir
       is gitignored and never committed, so this renders nothing — and stays
       green — before the copy step runs.

       Rendering nothing is the CORRECT fallback, not a degraded one: the image
       bakes `config/` in at this same mount path, so an empty ConfigMap would
       shadow those defaults with an empty directory. No files copied means no
       ConfigMap and no mount, and the image's own config stays visible. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bunconsumer.resourceName" (dict "root" . "token" "config") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bunconsumer.labels" . | nindent 4 }}
  annotations:
    {{- include "bunconsumer.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: {{ .Values.config.syncWave | quote }}
data:
  {{- include "bunconsumer.configData" . | trim | nindent 2 }}
{{- end }}
