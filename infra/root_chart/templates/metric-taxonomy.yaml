{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "boron.fullname" . }}-metric-taxonomy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boron.labels" . | nindent 4 }}
data:
  taxonomy.yaml: |
    # Metrics the boron manager actually registers and emits (adapters/operator/metrics).
    emitted:
      - boron_condition
      - boron_provider_failures_total
      - boron_reconcile_ticks_total
      - controller_runtime_reconcile_total
      - controller_runtime_reconcile_errors_total
      - controller_runtime_reconcile_time_seconds
{{- end }}
