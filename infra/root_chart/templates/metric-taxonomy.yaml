{{- if .Values.dashboard.enabled }}
# The taxonomy is the single source of truth for which metric names the chart may
# reference. Every fleet_operator_* / controller_runtime_* name used by the alert
# pack or dashboard must appear under emitted or framework below; the
# operator-observability-artifacts validator fails closed on any drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-operator.fullname" . }}-metric-taxonomy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-operator.labels" . | nindent 4 }}
data:
  taxonomy.yaml: |
    # Metric families the fleet-operator manager registers (adapters/operator/metrics/metrics.go).
    emitted:
      - fleet_operator_condition
      - fleet_operator_ledger_failures_total
      - fleet_operator_reconcile_ticks_total
      - fleet_operator_vendor_api_failures_total
      - fleet_operator_provisioning_duration_seconds
      - fleet_operator_last_successful_tick_timestamp_seconds
      - fleet_operator_webhook_compile_failures_total
      - fleet_operator_materialization_ack_lag_seconds
      - fleet_operator_tenant_sync_failures_total
      - fleet_operator_plan_actions
    # controller-runtime framework metrics the manager exposes for free.
    framework:
      - controller_runtime_reconcile_total
      - controller_runtime_reconcile_errors_total
      - controller_runtime_reconcile_time_seconds
    # Poll-loop liveness is a TIMESTAMP gauge; staleness = time() - value, never a tick rate.
    liveness:
      metric: fleet_operator_last_successful_tick_timestamp_seconds
      semantics: timestamp-staleness
    # Blast-brake trips page through the shared condition gauge as a paging condition type.
    paging:
      conditionMetric: fleet_operator_condition
      conditionTypes:
        - Conflict
        - Unresolved
        - Drifted
        - BlastBrakeTripped
    # Bounded label vocabularies enforced at the recorder boundary
    # (adapters/operator/metrics/metrics.go). A label value outside its vocabulary
    # is recorded as the single fixed `other` sentinel, so an arbitrary,
    # object-derived, or secret-bearing string can neither appear verbatim nor mint
    # a new time series; the exact value stays in the structured logs and the CR
    # status. Every controller= selector in the alert pack is checked against the
    # controller vocabulary at render time and the render fails closed on drift.
    labels:
      other: other
      # The two fenced samples plus every real enable seam the runtime declares.
      # `problem` is a reserved seam that is not folded yet and emits nothing
      # today; it is listed so its first writer lands on its own label instead of
      # collapsing into `other`.
      controllers:
        {{- range $ctrl := .Values.metricLabels.controllers }}
        - {{ $ctrl }}
        {{- end }}
      vendors:
        {{- range $vendor := .Values.metricLabels.vendors }}
        - {{ $vendor }}
        {{- end }}
      # The condition-type vocabulary is the pure lib/operator/conditions constant
      # set the recorder consumes, never a second spelling of it.
      conditionTypes:
        - Ready
        - Drifted
        - Conflict
        - WaitingForEndpoint
        - BlastBrakeTripped
        - Provisioned
        - SecretWritten
        - Unresolved
        - NotInEnvelope
        - SecretRetained
        - DeclarerChanged
        - ForkUnsupported
        - QuotaExhausted
        - InfisicalProvisioned
        - SoSRegistered
        - PipelineRendered
        - OrphanedSource
        - ConfigCompiled
        - SecretsFanned
        - HomeChangeBlocked
        - TargetNotServed
        - Accepted
        - UnknownProvider
        - OrphanedProvider
        - TenantProvisioned
        - RefsClear
        - Snapshotted
        - ExternalsDeleted
        - LedgerPurged
        - TargetDeleted
        - RecordPublished
        - NoActiveServers
        - VersionFound
        - RolloutProgressing
        - RolloutComplete
        - DriftDetected
        - Failed
        - Published
        - SchemaInvalid
        - Stale
    # Webhook delivery-path signals belong to mercury (Q-WH8): they are its own
    # in-app exports, so this operator registers no webhook delivery-event family
    # and no delivery-state label vocabulary. Only the config-plane signals above
    # (compile failures, materialization/ack lag, tenant sync) are emitted here.
    ownership:
      webhookDeliveryPath: mercury
      webhookConfigPlane: fleet-operator
{{- end }}
