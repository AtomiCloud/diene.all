{{- /* A dict keeps GrafanaAlertRuleGroup rules parameterized across boron's three controllers. */ -}}
{{- define "boron.alertrule" }}
    - uid: {{ .uid }}
      title: {{ .title | quote }}
      condition: C
      for: {{ .for | default "5m" }}
      noDataState: {{ .noData | default "OK" }}
      execErrState: Error
      labels:
        severity: {{ .severity | default "warning" }}
        controller: {{ .controller }}
        source: {{ .source }}
      annotations:
        summary: {{ .summary | quote }}
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: {{ .expr }}
            instant: true
            refId: A
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            type: threshold
            expression: A
            conditions:
              - evaluator:
                  type: {{ .evaluator | default "gt" }}
                  params:
                    - {{ .threshold | default 0 }}
            refId: C
{{- end -}}
{{- if .Values.alerts.enabled }}
{{- $controllers := list }}
{{- if .Values.controllers.account }}{{- $controllers = append $controllers "account" }}{{- end }}
{{- if .Values.controllers.tunnel }}{{- $controllers = append $controllers "tunnel" }}{{- end }}
{{- if .Values.controllers.exposure }}{{- $controllers = append $controllers "exposure" }}{{- end }}
{{- $latency := .Values.alerts.reconcileLatencySeconds | default 10 }}
{{- $livenessRate := .Values.alerts.livenessMinTickRate | default "0.001" }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ include "boron.fullname" . }}-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boron.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: {{ .Values.alerts.folderUID | quote }}
  interval: 1m
  rules:
{{- range $ctrl := $controllers }}
{{- /* reconcile error rate */ -}}
{{- include "boron.alertrule" (dict
      "uid" (printf "boron-%s-reconcile-errors" $ctrl)
      "title" (printf "boron %s reconcile errors elevated" $ctrl)
      "summary" (printf "The %s controller reconcile error rate is elevated" $ctrl)
      "controller" $ctrl "source" "boron" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(controller_runtime_reconcile_errors_total{controller=\"%s\"}[5m]))" $ctrl)
      "evaluator" "gt" "threshold" 0) }}
{{- /* reconcile latency (p99) */ -}}
{{- include "boron.alertrule" (dict
      "uid" (printf "boron-%s-reconcile-latency" $ctrl)
      "title" (printf "boron %s reconcile latency high" $ctrl)
      "summary" (printf "The %s controller p99 reconcile latency exceeds %v s" $ctrl $latency)
      "controller" $ctrl "source" "boron" "severity" "warning" "for" "10m"
      "expr" (printf "histogram_quantile(0.99, sum by (le) (rate(controller_runtime_reconcile_time_seconds_bucket{controller=\"%s\"}[5m])))" $ctrl)
      "evaluator" "gt" "threshold" $latency) }}
{{- /* poll-loop liveness / staleness — no successful ticks pages, even on no-data */ -}}
{{- include "boron.alertrule" (dict
      "uid" (printf "boron-%s-reconcile-liveness" $ctrl)
      "title" (printf "boron %s reconcile loop stalled" $ctrl)
      "summary" (printf "The %s reconcile/poll loop reported no successful ticks (stale = page)" $ctrl)
      "controller" $ctrl "source" "boron" "severity" "critical" "for" "10m" "noData" "Alerting"
      "expr" (printf "sum(rate(boron_reconcile_ticks_total{controller=\"%s\"}[10m]))" $ctrl)
      "evaluator" "lt" "threshold" $livenessRate) }}
{{- /* Cloudflare provider failures */ -}}
{{- include "boron.alertrule" (dict
      "uid" (printf "boron-%s-provider-failures" $ctrl)
      "title" (printf "boron %s cloudflare provider failures" $ctrl)
      "summary" (printf "The %s controller is failing Cloudflare API operations" $ctrl)
      "controller" $ctrl "source" "boron" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(boron_provider_failures_total{controller=\"%s\"}[5m]))" $ctrl)
      "evaluator" "gt" "threshold" 0) }}
{{- end }}
{{- /* persistent bad condition state — a held bad condition pages */ -}}
{{- include "boron.alertrule" (dict
      "uid" "boron-account-token-invalid"
      "title" "boron account token invalid"
      "summary" "An Account holds TokenValid=False (Ready gauge dropped to 0)"
      "controller" "account" "source" "boron" "severity" "critical" "for" "15m"
      "expr" "max by (type) (boron_condition{controller=\"account\",type=~\"Ready|TokenValid\"})"
      "evaluator" "lt" "threshold" 1) }}
{{- include "boron.alertrule" (dict
      "uid" "boron-tunnel-degraded"
      "title" "boron tunnel degraded"
      "summary" "A Tunnel holds AccountNotReady=True or lost ConfigSynced/ReplicasReady"
      "controller" "tunnel" "source" "boron" "severity" "critical" "for" "15m"
      "expr" "max by (type) (boron_condition{controller=\"tunnel\",type=\"AccountNotReady\"})"
      "evaluator" "gt" "threshold" 0) }}
{{- include "boron.alertrule" (dict
      "uid" "boron-exposure-conflicted"
      "title" "boron exposure conflicted"
      "summary" "An Exposure holds Conflicted=True (hostname/path oldest-wins loser)"
      "controller" "exposure" "source" "boron" "severity" "warning" "for" "15m"
      "expr" "max by (type) (boron_condition{controller=\"exposure\",type=\"Conflicted\"})"
      "evaluator" "gt" "threshold" 0) }}
{{- end }}
