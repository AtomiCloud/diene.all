{{- /* A dict keeps GrafanaAlertRuleGroup rules parameterized for toy and consumer-extension controllers. */ -}}
{{- define "fleet-operator.alertrule" }}
    - uid: {{ .uid }}
      title: {{ .title | quote }}
      condition: C
      for: {{ .for | default "5m" }}
      noDataState: {{ .noData | default "OK" }}
      execErrState: Error
      labels:
        severity: {{ .severity | default "warning" }}
        controller: {{ .controller }}
        source: {{ .source }}
      annotations:
        summary: {{ .summary | quote }}
        {{- if or (eq .source "consumer-extension") .description }}
        description: {{ .description | default (printf "Consumer-extension signal for the %s controller. The metric is registered by adapters/operator/metrics; real fleet controllers drive it as they land." .controller) | quote }}
        {{- end }}
      data:
        - refId: A
          relativeTimeRange:
            from: 600
            to: 0
          datasourceUid: prometheus
          model:
            expr: {{ .expr }}
            instant: true
            refId: A
        - refId: C
          relativeTimeRange:
            from: 0
            to: 0
          datasourceUid: __expr__
          model:
            type: threshold
            expression: A
            conditions:
              - evaluator:
                  type: {{ .evaluator | default "gt" }}
                  params:
                    - {{ .threshold | default 0 }}
            refId: C
{{- end -}}
{{- if .Values.alerts.enabled }}
{{- /* Enabled toy controllers emit the generic reconcile/ledger/condition metrics today. */ -}}
{{- $toy := list }}
{{- if .Values.controllers.note }}{{- $toy = append $toy "note" }}{{- end }}
{{- if .Values.controllers.journal }}{{- $toy = append $toy "journal" }}{{- end }}
{{- /* Real fleet controllers inherit the consumer-extension rules; every metric they
       reference is registered by adapters/operator/metrics/metrics.go. */ -}}
{{- $consumers := .Values.alerts.consumerControllers | default (list "cluster" "platform" "dependency" "traffic" "webhook" "cf-deploy") }}
{{- $webhook := .Values.alerts.webhookController | default "webhook" }}
{{- $latency := .Values.alerts.reconcileLatencySeconds | default 10 }}
{{- $stale := .Values.alerts.livenessStalenessSeconds | default 300 }}
{{- $provisioningBudget := .Values.alerts.provisioningBudgetSeconds | default 300 }}
{{- $ackLagBudget := .Values.alerts.materializationAckLagSeconds | default 300 }}
{{- $pagingConditions := .Values.alerts.pagingConditionTypes | default "Conflict|Unresolved|Drifted|BlastBrakeTripped" }}
{{- /* Controllers explicitly configured as MarkTick producers. The timestamp-staleness
       rule pages on no-data, so it is rendered ONLY for these — never for a controller
       with no writer, which would page forever on a deliberately empty series. */ -}}
{{- $tickProducers := .Values.alerts.tickProducerControllers | default (list) }}
{{- /* Every controller= selector must be a bounded recorder label value: the recorder
       (adapters/operator/metrics/metrics.go) folds anything else to "other", so a
       selector naming an unlisted controller could never match a series. Fail closed. */ -}}
{{- $controllerVocabulary := .Values.metricLabels.controllers | default (list) }}
{{- if not $controllerVocabulary }}
{{- fail "metricLabels.controllers must list the bounded controller label vocabulary the recorder enforces" }}
{{- end }}
{{- range $ctrl := concat $toy $consumers (list $webhook) $tickProducers }}
{{- if not (has $ctrl $controllerVocabulary) }}
{{- fail (printf "alert controller %q is outside the bounded metricLabels.controllers vocabulary %v; the recorder would record it as \"other\", so this selector could never match a series" $ctrl $controllerVocabulary) }}
{{- end }}
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: {{ include "fleet-operator.fullname" . }}-reconcile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-operator.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderUID: {{ .Values.alerts.folderUID | quote }}
  interval: 1m
  rules:
{{- range $ctrl := $toy }}
{{- /* reconcile error rate */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-reconcile-errors" $ctrl)
      "title" (printf "fleet-operator %s reconcile errors elevated" $ctrl)
      "summary" (printf "The %s controller reconcile error rate is elevated" $ctrl)
      "controller" $ctrl "source" "toy" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(controller_runtime_reconcile_errors_total{controller=\"%s\"}[5m]))" $ctrl)
      "evaluator" "gt" "threshold" 0) }}
{{- /* reconcile latency (p99) */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-reconcile-latency" $ctrl)
      "title" (printf "fleet-operator %s reconcile latency high" $ctrl)
      "summary" (printf "The %s controller p99 reconcile latency exceeds %v s" $ctrl $latency)
      "controller" $ctrl "source" "toy" "severity" "warning" "for" "10m"
      "expr" (printf "histogram_quantile(0.99, sum by (le) (rate(controller_runtime_reconcile_time_seconds_bucket{controller=\"%s\"}[5m])))" $ctrl)
      "evaluator" "gt" "threshold" $latency) }}
{{- /* persistent condition state — Conflict/Unresolved/Drifted/BlastBrakeTripped held True pages */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-condition-state" $ctrl)
      "title" (printf "fleet-operator %s persistent bad condition" $ctrl)
      "summary" (printf "The %s controller holds a paging condition (incl. BlastBrakeTripped) True" $ctrl)
      "controller" $ctrl "source" "toy" "severity" "critical" "for" "15m"
      "expr" (printf "max by (type) (fleet_operator_condition{controller=\"%s\",type=~\"%s\"})" $ctrl $pagingConditions)
      "evaluator" "gt" "threshold" 0) }}
{{- /* durable-ledger failures */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-ledger-failures" $ctrl)
      "title" (printf "fleet-operator %s durable-ledger failures" $ctrl)
      "summary" (printf "The %s controller is failing durable-ledger operations" $ctrl)
      "controller" $ctrl "source" "toy" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(fleet_operator_ledger_failures_total{controller=\"%s\"}[5m]))" $ctrl)
      "evaluator" "gt" "threshold" 0) }}
{{- end }}
{{- /* Poll-loop liveness — TIMESTAMP staleness (time() - last-successful-tick), noDataState
       Alerting so a frozen or silent poll loop is loudly known instead of averaging away.
       Rendered ONLY for controllers explicitly declared in alerts.tickProducerControllers,
       because that no-data page is correct for a real MarkTick producer and a permanent
       false page for anything else. Empty (the default) ships no staleness rule. */ -}}
{{- range $ctrl := $tickProducers }}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-reconcile-staleness" $ctrl)
      "title" (printf "fleet-operator %s reconcile loop stale" $ctrl)
      "summary" (printf "The %s reconcile/poll loop has not reported a successful tick recently (stale = page)" $ctrl)
      "description" (printf "The %s controller is a configured producer of fleet_operator_last_successful_tick_timestamp_seconds, so an absent or frozen timestamp means its poll loop is not reporting successful ticks — no-data pages by design." $ctrl)
      "controller" $ctrl "severity" "critical" "for" "10m" "noData" "Alerting"
      "source" (ternary "toy" "consumer-extension" (has $ctrl $toy))
      "expr" (printf "time() - max by (controller) (fleet_operator_last_successful_tick_timestamp_seconds{controller=\"%s\"})" $ctrl)
      "evaluator" "gt" "threshold" $stale) }}
{{- end }}
{{- range $ctrl := $consumers }}
{{- /* DNS/vendor API failure rate */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-vendor-api-failures" $ctrl)
      "title" (printf "fleet-operator %s DNS/vendor API failures" $ctrl)
      "summary" (printf "The %s controller is seeing DNS/vendor API failures" $ctrl)
      "controller" $ctrl "source" "consumer-extension" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(fleet_operator_vendor_api_failures_total{controller=\"%s\"}[5m]))" $ctrl)
      "evaluator" "gt" "threshold" 0) }}
{{- /* provisioning duration budget */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-provisioning-duration" $ctrl)
      "title" (printf "fleet-operator %s provisioning duration over budget" $ctrl)
      "summary" (printf "The %s controller p99 provisioning duration exceeds %v s" $ctrl $provisioningBudget)
      "controller" $ctrl "source" "consumer-extension" "severity" "warning" "for" "15m"
      "expr" (printf "histogram_quantile(0.99, sum by (le) (rate(fleet_operator_provisioning_duration_seconds_bucket{controller=\"%s\"}[30m])))" $ctrl)
      "evaluator" "gt" "threshold" $provisioningBudget) }}
{{- /* persistent condition state incl. BlastBrakeTripped — real controllers are where brakes trip */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-condition-state" $ctrl)
      "title" (printf "fleet-operator %s persistent bad condition" $ctrl)
      "summary" (printf "The %s controller holds a paging condition (incl. BlastBrakeTripped) True" $ctrl)
      "controller" $ctrl "source" "consumer-extension" "severity" "critical" "for" "15m"
      "expr" (printf "max by (type) (fleet_operator_condition{controller=\"%s\",type=~\"%s\"})" $ctrl $pagingConditions)
      "evaluator" "gt" "threshold" 0) }}
{{- end }}
{{- /* Webhook config-plane signals (Q-WH13): compile failures, per-landscape ack lag, tenant-sync.
       Webhook delivery-path signals belong to mercury (Q-WH8): they are its own in-app exports, so
       this operator registers no webhook delivery-event family and no delivery-state vocabulary. */ -}}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-webhook-compile-failures" $webhook)
      "title" (printf "fleet-operator %s webhook config-compile failures" $webhook)
      "summary" (printf "The %s controller is failing to compile webhook config fragments" $webhook)
      "controller" $webhook "source" "consumer-extension" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(fleet_operator_webhook_compile_failures_total{controller=\"%s\"}[5m]))" $webhook)
      "evaluator" "gt" "threshold" 0) }}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-materialization-ack-lag" $webhook)
      "title" (printf "fleet-operator %s materialization/ack lag over budget" $webhook)
      "summary" (printf "A landscape is stuck behind cfg:gen — %s materialization/ack lag exceeds %v s" $webhook $ackLagBudget)
      "controller" $webhook "source" "consumer-extension" "severity" "critical" "for" "10m"
      "expr" (printf "max by (controller) (fleet_operator_materialization_ack_lag_seconds{controller=\"%s\"})" $webhook)
      "evaluator" "gt" "threshold" $ackLagBudget) }}
{{- include "fleet-operator.alertrule" (dict
      "uid" (printf "fleet-operator-%s-tenant-sync-failures" $webhook)
      "title" (printf "fleet-operator %s internal-tenant sync failures" $webhook)
      "summary" (printf "The %s controller is failing to sync internal tenants through mercury's management API" $webhook)
      "controller" $webhook "source" "consumer-extension" "severity" "warning" "for" "5m"
      "expr" (printf "sum(rate(fleet_operator_tenant_sync_failures_total{controller=\"%s\"}[5m]))" $webhook)
      "evaluator" "gt" "threshold" 0) }}
{{- end }}
