{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "operator-template.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "operator-template.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      scheme: https
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.serviceMonitor.scraper.create }}
      # Present the authorized scraper identity's token, not the manager's own.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "operator-template.scraperName" . }}-token
          key: token
      {{- end }}
      tlsConfig:
        insecureSkipVerify: true
{{- end }}
