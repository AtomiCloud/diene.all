apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator-template.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "operator-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "operator-template.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "operator-template.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "operator-template.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --enable-note={{ .Values.controllers.note }}
            - --enable-journal={{ .Values.controllers.journal }}
            - --observe={{ eq .Values.mode "observe" }}
            - --blast-brake-cap={{ .Values.blastBrakeCap }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            - --platform={{ .Values.ledger.platform }}
            - --landscape={{ .Values.ledger.landscape }}
            - --ledger-endpoint={{ .Values.ledger.endpoint }}
            - --ledger-bucket={{ .Values.ledger.bucket }}
            - --ledger-secure={{ .Values.ledger.secure }}
          env:
            - name: LEDGER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "operator-template.fullname" . }}-ledger
                  key: accessKey
                  optional: true
            - name: LEDGER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "operator-template.fullname" . }}-ledger
                  key: secretKey
                  optional: true
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
