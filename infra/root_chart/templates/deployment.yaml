apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "fleet-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fleet-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "fleet-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --enable-cluster={{ .Values.controllers.cluster }}
            - --enable-platform={{ .Values.controllers.platform }}
            - --enable-dependency={{ .Values.controllers.dependency }}
            - --enable-traffic={{ .Values.controllers.traffic }}
            - --enable-webhook={{ .Values.controllers.webhook }}
            - --enable-cf-deploy={{ index .Values.controllers "cf-deploy" }}
            - --enable-problem={{ .Values.controllers.problem }}
            - --observe={{ eq .Values.mode "observe" }}
            - --blast-brake-cap={{ .Values.blastBrakeCap }}
            - --traffic-cap-percent={{ .Values.trafficCapPercent }}
            - --dependency-destructive-cap-per-tick={{ .Values.dependencyDestructiveCapPerTick }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            - --platform={{ .Values.ledger.platform }}
            - --landscape={{ .Values.ledger.landscape }}
            - --ledger-endpoint={{ .Values.ledger.endpoint }}
            - --ledger-bucket={{ .Values.ledger.bucket }}
            - --ledger-secure={{ .Values.ledger.secure }}
          env:
            - name: LEDGER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet-operator.fullname" . }}-ledger
                  key: accessKey
                  optional: true
            - name: LEDGER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleet-operator.fullname" . }}-ledger
                  key: secretKey
                  optional: true
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
