{{- include "boron.assertProfile" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boron.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boron.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "boron.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boron.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "boron.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "boron.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect=true
            - --enable-account={{ .Values.controllers.account }}
            - --enable-tunnel={{ .Values.controllers.tunnel }}
            - --enable-exposure={{ .Values.controllers.exposure }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            - --install-profile={{ .Values.installation.profile }}
            - --connected={{ .Values.installation.connected }}
            - --ditto-inspect={{ .Values.installation.dittoInspect }}
            - --landscape={{ .Values.installation.landscape }}
            - --instance={{ .Values.installation.instance }}
            - --cloudflared-image={{ .Values.cloudflaredImage }}
            - --fake-cloudflare={{ .Values.fakeCloudflare }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
