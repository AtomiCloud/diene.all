{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "fleet-operator.labels" . | nindent 4 }}
data:
  fleet-operator.json: |
    {
      "title": "Fleet Operator — Reconcile & Fleet Taxonomy",
      "uid": "fleet-operator",
      "schemaVersion": 39,
      "editable": true,
      "panels": [
        {
          "id": 1,
          "title": "Reconcile rate by controller",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller) (rate(controller_runtime_reconcile_total[5m]))" }
          ]
        },
        {
          "id": 2,
          "title": "Reconcile errors by controller",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m]))" }
          ]
        },
        {
          "id": 3,
          "title": "Reconcile latency p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, controller) (rate(controller_runtime_reconcile_time_seconds_bucket[5m])))" }
          ]
        },
        {
          "id": 4,
          "title": "Workqueue depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "sum by (name) (workqueue_depth)" }
          ]
        },
        {
          "id": 5,
          "title": "Condition state by controller/type",
          "type": "timeseries",
          "description": "Conflict/Unresolved/Drifted/BlastBrakeTripped held True is a paging condition.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "refId": "A", "expr": "fleet_operator_condition" }
          ]
        },
        {
          "id": 6,
          "title": "Ledger failures by controller",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller) (rate(fleet_operator_ledger_failures_total[5m]))" }
          ]
        },
        {
          "id": 7,
          "title": "Reconcile/poll staleness (s since last successful tick)",
          "type": "timeseries",
          "description": "Timestamp-staleness liveness: time() - last-successful-tick. Stale = page.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            { "refId": "A", "expr": "time() - max by (controller) (fleet_operator_last_successful_tick_timestamp_seconds)" }
          ]
        },
        {
          "id": 8,
          "title": "DNS/vendor API failures by controller",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller, vendor) (rate(fleet_operator_vendor_api_failures_total[5m]))" }
          ]
        },
        {
          "id": 9,
          "title": "Provisioning duration p99",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, controller) (rate(fleet_operator_provisioning_duration_seconds_bucket[30m])))" }
          ]
        },
        {
          "id": 10,
          "title": "Webhook config-compile failures",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller) (rate(fleet_operator_webhook_compile_failures_total[5m]))" }
          ]
        },
        {
          "id": 11,
          "title": "Webhook materialization/ack lag (s)",
          "type": "timeseries",
          "description": "A landscape stuck behind cfg:gen shows rising lag.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "targets": [
            { "refId": "A", "expr": "max by (controller) (fleet_operator_materialization_ack_lag_seconds)" }
          ]
        },
        {
          "id": 12,
          "title": "Webhook internal-tenant sync failures",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 40 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller) (rate(fleet_operator_tenant_sync_failures_total[5m]))" }
          ]
        },
        {
          "id": 13,
          "title": "Observe-mode plan actions (destructive split)",
          "type": "timeseries",
          "description": "The would-apply plan surface: a healthy fleet in observe mode holds an empty plan.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "targets": [
            { "refId": "A", "expr": "sum by (controller, destructive) (fleet_operator_plan_actions)" }
          ]
        }
      ]
    }
{{- end }}
