{{- /* ### go-consumer-externalsecret */ -}}
{{- /* #### source: go-consumer */ -}}
{{- if .Values.secret.enabled -}}
{{- include "goconsumer.validateServiceTree" . -}}
{{- /* One service-scoped ExternalSecret materializing the service secret from the
       platform SecretStore carbon creates (R16 — `sulfoxide-bromine:` is dissolved).
       All submodules of a service share one secret, and it is named after the
       SERVICE, not the module (B30.4). Shared and service folders are fanned in
       with disjoint key prefixes (B9d). */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "goconsumer.resourceName" (dict "root" . "token" "secrets") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goconsumer.labels" . | nindent 4 }}
  annotations:
    {{- include "goconsumer.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: {{ .Values.secret.syncWave | quote }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ .Values.serviceTree.service }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ .Values.secret.sharedFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: 'SHARED_$1'
    - find:
        path: {{ .Values.secret.serviceFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ upper .Values.serviceTree.service }}_$1'
{{- end }}
