{{- if .Values.secret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mercury.fullname" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ include "mercury.fullname" . }}
    creationPolicy: Owner
  data:
    # Dependency connection values materialized through the ordinary
    # dependency/vault rails. Every key here has a matching secretKeyRef consumer
    # in the Deployment and db-init Job; scripts/validate/chart-contracts.sh
    # asserts that producer/consumer parity so the pods can never boot with an
    # unresolvable secretKeyRef (CreateContainerConfigError).
    - secretKey: redis-url
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: REDIS_URL}
    - secretKey: postgres-url
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: POSTGRES_URL}
    - secretKey: archive-endpoint
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: ARCHIVE_ENDPOINT}
    - secretKey: archive-bucket
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: ARCHIVE_BUCKET}
    - secretKey: archive-region
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: ARCHIVE_REGION}
    - secretKey: console-session-secret
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: CONSOLE_SESSION_SECRET}
    - secretKey: management-bootstrap-token
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: MANAGEMENT_BOOTSTRAP_TOKEN}
    - secretKey: archive-access-key-id
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: TIGRIS_ACCESS_KEY_ID}
    - secretKey: archive-secret-access-key
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: TIGRIS_SECRET_ACCESS_KEY}
    - secretKey: console-authorization-private-key
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: CONSOLE_AUTHORIZATION_PRIVATE_KEY}
    - secretKey: console-authorization-public-key
      remoteRef: {key: {{ .Values.secret.serviceFolder | quote }}, property: CONSOLE_AUTHORIZATION_PUBLIC_KEY}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mercury.fullname" . }}-providers
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ include "mercury.fullname" . }}-providers
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secret.providerFolder | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mercury.fullname" . }}-endpoints
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ include "mercury.fullname" . }}-endpoints
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secret.endpointFolder | quote }}
{{- end }}
