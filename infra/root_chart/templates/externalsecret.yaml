{{- /* ### dotnet-api-externalsecret */ -}}
{{- /* #### source: dotnet-api */ -}}
{{- if .Values.secret.enabled -}}
{{- include "dotnetapi.validateServiceTree" . -}}
{{- /* One service-scoped ExternalSecret materializing the service secret from the platform
       SecretStore that carbon creates through the SoS chain — 1 platform = 1 SecretStore.
       The service ASSUMES the store exists; it never provisions one, there is no
       `sulfoxide-bromine:` values key (R16 — the operator absorbed it), and there is no
       PushSecret (B12). This chart only ever READS.

       Shared and service folders are fanned in with disjoint key prefixes (B9d), so a key in
       the platform-wide folder cannot silently shadow a service key of the same name. The
       secret is named after the SERVICE, not the module: all of a service's submodules share
       the one secret. */ -}}
apiVersion: {{ .Values.secret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "dotnetapi.resourceName" (dict "root" . "token" "secrets") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dotnetapi.labels" . | nindent 4 }}
  annotations:
    {{- include "dotnetapi.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: {{ .Values.secret.syncWave | quote }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ .Values.serviceTree.service | quote }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ .Values.secret.sharedFolder | quote }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: 'SHARED_$1'
    - find:
        path: {{ .Values.secret.serviceFolder | quote }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ include "dotnetapi.envPrefix" . }}_$1'
{{- end }}
