apiVersion: v1
kind: Service
metadata:
  name: {{ include "mercury.fullname" . }}
  labels:
    {{- include "mercury.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  selector:
    {{- include "mercury.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    - {name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: http}
