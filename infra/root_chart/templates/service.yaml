apiVersion: v1
kind: Service
metadata:
  name: {{ include "boron.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "boron.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "boron.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
