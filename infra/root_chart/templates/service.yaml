apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleet-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "fleet-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
