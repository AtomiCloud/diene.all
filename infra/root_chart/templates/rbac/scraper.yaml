{{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.scraper.create }}
# Least-privilege metrics scraper identity. controller-runtime's metrics filter
# requires the caller to be authenticated and authorized for GET /metrics; the
# manager's own token is deliberately not granted that access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "operator-template.scraperName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator-template.scraperName" . }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator-template.scraperName" . }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "operator-template.scraperName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "operator-template.scraperName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "operator-template.scraperName" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "operator-template.scraperName" . }}
type: kubernetes.io/service-account-token
{{- end }}
