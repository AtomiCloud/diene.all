apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "boron.fullname" . }}-manager
  labels:
    {{- include "boron.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boron-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "boron.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
