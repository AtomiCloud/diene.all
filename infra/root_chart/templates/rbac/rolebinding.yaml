apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "operator-template.fullname" . }}-manager
  labels:
    {{- include "operator-template.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-template-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "operator-template.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
