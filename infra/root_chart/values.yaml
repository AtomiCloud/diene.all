# ### go-base-values
# #### source: go-base

# -- Manager container image repository.
image:
  repository: ghcr.io/atomicloud/boron
  # -- Image tag; defaults to the chart appVersion when empty.
  tag: ''
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of manager replicas. Leader election keeps a single active manager.
replicas: 1

# -- Per-controller enablement flags.
controllers:
  # -- Enable the Account controller (credential validation).
  account: true
  # -- Enable the Tunnel controller (cloudflared + remote config).
  tunnel: true
  # -- Enable the Exposure controller (Access Application + DNS).
  exposure: true

# -- Trusted installation identity (Garden-supplied; never CR input).
installation:
  # -- Installation profile: lapras, ditto, or registered. Hosted (eevee,
  # plusle, minun) and hermetic (rotom, absol) profiles never install Boron.
  profile: lapras
  # -- The profile is connected (required for lapras/ditto programming).
  connected: false
  # -- Explicitly enable Boron on a ditto inspection run.
  dittoInspect: false
  # -- Trusted landscape every Exposure must declare.
  landscape: lapras
  # -- Trusted instance every Exposure must declare.
  instance: ''

# -- Pinned cloudflared tunnel client image.
cloudflaredImage: cloudflare/cloudflared:2025.7.0

# -- Use the in-memory fake Cloudflare adapter (SIT/e2e only, never production).
fakeCloudflare: false

# -- Manager resource requests and limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Secured metrics endpoint configuration.
metrics:
  # -- Metrics bind port (HTTPS, authn/authz filtered).
  port: 8443

# -- ServiceMonitor for Prometheus scraping of the secured metrics endpoint. The
# endpoint uses controller-runtime's authn/authz filter, so the scraper must
# present an authorized identity, not merely the manager's own token.
serviceMonitor:
  # -- Ship a ServiceMonitor.
  enabled: true
  # -- Scrape interval.
  interval: 30s
  # -- Least-privilege scraper identity with get on the /metrics non-resource URL.
  scraper:
    # -- Create the scraper ServiceAccount, ClusterRole, binding, and token Secret.
    create: true
    # -- ServiceAccount name; defaults to <release>-metrics-reader when empty.
    serviceAccountName: ''
    # -- When create=false, an externally-provisioned authorized bearer-token
    # Secret must be named here (with its key). An enabled ServiceMonitor with
    # neither create=true nor an external secret is rejected at render time —
    # an unauthenticated scrape of the authn/authz-filtered endpoint is never
    # allowed.
    externalSecret:
      name: ''
      key: token

# -- Grafana alert pack (GrafanaAlertRuleGroup, never PrometheusRule).
alerts:
  # -- Ship the GrafanaAlertRuleGroup.
  enabled: true
  # -- Grafana folder UID the rule group is filed under.
  folderUID: boron

# -- Grafana dashboard shipped as a sidecar-labelled ConfigMap.
dashboard:
  # -- Ship the dashboard ConfigMap.
  enabled: true

# -- ServiceAccount name override; defaults to the release fullname.
serviceAccount:
  name: ''
