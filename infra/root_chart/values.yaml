# ### go-base-values
# #### source: go-base

# -- Manager container image repository.
image:
  repository: ghcr.io/atomicloud/diene.fleet-operator
  # -- Image tag; defaults to the chart appVersion when empty.
  tag: ''
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of manager replicas. Leader election keeps a single active manager.
replicas: 1

# -- Reconcile mode: observe (read-only, report the would-apply plan) or active.
mode: active

# -- Destructive-write percentage-per-tick blast-brake cap.
blastBrakeCap: 20

# -- Traffic record-removal percentage-per-tick cap.
trafficCapPercent: 20

# -- Dependency destructive-module cap per tick.
dependencyDestructiveCapPerTick: 3

# -- Ledger coordinate scope and S3/MinIO backend.
ledger:
  # -- Platform coordinate.
  platform: diene
  # -- Landscape coordinate (overridden per landscape values file).
  landscape: lapras
  # -- S3/MinIO endpoint host:port.
  endpoint: ''
  # -- Ledger bucket name.
  bucket: fleet-operator-ledger
  # -- Use TLS for the ledger endpoint.
  secure: true

# -- Per-controller enablement flags.
controllers:
  # -- Enable the cluster controller.
  cluster: false
  # -- Enable the platform controller.
  platform: false
  # -- Enable the dependency controller.
  dependency: false
  # -- Enable the traffic controller.
  traffic: false
  # -- Enable the webhook controller.
  webhook: false
  # -- Enable the Cloudflare deployment controller.
  cf-deploy: false
  # -- Enable the reserved Problem sub-component seam.
  problem: false

# -- Manager resource requests and limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Secured metrics endpoint configuration.
metrics:
  # -- Metrics bind port (HTTPS, authn/authz filtered).
  port: 8443

# -- ServiceMonitor for Prometheus scraping of the secured metrics endpoint. The
# endpoint uses controller-runtime's authn/authz filter, so the scraper must
# present an authorized identity, not merely the manager's own token.
serviceMonitor:
  # -- Ship a ServiceMonitor.
  enabled: true
  # -- Scrape interval.
  interval: 30s
  # -- Least-privilege scraper identity with get on the /metrics non-resource URL.
  scraper:
    # -- Create the scraper ServiceAccount, ClusterRole, binding, and token Secret.
    create: true
    # -- ServiceAccount name; defaults to <release>-metrics-reader when empty.
    serviceAccountName: ''
    # -- When create=false, an externally-provisioned authorized bearer-token
    # Secret must be named here (with its key). An enabled ServiceMonitor with
    # neither create=true nor an external secret is rejected at render time —
    # an unauthenticated scrape of the authn/authz-filtered endpoint is never
    # allowed.
    externalSecret:
      name: ''
      key: token

# -- Grafana alert pack (GrafanaAlertRuleGroup, never PrometheusRule).
alerts:
  # -- Ship the GrafanaAlertRuleGroup.
  enabled: true
  # -- Grafana folder UID the rule group is filed under.
  folderUID: fleet-operator
  # -- Controllers explicitly configured as producers of the last-successful-tick
  # TIMESTAMP gauge (`Recorder.MarkTick`). The timestamp-staleness rule pages on
  # no-data by design, so it is rendered ONLY for the controllers listed here — a
  # controller with no writer would otherwise page forever on a deliberately empty
  # series. Empty is the safe default: no staleness rule is shipped at all. Every
  # entry must be a bounded `metricLabels.controllers` value or the render fails.
  tickProducerControllers: []

# -- Bounded metric label vocabularies. These MIRROR the closed vocabularies
# `adapters/operator/metrics/metrics.go` enforces at the recorder boundary: a
# label value outside its vocabulary is recorded as the fixed `other` sentinel,
# so a chart selector naming an unlisted value could never match a series. They
# are rendered into the metric-taxonomy ConfigMap and cross-checked against the
# Go recorder by `scripts/validate/operator-observability-artifacts.ts`.
metricLabels:
  # -- Closed controller label vocabulary (plus the fixed `other` overflow): the
  # seven real enable seams the runtime declares. `problem` is
  # reserved — its seam is not folded yet, so nothing emits under that label
  # today, but a known future controller must have its own label instead of
  # collapsing into `other` the day its writer lands.
  controllers:
    - cluster
    - platform
    - dependency
    - traffic
    - webhook
    - cf-deploy
    - problem
  # -- Closed vendor label vocabulary (plus the fixed `other` overflow). The
  # ProviderAccount CRD vendor grammar is deliberately open; this observability
  # vocabulary is not that grammar, and an unlisted vendor is identified from the
  # vendor-call-failure log line instead of by minting a new series.
  vendors:
    - cloudflare
    - neon
    - aws
    - infisical
    - mercury

# -- Grafana dashboard shipped as a sidecar-labelled ConfigMap.
dashboard:
  # -- Ship the dashboard ConfigMap.
  enabled: true

# -- ServiceAccount name override; defaults to the release fullname.
serviceAccount:
  name: ''
