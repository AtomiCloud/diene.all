# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
    ports:
      - '${POSTGRES_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}']
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    ports:
      - '${REDIS_PORT}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY}
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID}
    ports:
      - '${STORAGE_PORT}:9000'
      - '${STORAGE_CONSOLE_PORT}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 2s
      retries: 30

  minio-create:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY_ID}" "$${STORAGE_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing local/go-consumer &&
        mc mb --ignore-existing local/go-consumer-archive
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}

  clickhouse:
    image: clickhouse/clickhouse-server:25.6.3.116-alpine
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - '${CLICKHOUSE_HTTP_PORT}:8123'
    healthcheck:
      test:
        [
          'CMD',
          'clickhouse-client',
          '--host',
          '127.0.0.1',
          '--query',
          'CREATE TABLE IF NOT EXISTS otel.__ddl_probe (v UInt8) ENGINE = Null',
        ]
      interval: 3s
      timeout: 2s
      retries: 40

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.120.0
    command: ['-storageDataPath=/storage']
    ports:
      - '${VICTORIA_METRICS_PORT}:8428'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8428/health']
      interval: 3s
      timeout: 2s
      retries: 40

  alloy:
    image: grafana/alloy:v1.10.0
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '/etc/alloy/config.alloy']
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
    ports:
      - '${OTEL_HTTP_PORT}:4318'
    depends_on:
      otel-collector:
        condition: service_started
      victoria-metrics:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - '${GRAFANA_PORT}:3000'
    depends_on:
      clickhouse:
        condition: service_healthy
      victoria-metrics:
        condition: service_healthy
