# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
x-mercury-dependencies: &mercury-dependencies
  neon: { condition: service_healthy }
  tigris: { condition: service_healthy }
  tigris-init: { condition: service_completed_successfully }
  mercury-dbinit: { condition: service_completed_successfully }
  sink-coordinate: { condition: service_healthy }
  sink-canonical: { condition: service_healthy }
  sink-external: { condition: service_healthy }

x-mercury-common: &mercury-common
  build:
    context: ../..
    dockerfile: infra/Dockerfile
  environment:
    MERCURY_APP__VERSION: sit
    NODE_EXTRA_CA_CERTS: /var/run/secrets/mercury/ca/ca.pem
  volumes:
    - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
  depends_on: *mercury-dependencies
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - const r=await fetch('http://127.0.0.1:8080/health/ready');process.exit(r.ok?0:1)
    interval: 3s
    timeout: 2s
    retries: 60

x-sink-common: &sink-common
  build:
    context: ../..
    dockerfile: infra/Dockerfile
  entrypoint: [bun, /app/dist/sit-sink.js]
  environment:
    SIT_ENDPOINT_SECRET_FILE: /var/run/secrets/mercury/endpoint-signing-secret
    SIT_SINK_PORT: '8080'
  volumes:
    - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
  healthcheck:
    test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  upstash-lapras:
    image: redis:7.4.5-alpine
    command: [redis-server, --save, '60', '1']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [upstash-lapras-data:/data]

  upstash-farfetch:
    image: redis:7.4.5-alpine
    command: [redis-server, --save, '60', '1']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [upstash-farfetch-data:/data]

  neon:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: mercury
      POSTGRES_PASSWORD: mercury
      POSTGRES_USER: mercury
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mercury -d mercury]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [neon-data:/var/lib/postgresql/data]

  tigris:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_PASSWORD: mercury-secret
      MINIO_ROOT_USER: mercury
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: [tigris-data:/data]

  tigris-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      tigris: { condition: service_healthy }
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://tigris:9000 mercury mercury-secret &&
        mc mb --ignore-existing local/mercury-webhook-archive

  sink-coordinate:
    <<: *sink-common

  sink-canonical:
    <<: *sink-common

  sink-external:
    <<: *sink-common

  mercury-dbinit:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: [db-init]
    environment:
      MERCURY_LANDSCAPE: lapras
    volumes:
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}/mercury-lapras.yaml:/config/mercury.yaml:ro
    depends_on:
      neon: { condition: service_healthy }
      tigris: { condition: service_healthy }
      tigris-init: { condition: service_completed_successfully }

  mercury-lapras:
    <<: *mercury-common
    environment:
      MERCURY_APP__VERSION: sit
      MERCURY_LANDSCAPE: lapras
      NODE_EXTRA_CA_CERTS: /var/run/secrets/mercury/ca/ca.pem
    volumes:
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}/mercury-lapras.yaml:/config/mercury.yaml:ro
    depends_on:
      <<: *mercury-dependencies
      upstash-lapras: { condition: service_healthy }
    ports: ['127.0.0.1:${MERCURY_LAPRAS_PORT:?lapras host port is required}:8080']

  mercury-farfetch:
    <<: *mercury-common
    environment:
      MERCURY_APP__VERSION: sit
      MERCURY_LANDSCAPE: farfetch
      NODE_EXTRA_CA_CERTS: /var/run/secrets/mercury/ca/ca.pem
    volumes:
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}/mercury-farfetch.yaml:/config/mercury.yaml:ro
    depends_on:
      <<: *mercury-dependencies
      upstash-farfetch: { condition: service_healthy }
      mercury-lapras: { condition: service_healthy }
    ports: ['127.0.0.1:${MERCURY_FARFETCH_PORT:?farfetch host port is required}:8080']

  mercury-tls:
    image: nginx:1.29.0-alpine
    depends_on:
      mercury-lapras: { condition: service_healthy }
    ports: ['127.0.0.1:${MERCURY_TLS_PORT:?TLS host port is required}:443']
    volumes:
      - ../sit-control/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/run/sit:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://mercury-lapras:8080/health/ready]
      interval: 2s
      timeout: 2s
      retries: 30

  sit-control:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    entrypoint: [bun, /app/dist/sit-control.js]
    environment:
      MERCURY_SIT_ARCHIVE_BUCKET: mercury-webhook-archive
      MERCURY_SIT_ARCHIVE_ENDPOINT: http://tigris:9000
      MERCURY_SIT_ARCHIVE_REGION: us-east-1
      MERCURY_SIT_CONTROL_BEARER_FILE: /var/run/secrets/mercury/sit-control-bearer
      MERCURY_SIT_CONTROL_PORT: '8080'
      MERCURY_SIT_FARFETCH_ORIGIN: http://mercury-farfetch:8080
      MERCURY_SIT_FARFETCH_REDIS_URL: redis://upstash-farfetch:6379
      MERCURY_SIT_LAPRAS_ORIGIN: https://mercury-tls
      MERCURY_SIT_LAPRAS_REDIS_URL: redis://upstash-lapras:6379
      MERCURY_SIT_MATERIAL_ROOT: /var/run/secrets/mercury
      MERCURY_SIT_POSTGRES_URL: postgres://mercury:mercury@neon:5432/mercury
      MERCURY_SIT_PUBLIC_PRODUCT_ORIGIN: ${MERCURY_SIT_PUBLIC_ORIGIN:?public SIT origin is required}
      MERCURY_SIT_SINK_COORDINATE_URL: http://sink-coordinate:8080
      MERCURY_SIT_SINK_EXTERNAL_URL: http://sink-external:8080
      NODE_EXTRA_CA_CERTS: /var/run/secrets/mercury/ca/ca.pem
      MERCURY_SIT_PROOF_BEARER: ${MERCURY_SIT_PROOF_BEARER:-}
      MERCURY_SIT_PROOF_TRUST_JSON: ${MERCURY_SIT_PROOF_TRUST_JSON:-}
    volumes:
      - ${MERCURY_SIT_MATERIAL_DIR:?material directory is required}:/var/run/secrets/mercury:ro
    depends_on:
      mercury-tls: { condition: service_healthy }
      mercury-farfetch: { condition: service_healthy }
      upstash-lapras: { condition: service_healthy }
      upstash-farfetch: { condition: service_healthy }
      neon: { condition: service_healthy }
      tigris: { condition: service_healthy }
    ports: ['127.0.0.1:${MERCURY_SIT_CONTROL_PORT:?SIT control host port is required}:8080']
    healthcheck:
      test: [CMD, bun, -e, "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 3s
      timeout: 2s
      retries: 60

volumes:
  upstash-lapras-data:
  upstash-farfetch-data:
  neon-data:
  tigris-data:
