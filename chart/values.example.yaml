# Independent landscape overlay: a representative managed-cloud or on-prem landscape.
# Xenon stays ON because managed clouds (EKS classic/Auto, DOKS) and on-prem do not
# preinstall metrics-server.
serviceTree:
  landscape: example

metricsServer:
  podLabels:
    atomi.cloud/landscape: example
  podAnnotations:
    atomi.cloud/landscape: example
