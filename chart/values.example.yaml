# Independent landscape overlay example.
serviceTree:
  landscape: example

primordial:
  targetLandscape: example

# The upstream dependency cannot read the wrapper's service-tree helpers, so each
# overlay contributes its own slot to the projection the subchart stamps. Only the
# VALUE is overlay-owned: the key is templated on the shared `global.labelPrefix`,
# exactly as the base projection is, so a prefix override moves this slot too.
upstream:
  global:
    labels:
      '{{ .Values.global.labelPrefix }}/landscape': example
    annotations:
      '{{ .Values.global.labelPrefix }}/landscape': example
