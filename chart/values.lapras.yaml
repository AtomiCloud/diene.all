# Independent local-cluster overlay. It contains no landscape decision.
serviceTree:
  cluster: lapras

# The local install proves the ordinary Kubernetes resources only; the CRDs are owned by later nodes.
secret:
  enabled: false

webhookRoute:
  enabled: false

primordial:
  enabled: false

# The cluster slot is contributed here, exactly as the wrapper-owned helpers do:
# the overlay owns the value, `global.labelPrefix` owns the key.
upstream:
  global:
    labels:
      '{{ .Values.global.labelPrefix }}/cluster': lapras
    annotations:
      '{{ .Values.global.labelPrefix }}/cluster': lapras
