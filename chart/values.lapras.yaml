# Independent local-cluster overlay. It contains no landscape decision.
serviceTree:
  cluster: lapras

# zinc's wildcard ClusterIssuer is absent on local k3d; the registered-fleet certs ride this chart only on real clusters.
registeredCertificates:
  enabled: false

# Local proxy label selecting the kgateway gateway-proxy pods on lapras.
gateway:
  proxy:
    selector:
      app.kubernetes.io/name: kgateway
