# lapras landscape overlay (local dev landscape). LE STAGING directory (Q-I33):
# the staging root is installed locally where trust is needed, and staging
# protects the shared production ACME rate limit. Per-cluster deltas are empty —
# the ClusterIssuer is cluster-scoped and identical across clusters in a landscape.
serviceTree:
  landscape: lapras
issuer:
  refs:
    - name: zinc-letsencrypt
      directory: staging
