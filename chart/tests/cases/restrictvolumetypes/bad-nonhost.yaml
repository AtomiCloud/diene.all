apiVersion: apps/v1
kind: Deployment
metadata:
  name: forbidden-nfs
spec:
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: nginx:1.27.2
      volumes:
        - name: shared
          nfs:
            server: nfs.example.invalid
            path: /exports/workloads
