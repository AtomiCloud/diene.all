apiVersion: apps/v1
kind: Deployment
metadata:
  name: allowed-emptydir
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: nginx:1.27.2
      volumes:
        - name: cache
          emptyDir: {}
