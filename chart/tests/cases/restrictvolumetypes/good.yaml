apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-varlog-carveout
spec:
  template:
    metadata:
      labels:
        app: demo
    spec:
      serviceAccountName: alloy-logs
      containers:
        - name: alloy
          image: grafana/alloy:1.5.0
          volumeMounts:
            - name: hostlogs
              mountPath: /host/var/log
      volumes:
        - name: hostlogs
          hostPath:
            path: /var/log
            pathType: Directory
