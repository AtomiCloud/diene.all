apiVersion: apps/v1
kind: Deployment
metadata:
  name: resourced
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      initContainers: []
      containers:
        - name: app
          image: demo:1.0.0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
