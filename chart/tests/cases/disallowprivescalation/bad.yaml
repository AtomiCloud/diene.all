apiVersion: apps/v1
kind: Deployment
metadata:
  name: priv-escalation
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      initContainers: []
      containers:
        - name: app
          image: demo:1.0.0
          securityContext:
            allowPrivilegeEscalation: true
