apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotated
  annotations:
    atomi.cloud/landscape: example
    atomi.cloud/platform: nitroso
    atomi.cloud/service: demosvc
    atomi.cloud/module: api
    atomi.cloud/layer: '1'
spec:
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: app
          image: demo:1.0.0
