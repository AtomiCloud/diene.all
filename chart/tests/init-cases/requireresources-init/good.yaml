apiVersion: apps/v1
kind: Deployment
metadata:
  name: resourced-init
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36.1
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: app
          image: nginx:1.27.2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
