apiVersion: apps/v1
kind: Deployment
metadata:
  name: unresourced-init
spec:
  template:
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36.1
      containers:
        - name: app
          image: nginx:1.27.2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
