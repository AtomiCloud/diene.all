apiVersion: apps/v1
kind: Deployment
metadata:
  name: nonroot-init
spec:
  template:
    spec:
      securityContext: {runAsNonRoot: true}
      initContainers:
        - name: setup
          image: busybox:1.36.1
          securityContext: {runAsNonRoot: true}
      containers:
        - name: app
          image: nginx:1.27.2
          securityContext: {runAsNonRoot: true}
