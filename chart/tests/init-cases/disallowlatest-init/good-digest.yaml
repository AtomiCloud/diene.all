    spec:
      initContainers:
        - name: setup
          image: registry.example.invalid:5000/team/setup@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      containers:
        - name: app
          image: nginx:1.27.2
