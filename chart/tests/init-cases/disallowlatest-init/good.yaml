apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagged-init
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36.1
      containers:
        - name: app
          image: nginx:1.27.2
