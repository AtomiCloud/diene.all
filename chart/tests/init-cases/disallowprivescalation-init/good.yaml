apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-priv-escalation-init
spec:
  template:
    spec:
      initContainers:
        - name: setup
          image: busybox:1.36.1
          securityContext: {allowPrivilegeEscalation: false}
      containers:
        - name: app
          image: nginx:1.27.2
          securityContext: {allowPrivilegeEscalation: false}
