# -- Values shared with the vendored reloader dependency through Helm's supported
# parent-to-subchart global-values contract.
global:
  # @schema pattern:^[a-z0-9.-]+$;minLength:1;required:true
  # -- Single prefix used by every wrapper service-tree label and annotation helper.
  labelPrefix: atomi.cloud

  # -- Stable service-tree projection. Platform is always the release namespace;
  # landscape and cluster are added by independent overlays.
  serviceTree:
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Service name.
    service: chlorine
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Module name.
    module: reloader
    # @schema pattern:^[0-9]+$;required:true
    # -- Architecture layer.
    layer: '1'

  # -- Optional physical-instance metadata. The instance remains outside LPSM.
  instance:
    # @schema pattern:^[a-z0-9._:/-]+$;minLength:1
    # -- Repository-qualified physical instance id.
    physicalId: example-repository:run-001

# -- Pure passthrough of the vendored stakater/reloader engine. Reloader is the
# last hop of the secret-rotation chain (Infisical rotate → ESO sync → Reloader
# restart): it restarts a workload only when a Secret/ConfigMap the workload
# references changes. This map carries only the minimal upstream overrides:
# canonical names, the pinned image tag, the annotation-opt-in reload stance,
# resource envelopes, container hardening, and the Reloader self opt-in.
reloader:
  # -- Pin the canonical `chlorine-reloader` object names (fullname convention:
  # `<service>-<token>`, exactly one dash). `nameOverride` fixes the chart-name
  # derived identifiers (app labels, container name); `fullnameOverride` fixes
  # the rendered object names.
  nameOverride: reloader
  fullnameOverride: chlorine-reloader

  # -- Pin the controller image to the chart appVersion (VAP forbids `:latest`).
  image:
    tag: v1.4.19

  # -- Upstream reloader controller configuration.
  reloader:
    # -- Annotation OPT-IN, never auto-reload-all. Reloader restarts only the
    # workloads that carry `reloader.stakater.com/auto: "true"` (the opt-in the
    # helm-wrapper bakes into every family chart by default). Flipping this to
    # true would reload EVERY workload unless it opts out — the fleet convention
    # is the opposite, so it stays false.
    autoReloadAll: false

    # -- Default reload strategy (rolling restart via a dated pod annotation);
    # the env-vars/annotations strategies are not used.
    reloadStrategy: default

    deployment:
      # -- Single controller replica; leadership election is off (enableHA:
      # false), so one active instance is the generic default.
      replicas: 1

      # -- CPU and memory envelopes for the controller container (VAP requires
      # both requests and limits on every workload container).
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

      # -- Baseline-plus container hardening (upstream leaves the container
      # securityContext empty; the shared VAP profile requires non-root, no
      # privilege escalation, a read-only root filesystem, and all caps dropped).
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      # -- Reloader opt-in on its own controller Deployment; restarts on config
      # change like every other family chart.
      annotations:
        reloader.stakater.com/auto: 'true'

      # -- Static service-tree labels projected onto the controller Deployment
      # and pod (reloader has no `global.commonLabels` passthrough, so the
      # projection rides the chart's own deployment-label override). Keys stay
      # consistent with `global.serviceTree`; overlays append the landscape
      # label. The namespace-sourced platform label cannot be a static value, so
      # the wrapper-owned LPSM ConfigMap carries the full dynamic LPSM projection.
      labels:
        atomi.cloud/service: chlorine
        atomi.cloud/module: reloader
        atomi.cloud/layer: '1'
