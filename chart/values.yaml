# -- Values shared with the vendored cert-manager dependency through Helm's
# supported parent-to-subchart global-values contract.
global:
  # @schema pattern:^[a-z0-9.-]+$;minLength:1;required:true
  # -- Single prefix used by every wrapper service-tree label and annotation helper.
  labelPrefix: atomi.cloud

  # -- Stable service-tree projection. Platform is always the release namespace;
  # landscape and cluster are added by independent overlays.
  serviceTree:
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Service name.
    service: sulfur
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Module name.
    module: certs
    # @schema pattern:^[0-9]+$;required:true
    # -- Architecture layer.
    layer: '1'

  # -- Optional physical-instance metadata. The instance remains outside LPSM.
  instance:
    # @schema pattern:^[a-z0-9._:/-]+$;minLength:1
    # -- Repository-qualified physical instance id.
    physicalId: example-repository:run-001

  # -- Static service-tree labels projected onto every upstream cert-manager
  # resource through cert-manager's supported `global.commonLabels` passthrough.
  # The namespace-sourced platform label cannot be expressed as a static value,
  # so the wrapper-owned LPSM ConfigMap carries the full dynamic LPSM projection.
  # Overlays append the landscape label. Keys must stay consistent with
  # `global.serviceTree`; the unit `labels` gate enforces the correspondence.
  commonLabels:
    atomi.cloud/service: sulfur
    atomi.cloud/module: certs
    atomi.cloud/layer: '1'

# -- Pure passthrough of the vendored jetstack/cert-manager engine. The wrapper
# adds NO Issuer/ClusterIssuer of its own — the issuer set is zinc's separate
# chart; sulfur owns only the cert-manager engine. This map carries only the
# minimal upstream overrides: CRD installation, the stable Gateway API config
# field, resource envelopes, container hardening, and Reloader opt-in.
certmanager:
  # -- Pin the canonical upstream `cert-manager*` object names (pure passthrough).
  # Without these the aliased dependency folds the `certmanager` alias into every
  # rendered name — including container names, which the API server rejects as
  # non-RFC-1123. `nameOverride` fixes the chart-name-derived identifiers
  # (container names, app labels); `fullnameOverride` fixes the object names.
  nameOverride: cert-manager
  fullnameOverride: cert-manager

  # -- CRD lifecycle stance. CRDs are installed as Helm-managed objects and kept
  # on release uninstall (`keep: true`) so issued Certificates/Issuers survive a
  # chart removal. cert-manager applies CRDs through Helm's ordinary object
  # channel (no separate skipCrds/Server-Side-Apply CRD path is used).
  crds:
    # -- Install the cert-manager CRDs with the release.
    enabled: true
    # -- Retain CRDs on uninstall to protect existing custom resources.
    keep: true

  # -- cert-manager controller runtime configuration (ControllerConfiguration).
  # Gateway API support (Gateway/HTTPRoute TLS for kgateway) is enabled through
  # the stable `enableGatewayAPI` config field. The dead
  # `ExperimentalGatewayAPISupport` feature gate (a no-op since it defaulted true
  # in v1.15) is deliberately NOT set anywhere; the hygiene gate rejects it.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true

  # -- Single controller replica; cert-manager leader-elects, so one active
  # instance is the generic default.
  replicaCount: 1

  # -- CPU and memory envelopes for the controller container (VAP requires both
  # requests and limits on every workload container).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # -- Baseline-plus container hardening for the controller (upstream omits the
  # container-level runAsNonRoot the VAP profile requires).
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Reloader opt-in on the controller Deployment; restarts on config change.
  deploymentAnnotations:
    reloader.stakater.com/auto: 'true'

  webhook:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'

  cainjector:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'

  startupapicheck:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
