# @schema pattern:^[a-z0-9.-]+$;minLength:1
labelPrefix: atomi.cloud
distributionMode: FLEET # @schema enum:[FLEET,GARDEN-LOCAL]

serviceTree:
  platform: diene
  service: lithium
  module: api
  layer: '1'
  landscape: raichu

namespace:
  name: diene

image:
  repository: ghcr.io/atomicloud/aldehyde.logto
  tag: 1.41.0
  digest: '' # Garden target-pull supplies an immutable sha256 digest here.
  pullPolicy: IfNotPresent

credentialGateImage:
  repository: busybox
  tag: 1.36.1
  runAsUser: 10001

# Felix-owned fork packaging contract: release images use this numeric non-root
# USER. The chart does not infer a UID from upstream Logto, which has no USER.
imageSecurity:
  runAsUser: 10001
  runAsGroup: 10001

workload:
  replicas: 1
  port: 3001
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# Fleet consumes, but never writes, the platform-owned secret store.
fleet:
  vlandscape: mew
  issuerZone: cluster.atomi.cloud
  externalSecrets:
    refreshInterval: 1h
    # Carbon owns this platform SecretStore; Lithium only consumes it.
    secretStoreRef: {kind: SecretStore, name: carbon-store}
    # The dependency controller fans this standard payload into every serving row.
    # C0 real Infisical folders are /{class}/{module}; SecretStore selection,
    # not the folder name, carries the platform and environment boundary.
    databasePath: /database/lithium
    databaseSecretName: lithium-database
    bootSecretName: lithium-boot
  publicService:
    type: LoadBalancer

# Garden supplies local Secrets and the exact exposure-derived issuer. This chart
# deliberately owns neither an edge route nor a certificate in this mode.
garden:
  instance: lapras-001
  instanceUID: 00000000-0000-0000-0000-000000000001
  allocationGeneration: '1'
  landscape: lapras
  zone: admin.atomi.cloud
  issuerScheme: https
  issuerPort: 0
  databaseSecret: lithium-database
  databaseKey: DB_URL
  bootSecret: lithium-boot
  bootClientIdKey: SEED_M2M_CLIENT_ID
  bootClientSecretKey: SEED_M2M_CLIENT_SECRET
  operatorSelector: {app.kubernetes.io/name: logto-operator, app.kubernetes.io/part-of: lithium}
  ordinaryRailSelector: {atomi.cloud/rail: ordinary}
