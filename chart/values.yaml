# -- Values shared with the vendored metrics-server dependency through Helm's
# supported parent-to-subchart global-values contract.
global:
  # @schema pattern:^[a-z0-9.-]+$;minLength:1;required:true
  # -- Single prefix used by every service-tree label and annotation helper.
  labelPrefix: atomi.cloud

  # -- Stable service-tree projection. Platform is always the release namespace;
  # landscape and cluster are added by independent overlays.
  serviceTree:
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Service name.
    service: xenon
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Module name.
    module: metrics
    # @schema pattern:^[0-9]+$;required:true
    # -- Architecture layer.
    layer: '1'

  # -- Optional physical-instance metadata. The instance remains outside LPSM.
  instance:
    # @schema pattern:^[a-z0-9._:/-]+$;minLength:1
    # -- Repository-qualified physical instance id.
    physicalId: example-repository:run-001

# -- Per-landscape enablement toggle and the vendored metrics-server chart inputs.
# The whole chart is gated by `metricsServer.enabled`: it defaults ON here for every
# cloud and on-prem landscape (EKS classic/Auto, DOKS, and on-prem do not preinstall
# metrics-server) and is flipped OFF only by the k3d/lapras overlay, because k3s
# bundles metrics-server. Final per-profile ENV roster entries stay outside this node.
metricsServer:
  # @schema required:true
  # -- Per-landscape toggle. ON for cloud/on-prem, OFF for k3d/lapras.
  enabled: true
  # @schema pattern:^[a-z0-9]+-[a-z0-9]+$
  # -- Conforming metrics-server fullname (`<service>-<dashless-token>`).
  fullnameOverride: xenon-metrics
  # @schema minimum:1
  # -- Highly available replica count for managed-cloud deployments.
  replicas: 2
  # -- Reloader opt-in on the metrics-server pod. The vendored integration patch
  # independently projects the global service-tree metadata onto the Deployment
  # and pod; this map retains only the upstream-supported opt-out surface.
  podAnnotations:
    reloader.stakater.com/auto: 'true'
  # -- Pod-level security context satisfying the baseline-plus VAP policy.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- CPU and memory envelopes for the metrics-server container.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # -- Kubelet scrape arguments. Secure TLS is the cloud/on-prem default; the
  # k3d/insecure posture is an overlay decision documented in the README matrix.
  args: []
