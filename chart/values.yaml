# @schema pattern:^[a-z0-9.-]+$;minLength:1
# -- Single configurable prefix used by every service-tree label and annotation.
labelPrefix: atomi.cloud

# -- Stable four-slot service-tree projection. Landscape and cluster are overlay-owned.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: sample
  # @schema pattern:^[a-z0-9]+$;required:true
  service: zinc
  # @schema pattern:^[a-z0-9]+$;required:true
  module: issuer
  # @schema pattern:^[0-9]+$;required:true
  layer: '1'

# -- Registered-fleet issuer materialization. Landscape overlays select only the ACME directory.
issuer:
  # @schema pattern:^[^@ ]+@[^@ ]+\.[^@ ]+$;required:true
  email: platform-ops@atomi.cloud
  # @schema pattern:^zinc-[a-z0-9]+$;required:true
  name: zinc-acme
  # @schema pattern:^zinc-[a-z0-9]+$;required:true
  accountSecretName: zinc-acmeaccount
  # @schema pattern:^https://.+/directory$;required:true
  server: https://acme-staging-v02.api.letsencrypt.org/directory
  # @schema minItems:1;uniqueItems:true;item:string
  dnsZones:
    - cluster.atomi.cloud
  cloudflare:
    apiTokenSecretRef:
      # @schema pattern:^zinc-[a-z0-9]+$;required:true
      name: zinc-cloudflare
      # @schema pattern:^SHARED_[A-Z0-9_]+$;required:true
      key: SHARED_API_TOKEN

# -- ENTEI host-role materialization. The overlay enables both stable issuance-class refs.
entei:
  enabled: false
  # @schema minItems:1;uniqueItems:true;item:string
  dnsZones:
    - eevee.dev.atomi.cloud
    - plusle.dev.atomi.cloud
    - minun.dev.atomi.cloud
    - entei.dev.atomi.cloud
  staging:
    # @schema pattern:^zinc-[a-z0-9]+$;required:true
    name: zinc-staging
    # @schema pattern:^zinc-[a-z0-9]+$;required:true
    accountSecretName: zinc-stagingaccount
    # @schema pattern:^https://.+/directory$;required:true
    server: https://acme-staging-v02.api.letsencrypt.org/directory
  production:
    # @schema pattern:^zinc-[a-z0-9]+$;required:true
    name: zinc-production
    # @schema pattern:^zinc-[a-z0-9]+$;required:true
    accountSecretName: zinc-productionaccount
    # @schema pattern:^https://.+/directory$;required:true
    server: https://acme-v02.api.letsencrypt.org/directory

# -- Cloudflare DNS-01 token materialized through ESO and the platform SecretStore.
secret:
  refreshInterval: 1h
  store:
    # @schema enum:[ClusterSecretStore,SecretStore];required:true
    kind: ClusterSecretStore
    # @schema pattern:^zinc-[a-z0-9]+$;required:true
    name: zinc-platformstore
  # @schema pattern:^/[a-z0-9/_-]+$;required:true
  folder: /shared/cloudflare/dns01
