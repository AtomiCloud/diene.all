# -- Chart-wide values. Helm propagates this table verbatim into every pinned dependency, so it is the only lever a wrapper decision has over an upstream object.
global:
  # @schema pattern:^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$;minLength:1;maxLength:253
  # -- Prefix used by every service-tree label and annotation key, wrapper-owned and upstream alike. It must be one DNS-1123 subdomain.
  labelPrefix: atomi.cloud
  # -- Optional physical-instance metadata. The instance remains outside LPSM and is never minted here. It lives under `global` for the same reason `labelPrefix` does: Helm copies this table verbatim into every pinned dependency, so ONE recorded identity is readable from an upstream template context too. A chart-local copy would stop at the wrapper's own objects and force the dependency's annotations to hard-code a second pair that drifts the moment preview is enabled.
  instance:
    # @schema pattern:^([A-Za-z0-9]([A-Za-z0-9._:/-]*[A-Za-z0-9])?)?$;maxLength:253;required:true
    # -- The unchanged repository-qualified physical id, recorded verbatim. It may be far longer than one DNS label; the authorized minter owns every normalization, so the chart neither lowercases nor shortens it. Empty selects no recorded instance, and then `label` must be empty too.
    original: github.com/AtomiCloud/diene.all/charts/helm-wrapper/pull-requests/12345
    # @schema pattern:^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$;maxLength:63;required:true
    # -- The authorized minter's stable DNS-1123 label for that id, at most 63 bytes. It is the hostname instance segment. The chart never derives it from `original` — it records the pair it was handed.
    label: pr-12345-9f3a1c
    # -- castform preview identity. The chart consumes authorized-assembler output only; it never mints, canonicalizes, or suffixes a petname.
    preview:
      # -- Render the receipt-bound preview coordinate. Every field below is refused unless it is internally consistent.
      enabled: false
      # -- The typed CanonicalPreviewInstance handed to this chart. It must bind byte-for-byte to the receipt below.
      canonical:
        # @schema pattern:^[a-z]+-[a-z]+-[a-z]+(-[0-9a-v]{3})?$
        previewPetname: otter-beats-potato
        # @schema pattern:^[0-9a-f]{64}$
        fullLeaseDigest: 7527f8ce8af22ee78eaaeaa68d24857bf88c3c5a8a9d2fd812f607441cfbca7d
      # -- The broker-verified assembler receipt. `fullLeaseDigest` and `leaseKey` stay internal and are never rendered into an object or a hostname.
      receipt:
        # @schema pattern:^[a-z]+-[a-z]+-[a-z]+(-[0-9a-v]{3})?$
        previewPetname: otter-beats-potato
        # @schema pattern:^[0-9a-f]{64}$
        fullLeaseDigest: 7527f8ce8af22ee78eaaeaa68d24857bf88c3c5a8a9d2fd812f607441cfbca7d
        # @schema pattern:^p[0-9a-v]{26}$
        leaseKey: p00000000000000000000000000 # gitleaks:allow
        # @schema pattern:^diene\.preview-manifest/v[0-9]+$
        schema: diene.preview-manifest/v1
        # @schema pattern:^diene\.preview-wordlist/v[0-9]+$
        wordList: diene.preview-wordlist/v1
        forkSource: staging # @schema enum:[staging, production]
        requester: ci@example.invalid
        mintedAt: '2026-07-30T00:00:00Z'
        signature: ZXhhbXBsZS1lZDI1NTE5LWRldGFjaGVkLXNpZ25hdHVyZQ==
        # -- Live base-petname collision recorded at mint. A digest here is the DIFFERENT live digest that forced the three-character suffix.
        collision:
          # @schema pattern:^([0-9a-f]{64})?$
          liveFullLeaseDigest: ''
      # -- The fully resolved manifest the receipt was minted from. Unresolved branch pins refuse; they are resolved to commits at mint.
      manifest:
        defaultChannelRef: stable-2026.07
        # @schema skipProperties:true
        # @schema additionalProperties:{"anyOf":[{"type":"string"},{"type":"object","properties":{"kind":{"type":"string"},"version":{"type":"string"}},"required":["kind","version"]}]}
        # -- One pin per `<platform>.<service>`. Values are a released version, a full commit, or `{kind: operator, version: <v>}`.
        pins:
          auth.logto:
            kind: operator
            version: 1.8.0
          nitroso.lithium: 1.4.2
          nitroso.zinc: e8266aaad16351c0a8695370b6d4d79d7d744ed2
        # @schema skipProperties:true
        # @schema additionalProperties:{"type":"object","properties":{"branch":{"type":"string"},"commit":{"type":"string"}},"required":["branch","commit"]}
        # -- Branch pins recorded with the commit they resolved to at mint. The commit must equal the pin, so a moving branch cannot move the rendered hostname.
        branchResolutions:
          nitroso.zinc:
            branch: main
            commit: e8266aaad16351c0a8695370b6d4d79d7d744ed2

# @schema pattern:^[a-z0-9]+-[a-z0-9]+$;required:true
# -- Primary workload fullname. It must be `<service>-<dashless-token>`.
fullnameOverride: wrapper-api

# -- Stable four-slot service-tree projection. Landscape and cluster are added by independent overlays.
serviceTree:
  # @schema pattern:^[a-z0-9]+$;required:true
  platform: sample
  # @schema pattern:^[a-z0-9]+$;required:true
  service: wrapper
  # @schema pattern:^[a-z0-9]+$;required:true
  module: api
  # @schema pattern:^[0-9]+$;required:true
  layer: '2'

# -- Wrapper-owned sample workload.
workload:
  replicas: 1 # @schema minimum:1
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: 6.9.2 # @schema pattern:^[A-Za-z0-9][A-Za-z0-9._-]*$
    pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]
  port: 9898 # @schema minimum:1;maximum:65535
  reloader:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# -- Separate pre-sync migration hook. It never owns or recreates the Deployment.
migration:
  enabled: true
  image:
    repository: busybox
    tag: 1.37.0-glibc # @schema pattern:^[A-Za-z0-9][A-Za-z0-9._-]*$
    pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]
  command: ['sh', '-c', 'echo migration-ready']
  reloader:
    enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 25m
      memory: 32Mi

# -- One service-scoped ExternalSecret with folder-prefix rewrites.
secret:
  enabled: true
  refreshInterval: 1h
  store:
    kind: SecretStore # @schema enum:[SecretStore, ClusterSecretStore]
    name: sample-store
  sharedFolder: /shared
  serviceFolder: /wrapper

# -- Provider-managed LoadBalancer service for the gateway.
gateway:
  enabled: true
  provider: digitalocean # @schema enum:[aws, oci, digitalocean]
  port: 80 # @schema minimum:1;maximum:65535
  aws:
    subnetIds: [] # @schema item:string;uniqueItems:true
    eipAllocationIds: [] # @schema item:string;uniqueItems:true
  oci:
    reservedPublicIp: ''

# -- Current health and webhook delivery conventions.
contracts:
  health:
    path: /healthz # @schema pattern:^/.*
    expectedStatus: 2xx
  webhook:
    provider: example # @schema pattern:^[a-z0-9-]+$
    pathPrefix: /internal/webhooks # @schema pattern:^/.*
  lpsm:
    # Every coordinate slot is exactly one DNS-1123 label: start and end
    # alphanumeric, internal dashes only, at most 63 bytes. The forward hostname
    # helper applies the identical rule to the identical bytes, so a label that
    # reaches a rendered coordinate always parses back out of it. A looser
    # pattern here is what let `-example` and a 64-byte slot render.
    # @schema pattern:^[a-z0-9]([a-z0-9-]*[a-z0-9])?$;maxLength:63
    landscape: example
    # @schema pattern:^[a-z0-9]([a-z0-9-]*[a-z0-9])?$;maxLength:63
    module: api
    # @schema pattern:^[a-z0-9]([a-z0-9-]*[a-z0-9])?$;maxLength:63
    service: wrapper
    # The instance slot stays optional: empty selects the four-slot form. Any
    # supplied value is still one whole DNS-1123 label.
    # @schema pattern:^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)?$;maxLength:63
    instance: run001
    # A zone is one or more dot-separated DNS-1123 labels, each bounded at 63
    # bytes by the segment pattern itself; the chart appends it verbatim, so a
    # malformed segment is a malformed hostname label.
    # @schema pattern:^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$;minLength:1
    ordinaryZone: cluster.atomi.cloud
    # @schema pattern:^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$;minLength:1
    instanceZone: local.example.invalid
    # Deliberately unconstrained: this is the INVERSE boundary's input, and the
    # parser's own refusal is the thing under test. Constraining it here would
    # move every parser vector's refusal to the schema and leave the parser
    # asserted by nothing.
    parseHostname: ''

# -- Optional Gateway API route scaffold for a webhook receiver.
webhookRoute:
  enabled: true
  parentGateway: sample-gateway
  parentNamespace: gateway-system

# -- Reusable primordial-chart CR helper inputs against the frozen T3 shapes.
primordial:
  enabled: true
  apiVersions:
    fleet: fleet.atomi.cloud/v1alpha1
    identity: identity.atomi.cloud/v1alpha1
    edge: edge.atomi.cloud/v1alpha1
  targetLandscape: example
  vlandscape: example-vlandscape
  placement:
    preferredHost: example-host
  platformDependency:
    modules:
      database: # @schema mergeProperties:true
        maindb:
          type: neon
          delivery: external
          providerAccountRef: example-neon
          credentialMode: standard
          rotation: 'on'
          cpu: 1
          ram: 1Gi
          storage: 10Gi
          version: '16'
          backup:
            crossVendor: true
          engine:
            neon:
              tier: example
      kv: # @schema mergeProperties:true
        sessions:
          type: upstash
          delivery: external
          providerAccountRef: example-upstash
          credentialMode: standard
          rotation: 'on'
          ram: 128Mi
          engine:
            upstash: {}
      cache: # @schema mergeProperties:true
        hot:
          type: dragonfly
          delivery: replicated
          credentialMode: standard
          rotation: 'on'
          ram: 128Mi
          engine:
            dragonfly: {}
      store: # @schema mergeProperties:true
        assets:
          type: tigris
          delivery: external
          providerAccountRef: example-tigris
          credentialMode: standard
          rotation: 'on'
          engine:
            tigris: {}
  virtualLandscapeService:
    enabled: true
    serve: true
  logtoApp:
    enabled: true
    paths: [/auth/callback]
    extraRedirectUris: [] # @schema item:string;uniqueItems:true
    resourceRefs: [wrapper-api] # @schema item:string;uniqueItems:true
  problem:
    enabled: true
    version: 0.1.0
    entries:
      - id: example
        type: https://errors.example.invalid/example
        title: Example problem
        status: 500
        recoverable: false
        schema: {}
        endpoints:
          - method: GET
            path: /
  cloudflareDeploy:
    enabled: true
    scriptName: wrapper-web
    tag: 0.1.0
    pin: true

# -- Pinned upstream chart, instantiated by every committed stack. Every instantiated dependency must receive a conforming override.
upstream:
  # -- Render the pinned upstream dependency. It is instantiated by every committed stack.
  enabled: true
  # @schema pattern:^[a-z0-9]+-[a-z0-9]+$;required:true
  # -- Explicit conforming `<service>-<token>` name. Every rendered upstream object is named exactly this.
  fullnameOverride: wrapper-upstream
  # -- Chart-wide upstream settings. `global` is the only lever that reaches every rendered upstream object.
  global:
    # -- No upstream-owned ServiceAccount: the dependency must not mint resource names the wrapper did not authorize.
    createDefaultServiceAccount: false
    # @schema skipProperties:true
    # @schema additionalProperties:{"type":"string"}
    # -- Service-tree labels stamped on every upstream object. Keys are Helm templates rendered against the dependency context, so `global.labelPrefix` reaches an upstream key exactly as it reaches a wrapper-owned one.
    labels:
      '{{ .Values.global.labelPrefix }}/platform': sample
      '{{ .Values.global.labelPrefix }}/service': wrapper
      '{{ .Values.global.labelPrefix }}/module': upstream
      '{{ .Values.global.labelPrefix }}/layer': '2'
    # @schema skipProperties:true
    # @schema additionalProperties:{"type":"string"}
    # -- Service-tree annotations stamped on every upstream object. Keys are templated on the same `global.labelPrefix` as the labels above, and the recorded instance pair is templated through the SAME helpers the wrapper's own objects use, so one release can never record two different physical instances. Literals here would be a second copy that silently diverges the moment `global.instance.preview.enabled` is true.
    annotations:
      '{{ .Values.global.labelPrefix }}/platform': sample
      '{{ .Values.global.labelPrefix }}/service': wrapper
      '{{ .Values.global.labelPrefix }}/module': upstream
      '{{ .Values.global.labelPrefix }}/layer': '2'
      '{{ .Values.global.labelPrefix }}/instance-original': '{{ include "diene-helm-wrapper.instanceOriginal" . }}'
      '{{ .Values.global.labelPrefix }}/instance-label': '{{ include "diene-helm-wrapper.instanceSegment" . }}'
  # -- Exactly one controller, so the rendered Deployment keeps the unsuffixed `wrapper-upstream` name.
  controllers:
    main:
      type: deployment # @schema enum:[deployment, statefulset, daemonset]
      # -- The upstream workload rolls like every wrapper-owned Deployment; it is never recreated.
      strategy: RollingUpdate # @schema enum:[RollingUpdate, Recreate]
      # -- Reloader opts in on the Deployment metadata, matching every wrapper-owned workload.
      annotations:
        reloader.stakater.com/auto: 'true'
      replicas: 1 # @schema minimum:1
      pod:
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          runAsGroup: 10000
          fsGroup: 10000
      containers:
        main:
          image:
            repository: ghcr.io/stefanprodan/podinfo
            tag: 6.9.2 # @schema pattern:^[A-Za-z0-9][A-Za-z0-9._-]*$
            pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
  # -- Exactly one ClusterIP Service, so the rendered Service keeps the unsuffixed `wrapper-upstream` name.
  service:
    main:
      controller: main
      type: ClusterIP # @schema enum:[ClusterIP]
      ports:
        http:
          enabled: true
          port: 9898 # @schema minimum:1;maximum:65535
