# Global values propagate to the vendored Reloader subchart so its workload carries
# the fleet service-tree identity without any chlorine-owned workload template.
global:
  # @schema pattern:^[a-z0-9.-]+$;minLength:1
  # -- Prefix used by every service-tree label and annotation helper.
  labelPrefix: atomi.cloud

  # -- Stable four-slot service-tree projection. Landscape and cluster arrive from independent overlays.
  serviceTree:
    # @schema pattern:^[a-z0-9-]+$;required:true
    # -- Platform identity. Always sourced from the release namespace.
    platform: sample
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Service name.
    service: chlorine
    # @schema pattern:^[a-z0-9]+$;required:true
    # -- Module name.
    module: reloader
    # @schema pattern:^[0-9]+$;required:true
    # -- Architecture layer.
    layer: '1'

  # -- Optional physical-instance metadata. The instance remains outside LPSM.
  instance:
    # @schema pattern:^[a-z0-9._:/-]+$;minLength:1
    # -- Repository-qualified physical instance id.
    physicalId: diene-chlorine:run-001

# -- Vendored Stakater Reloader dependency. Chlorine is a near-pure passthrough: the
# subchart owns the workload; this block only pins the fleet conventions.
reloader:
  enabled: true
  # -- Exactly-one-dash fullname on the vendored dependency (`<service>-<token>`).
  fullnameOverride: chlorine-reloader
  reloader:
    # -- PRESERVE annotation opt-in. Never auto-reload-all; workloads opt in via the stakater annotation.
    autoReloadAll: false
    # -- Only annotated workloads are reloaded (the fleet opt-in posture).
    reloadStrategy: annotations
    # -- Read-only root filesystem with a chart-managed writable /tmp volume (VAP baseline-plus).
    readOnlyRootFileSystem: true
    deployment:
      # -- Service-tree labels rendered through the subchart's tpl pipeline.
      labels:
        '{{ include "diene-chlorine.labelPrefix" . }}/platform': '{{ include "diene-chlorine.validateServiceTree" . }}{{ .Release.Namespace }}'
        '{{ include "diene-chlorine.labelPrefix" . }}/service': '{{ .Values.global.serviceTree.service }}'
        '{{ include "diene-chlorine.labelPrefix" . }}/module': '{{ .Values.global.serviceTree.module }}'
        '{{ include "diene-chlorine.labelPrefix" . }}/layer': '{{ .Values.global.serviceTree.layer }}'
        '{{ include "diene-chlorine.labelPrefix" . }}/landscape': '{{ .Values.global.serviceTree.landscape | default "" }}'
        '{{ include "diene-chlorine.labelPrefix" . }}/cluster': '{{ .Values.global.serviceTree.cluster | default "" }}'
      pod:
        # -- Service-tree and reversible instance metadata annotations.
        annotations:
          '{{ include "diene-chlorine.labelPrefix" . }}/platform': '{{ .Release.Namespace }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/service': '{{ .Values.global.serviceTree.service }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/module': '{{ .Values.global.serviceTree.module }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/layer': '{{ .Values.global.serviceTree.layer }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/landscape': '{{ .Values.global.serviceTree.landscape | default "" }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/cluster': '{{ .Values.global.serviceTree.cluster | default "" }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/instance-original': '{{ .Values.global.instance.physicalId }}'
          '{{ include "diene-chlorine.labelPrefix" . }}/instance-label': '{{ include "diene-chlorine.instanceLabel" .Values.global.instance.physicalId }}'
      # -- Baseline-plus container hardening (VAP conformance).
      containerSecurityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
      # -- Requests and limits (VAP conformance; Reloader is a light controller).
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
