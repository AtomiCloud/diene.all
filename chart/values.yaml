# ### aluminium-root
# #### source: aluminium
# AtomiCloud aluminium — thin wrapper around grafana/k8s-monitoring.
# The wrapper surface is intentionally ~40 lines of upstream values: the two
# collectors (alloy-metrics StatefulSet clustered, alloy-logs DaemonSet), the
# OTLP-everywhere destination map, and the feature -> collector assignment that
# pins the fleet OTLP receiver on :4318. No raw river config is shipped.

# Single configurable LPSM label/annotation prefix (R16). Read by every helper.
labelPrefix: atomi.cloud

# Service-tree projection. platform is stamped from the release namespace by the
# validateServiceTree helper; cluster.name is overlay-owned.
serviceTree:
  platform: telemetry
  service: aluminium
  module: telemetry
  layer: '1'

# aluminium's own ExternalSecret (backend creds via ESO, SoS chain). Local and
# Garden run auth: none against the emulated stack; this template is the prod
# path and is disabled by default. No literal credentials are ever inlined.
secret:
  enabled: false
  refreshInterval: 1h
  store:
    kind: ClusterSecretStore
    name: platform-secret-store
  sharedFolder: /shared/aluminium
  serviceFolder: /svc/aluminium

# grafana/k8s-monitoring v4.x (aliased `upstream`). Destinations are OTLP/HTTP
# only (Q-I28): one protocol, no per-signal selector. Endpoints are overlay
# owned (local/Garden = emulated stack; prod supplied by Primordial).
upstream:
  alloy-operator:
    deploy: true

  cluster:
    # Default cluster identity; overlays (values.<landscape>.yaml,
    # values.<cluster>.yaml) specialize it per landing.
    name: local

  destinations:
    victoriametrics:
      type: otlp
      protocol: http
      url: http://victoriametrics:4318
      metrics: { enabled: true }
      logs: { enabled: false }
      traces: { enabled: false }
      auth: { type: none }
    gigapipe:
      type: otlp
      protocol: http
      url: http://gigapipe:4318
      metrics: { enabled: false }
      logs: { enabled: true }
      traces: { enabled: true }
      auth: { type: none }

  # Metric sources for clusterMetrics. node-exporter is a privileged host-level
  # DaemonSet; its scoped hostPath/hostNetwork allowance is owned by vanadium's
  # VAP policy set (recorded in docs/developer/aluminium-baseline.md).
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  podLogsViaOpenTelemetry:
    enabled: true
    collector: alloy-logs
    destinations: [gigapipe]

  clusterMetrics:
    enabled: true
    collector: alloy-metrics

  # Fleet OTLP contract: diene apps push metrics+traces+logs to :4318, served by
  # alloy-metrics. Receiver is http/protobuf on 4318 (R14/R17).
  applicationObservability:
    enabled: true
    collector: alloy-metrics
    destinations: [victoriametrics, gigapipe]
    receivers:
      otlp:
        grpc: { enabled: false }
        http: { enabled: true, port: 4318 }

  collectors:
    # alloy-metrics: StatefulSet + clustering; hosts the :4318 OTLP receiver.
    alloy-metrics:
      controller: { type: statefulset, replicas: 1 }
      alloy:
        clustering: { enabled: true }
        labels:
          atomi.cloud/platform: telemetry
          atomi.cloud/service: aluminium
          atomi.cloud/module: telemetry
          atomi.cloud/layer: '1'
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
    # alloy-logs: DaemonSet, no clustering; scoped /var/log mount.
    alloy-logs:
      controller: { type: daemonset }
      alloy:
        stabilityLevel: public-preview
        mounts: { varlog: true }
        labels:
          atomi.cloud/platform: telemetry
          atomi.cloud/service: aluminium
          atomi.cloud/module: telemetry
          atomi.cloud/layer: '1'
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
