{{- include "sulfur.validateServiceTree" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sulfur.resourceName" (dict "root" . "token" "lpsm") }}
  labels:
    {{- include "sulfur.labels" . | nindent 4 }}
  annotations:
    {{- include "sulfur.serviceTreeAnnotations" . | nindent 4 }}
data:
  layer: {{ .Values.global.serviceTree.layer | quote }}
  module: {{ .Values.global.serviceTree.module | quote }}
  service: {{ .Values.global.serviceTree.service | quote }}
  engine: 'cert-manager'
  purpose: 'certificate lifecycle engine (controller + cainjector + webhook)'
  source: 'jetstack/cert-manager'
  issuer: 'none — the ClusterIssuer set is zinc; the engine and issuer are separate charts'
