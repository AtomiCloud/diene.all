{{- if .Values.store.enabled -}}
{{- include "cobalt.validateServiceTree" . -}}
{{- $store := .Values.store -}}
{{- $auth := $store.infisical.auth.universalAuth -}}
{{- $scope := $store.infisical.secretsScope -}}
{{- if not $scope.environmentSlug -}}
{{- fail "store.infisical.secretsScope.environmentSlug (the cluster landscape) is required — set it in the landscape overlay" -}}
{{- end -}}
{{- if or $auth.clientId.value $auth.clientSecret.value -}}
{{- fail "infisical universal auth must reference the bootstrap Secret — inline credential literals are forbidden" -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "cobalt.primaryName" . }}
  labels:
    {{- include "cobalt.labels" . | nindent 4 }}
  annotations:
    {{- include "cobalt.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    infisical:
      hostAPI: {{ $store.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ required "store.infisical.auth.universalAuth.clientId.name is required" $auth.clientId.name | quote }}
            key: {{ required "store.infisical.auth.universalAuth.clientId.key is required" $auth.clientId.key | quote }}
            namespace: {{ required "store.infisical.auth.universalAuth.clientId.namespace is required" $auth.clientId.namespace | quote }}
          clientSecret:
            name: {{ required "store.infisical.auth.universalAuth.clientSecret.name is required" $auth.clientSecret.name | quote }}
            key: {{ required "store.infisical.auth.universalAuth.clientSecret.key is required" $auth.clientSecret.key | quote }}
            namespace: {{ required "store.infisical.auth.universalAuth.clientSecret.namespace is required" $auth.clientSecret.namespace | quote }}
      secretsScope:
        projectSlug: {{ required "store.infisical.secretsScope.projectSlug is required" $scope.projectSlug | quote }}
        environmentSlug: {{ $scope.environmentSlug | quote }}
        secretsPath: {{ $scope.secretsPath | quote }}
        recursive: {{ $scope.recursive }}
{{- end -}}
