{{- if .Values.gateway.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
{{- $gatewayName := include "diene-helm-wrapper.resourceName" (dict "root" . "token" "gateway") -}}
{{- $selector := .Values.gateway.proxy.selector -}}
{{- if or (empty $selector) (ne (len $selector) 3) -}}
{{- fail "gateway.proxy.selector must contain exactly the three kgateway v2.2.9 generated-proxy labels" -}}
{{- end -}}
{{- if or (ne (get $selector "app.kubernetes.io/name") $gatewayName) (ne (get $selector "app.kubernetes.io/instance") $gatewayName) (ne (get $selector "gateway.networking.k8s.io/gateway-name") $gatewayName) -}}
{{- fail "gateway.proxy.selector must select the kgateway v2.2.9 proxy generated for this Gateway" -}}
{{- end -}}
{{- if ne (.Values.gateway.proxy.httpTargetPort | int) (.Values.gateway.port | int) -}}
{{- fail "gateway.proxy.httpTargetPort must equal the v2.2.9 generated proxy HTTP listener port" -}}
{{- end -}}
{{- if ne (.Values.gateway.proxy.httpsTargetPort | int) (.Values.gateway.tlsPort | int) -}}
{{- fail "gateway.proxy.httpsTargetPort must equal the v2.2.9 generated proxy HTTPS listener port" -}}
{{- end -}}
{{- if and (eq .Values.gateway.provider "aws") (ne (len .Values.gateway.aws.subnetIds) (len .Values.gateway.aws.eipAllocationIds)) -}}
{{- fail "gateway.aws.subnetIds and gateway.aws.eipAllocationIds must have identical lengths" -}}
{{- end -}}
{{- if and (eq .Values.gateway.provider "aws") (eq (len .Values.gateway.aws.subnetIds) 0) -}}
{{- fail "AWS gateway mode requires at least one immutable subnet/EIP pair" -}}
{{- end -}}
{{- if and (eq .Values.gateway.provider "oci") (empty .Values.gateway.oci.reservedPublicIp) -}}
{{- fail "OCI gateway mode requires gateway.oci.reservedPublicIp" -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "edge") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
    {{- if eq .Values.gateway.provider "aws" }}
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," .Values.gateway.aws.subnetIds | quote }}
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: {{ join "," .Values.gateway.aws.eipAllocationIds | quote }}
    {{- else if eq .Values.gateway.provider "oci" }}
    oci.oraclecloud.com/reserved-ips: {{ .Values.gateway.oci.reservedPublicIp | quote }}
    {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  {{- with .Values.gateway.proxy.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: listener-{{ .Values.gateway.port }}
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.proxy.httpTargetPort }}
      protocol: TCP
    - name: listener-{{ .Values.gateway.tlsPort }}
      port: {{ .Values.gateway.tlsPort }}
      targetPort: {{ .Values.gateway.proxy.httpsTargetPort }}
      protocol: TCP
{{- end }}
