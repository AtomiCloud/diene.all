{{- if .Values.secret.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
{{- $sharedFolder := base (trimSuffix "/" .Values.secret.sharedFolder) | lower -}}
{{- $serviceFolder := base (trimSuffix "/" .Values.secret.serviceFolder) | lower -}}
{{- if eq $sharedFolder $serviceFolder -}}
{{- fail (printf "secret folders %q and %q collide on prefix %q" .Values.secret.sharedFolder .Values.secret.serviceFolder (upper $sharedFolder)) -}}
{{- end -}}
{{- if ne $serviceFolder (.Values.serviceTree.service | lower) -}}
{{- fail (printf "secret.serviceFolder %q must end in the service name %q" .Values.secret.serviceFolder .Values.serviceTree.service) -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "secrets") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secret.store.kind }}
    name: {{ .Values.secret.store.name }}
  target:
    name: {{ .Values.serviceTree.service }}
    creationPolicy: Owner
  dataFrom:
    - find:
        path: {{ .Values.secret.sharedFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ upper $sharedFolder }}_$1'
    - find:
        path: {{ .Values.secret.serviceFolder }}
      rewrite:
        - regexp:
            source: '(.*)'
            target: '{{ upper $serviceFolder }}_$1'
{{- end }}
