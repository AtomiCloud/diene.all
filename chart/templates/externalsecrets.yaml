{{- if eq (include "lithium.mode" .) "FLEET" }}
{{- $e := .Values.fleet.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lithium-database
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "lithium.labels" . | nindent 4 }}
  annotations: {{- include "lithium.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval | quote }}
  secretStoreRef: {{- toYaml $e.secretStoreRef | nindent 4 }}
  target: {name: {{ $e.databaseSecretName }}, creationPolicy: Owner}
  data:
    - secretKey: DB_URL
      remoteRef: {key: {{ printf "%s/DB_URL" $e.databasePath | quote }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lithium-boot
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "lithium.labels" . | nindent 4 }}
  annotations: {{- include "lithium.annotations" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval | quote }}
  secretStoreRef: {{- toYaml $e.secretStoreRef | nindent 4 }}
  target: {name: {{ $e.bootSecretName }}, creationPolicy: Owner}
  data:
    - secretKey: SEED_M2M_CLIENT_ID
      remoteRef: {key: {{ printf "%s/SEED_M2M_CLIENT_ID" (include "lithium.bootPath" .) | quote }}}
    - secretKey: SEED_M2M_CLIENT_SECRET
      remoteRef: {key: {{ printf "%s/SEED_M2M_CLIENT_SECRET" (include "lithium.bootPath" .) | quote }}}
{{- end }}
