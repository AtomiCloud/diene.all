{{- if eq (include "lithium.mode" .) "FLEET" }}
{{- $e := .Values.fleet.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lithium-database
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "lithium.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval | quote }}
  secretStoreRef: {{- toYaml $e.secretStoreRef | nindent 4 }}
  target: {name: {{ $e.databaseSecretName }}, creationPolicy: Owner}
  data:
    - secretKey: DB_URL
      remoteRef: {key: {{ $e.databasePath | quote }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lithium-boot
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "lithium.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval | quote }}
  secretStoreRef: {{- toYaml $e.secretStoreRef | nindent 4 }}
  target: {name: {{ $e.bootSecretName }}, creationPolicy: Owner}
  data:
    - secretKey: SEED_M2M_CLIENT_ID
      remoteRef: {key: {{ $e.bootPath | quote }}, property: SEED_M2M_CLIENT_ID}
    - secretKey: SEED_M2M_CLIENT_SECRET
      remoteRef: {key: {{ $e.bootPath | quote }}, property: SEED_M2M_CLIENT_SECRET}
{{- end }}
