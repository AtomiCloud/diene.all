{{- include "diene-helm-wrapper.validateServiceTree" . -}}
{{- $lpsm := .Values.contracts.lpsm -}}
{{- $ordinary := include "diene-helm-wrapper.hostname" (dict "root" . "module" $lpsm.module "service" $lpsm.service "landscape" $lpsm.landscape "zone" $lpsm.ordinaryZone) -}}
{{- $instance := include "diene-helm-wrapper.hostname" (dict "root" . "module" $lpsm.module "service" $lpsm.service "landscape" $lpsm.landscape "instance" $lpsm.instance "zone" $lpsm.instanceZone) -}}
{{- $parseHostname := default $instance $lpsm.parseHostname -}}
{{- $parsed := include "diene-helm-wrapper.parseHostname" (dict "hostname" $parseHostname "zone" $lpsm.instanceZone) -}}
{{- $original := include "diene-helm-wrapper.instanceOriginal" . -}}
{{- $segment := include "diene-helm-wrapper.instanceSegment" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "contracts") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
data:
  health.path: {{ .Values.contracts.health.path | quote }}
  health.expectedStatus: {{ .Values.contracts.health.expectedStatus | quote }}
  webhook.path: {{ printf "%s/%s" (trimSuffix "/" .Values.contracts.webhook.pathPrefix) .Values.contracts.webhook.provider | quote }}
  webhook.owned: '200'
  webhook.wrongLandscape: '421'
  webhook.retryable: 'other 4xx/5xx'
  lpsm.ordinaryHostname: {{ $ordinary | quote }}
  lpsm.instanceHostname: {{ $instance | quote }}
  lpsm.parsed: {{ $parsed | quote }}
  {{- /* The pre-minted pair, recorded as the distinct bytes it arrived as, so a hash-shortened label stays reversible to its repository-qualified id. */}}
  instance.original: {{ $original | quote }}
  instance.label: {{ $segment | quote }}
  {{- if and $segment (not .Values.instance.preview.enabled) }}
  {{- /* The hostname instance segment is the minter's LABEL, never the original. Preview publishes its own coordinate below. */}}
  instance.hostname: {{ include "diene-helm-wrapper.hostname" (dict "root" . "module" $lpsm.module "service" $lpsm.service "landscape" $lpsm.landscape "instance" $segment "zone" $lpsm.instanceZone) | quote }}
  {{- end }}
  {{- if .Values.instance.preview.enabled }}
  {{- /* Receipt-derived, outward-safe fields only. The full digest and leaseKey stay internal. */}}
  preview.petname: {{ include "diene-helm-wrapper.previewPetname" . | quote }}
  preview.schema: {{ .Values.instance.preview.receipt.schema | quote }}
  preview.wordList: {{ .Values.instance.preview.receipt.wordList | quote }}
  preview.forkSource: {{ .Values.instance.preview.receipt.forkSource | quote }}
  preview.mintedAt: {{ .Values.instance.preview.receipt.mintedAt | quote }}
  preview.hostname: {{ include "diene-helm-wrapper.previewHostname" (dict "root" . "module" $lpsm.module "service" $lpsm.service "zone" $lpsm.instanceZone) | quote }}
  {{- end }}
