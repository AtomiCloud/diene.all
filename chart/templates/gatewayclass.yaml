{{- if .Values.gateway.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.classname | quote }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName | quote }}
{{- end }}
