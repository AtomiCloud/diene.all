{{- if .Values.platformSecretStore.enabled -}}
{{- $store := .Values.platformSecretStore -}}
{{- if not $store.infisical.environmentSlug -}}
{{- fail "platformSecretStore.infisical.environmentSlug is required from a landscape overlay" -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ required "platformSecretStore.name is required" $store.name }}
  namespace: {{ required "namespace.name is required" .Values.namespace.name }}
  labels:
    {{- include "carbon.labels" . | nindent 4 }}
  annotations:
    {{- include "carbon.annotations" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    infisical:
      hostAPI: {{ $store.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.tokenExternalSecret.targetSecretName }}
            key: {{ $store.auth.clientIdKey }}
          clientSecret:
            name: {{ .Values.tokenExternalSecret.targetSecretName }}
            key: {{ $store.auth.clientSecretKey }}
      secretsScope:
        projectSlug: {{ $store.infisical.projectSlug | quote }}
        environmentSlug: {{ $store.infisical.environmentSlug | quote }}
        secretsPath: {{ $store.infisical.secretsPath | quote }}
        recursive: {{ $store.infisical.recursive }}
{{- end -}}
