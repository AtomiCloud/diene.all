{{- if .Values.gateway.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "gateway") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.classname | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if and .Values.registeredCertificates.enabled (not .Values.devHost.enabled) }}
    - name: https-primary
      hostname: {{ .Values.registeredCertificates.primary.domain | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.tlsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "certprimary") }}-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-backup
      hostname: {{ .Values.registeredCertificates.backup.domain | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.tlsPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "certbackup") }}-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
