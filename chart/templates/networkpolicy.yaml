{{- if eq .Values.distributionMode "GARDEN-LOCAL" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lithium-management-isolation
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "lithium.labels" . | nindent 4 }}
  annotations: {{- include "lithium.annotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "lithium.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.garden.ordinaryRailSelector | nindent 14 }}
      ports: [{protocol: TCP, port: public}]
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.garden.operatorSelector | nindent 14 }}
      ports: [{protocol: TCP, port: management}]
{{- end }}
