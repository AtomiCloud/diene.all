{{- if .Values.webhookRoute.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "webhooks") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.webhookRoute.parentGateway }}
      namespace: {{ .Values.webhookRoute.parentNamespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s/%s" (trimSuffix "/" .Values.contracts.webhook.pathPrefix) .Values.contracts.webhook.provider }}
      backendRefs:
        - name: {{ include "diene-helm-wrapper.primaryName" . }}
          port: {{ .Values.workload.port }}
{{- end }}
