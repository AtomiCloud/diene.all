{{/*
Resolve the concrete landscape that selects a Logto issuer. Identity resolution is a
ruled exception to the generic LPSM helpers, so the segment is checked here rather than
taken from a free value: it must be exactly one concrete landscape label, and neither a
virtual landscape nor the consumer platform may ever occupy it.
*/}}
{{- define "diene-helm-wrapper.identityLandscape" -}}
{{- $landscape := required "primordial.targetLandscape is required" .Values.primordial.targetLandscape | lower -}}
{{- $vlandscape := default "" .Values.primordial.vlandscape | lower -}}
{{- $platform := .Release.Namespace | lower -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $landscape) -}}
{{- fail (printf "identity landscape %q must be exactly one concrete landscape label" $landscape) -}}
{{- end -}}
{{- if eq $landscape $vlandscape -}}
{{- fail (printf "virtual landscape %q never selects a Logto issuer" $landscape) -}}
{{- end -}}
{{- if eq $landscape $platform -}}
{{- fail (printf "consumer platform %q never selects a Logto issuer" $landscape) -}}
{{- end -}}
{{- $landscape -}}
{{- end -}}

{{/*
The sole fleet identity endpoint. Module, service, and platform segments are fixed to
aldehyde's lithium api; only the concrete landscape varies, so a consumer platform can
never reach this form.
*/}}
{{- define "diene-helm-wrapper.logtoIdentityEndpoint" -}}
{{- printf "api.lithium.aldehyde.%s.cluster.atomi.cloud" (include "diene-helm-wrapper.identityLandscape" .) -}}
{{- end -}}

{{- if .Values.primordial.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
{{- $dependencyModules := .Values.primordial.platformDependency.modules | default dict -}}
{{- $dependencyGroups := list "database" "kv" "cache" "store" -}}
{{- range $group, $_ := $dependencyModules -}}
{{- if not (has $group $dependencyGroups) -}}
{{- fail (printf "primordial.platformDependency.modules contains unsupported group %q" $group) -}}
{{- end -}}
{{- end -}}
apiVersion: {{ .Values.primordial.apiVersions.fleet }}
kind: PlatformDependency
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "dependencies") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  platform: {{ .Release.Namespace }}
  landscape: {{ .Values.primordial.targetLandscape }}
  placement:
    preferredHost: {{ .Values.primordial.placement.preferredHost }}
  {{- range $group := $dependencyGroups }}
  {{- with index $dependencyModules $group }}
  {{ $group }}:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  deletionPolicy:
    retainSecret: 168h
---
{{- if .Values.primordial.virtualLandscapeService.enabled }}
apiVersion: {{ .Values.primordial.apiVersions.fleet }}
kind: VirtualLandscapeService
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "vls") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  platform: {{ .Release.Namespace }}
  vlandscape: {{ .Values.primordial.vlandscape }}
  service: {{ .Values.serviceTree.service }}
  module: {{ .Values.serviceTree.module }}
  landscape: {{ .Values.primordial.targetLandscape }}
  serve: {{ .Values.primordial.virtualLandscapeService.serve }}
---
{{- end }}
{{- if .Values.primordial.logtoApp.enabled }}
apiVersion: {{ .Values.primordial.apiVersions.identity }}
kind: LogtoApp
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" (printf "identity-%s" (include "diene-helm-wrapper.identityLandscape" .))) }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{ printf "%s/identity-endpoint" (include "diene-helm-wrapper.labelPrefix" .) }}: {{ include "diene-helm-wrapper.logtoIdentityEndpoint" . | quote }}
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  identityRef:
    platform: {{ .Release.Namespace }}
    landscape: {{ include "diene-helm-wrapper.identityLandscape" . }}
  paths:
    {{- toYaml .Values.primordial.logtoApp.paths | nindent 4 }}
  extraRedirectUris:
    {{- toYaml .Values.primordial.logtoApp.extraRedirectUris | nindent 4 }}
  resourceRefs:
    {{- toYaml .Values.primordial.logtoApp.resourceRefs | nindent 4 }}
---
{{- end }}
{{- if .Values.primordial.problem.enabled }}
apiVersion: {{ .Values.primordial.apiVersions.fleet }}
kind: Problem
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "problems") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  platform: {{ .Release.Namespace }}
  service: {{ .Values.serviceTree.service }}
  module: {{ .Values.serviceTree.module }}
  landscape: {{ .Values.primordial.targetLandscape }}
  version: {{ .Values.primordial.problem.version | quote }}
  problems:
    {{- toYaml .Values.primordial.problem.entries | nindent 4 }}
---
{{- end }}
{{- if .Values.primordial.cloudflareDeploy.enabled }}
apiVersion: {{ .Values.primordial.apiVersions.edge }}
kind: CloudflareDeploy
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "edge") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  scriptName: {{ .Values.primordial.cloudflareDeploy.scriptName }}
  desiredVersionFrom:
    tag: {{ .Values.primordial.cloudflareDeploy.tag | quote }}
  pin: {{ .Values.primordial.cloudflareDeploy.pin }}
{{- end }}
{{- end }}
