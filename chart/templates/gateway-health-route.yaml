{{- if and .Values.gateway.enabled .Values.healthBackend.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "health") }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "diene-helm-wrapper.resourceName" (dict "root" . "token" "gateway") }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.gateway.health.path }}
      backendRefs:
        - name: {{ include "diene-helm-wrapper.primaryName" . }}
          port: {{ .Values.healthBackend.port }}
{{- end }}
