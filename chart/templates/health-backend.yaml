{{- if .Values.healthBackend.enabled -}}
{{- include "diene-helm-wrapper.validateServiceTree" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diene-helm-wrapper.primaryName" . }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
    {{- include "diene-helm-wrapper.reloaderAnnotations" (dict "enabled" .Values.healthBackend.reloader.enabled) | nindent 4 }}
spec:
  replicas: {{ .Values.healthBackend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "diene-helm-wrapper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "diene-helm-wrapper.labels" . | nindent 8 }}
      annotations:
        {{- include "diene-helm-wrapper.annotations" . | nindent 8 }}
        {{- include "diene-helm-wrapper.reloaderAnnotations" (dict "enabled" .Values.healthBackend.reloader.enabled) | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.healthBackend.podSecurityContext | nindent 8 }}
      containers:
        - name: health
          image: '{{ .Values.healthBackend.image.repository }}:{{ .Values.healthBackend.image.tag }}'
          imagePullPolicy: {{ .Values.healthBackend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.healthBackend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.health.path }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.health.path }}
              port: http
          securityContext:
            {{- toYaml .Values.healthBackend.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.healthBackend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diene-helm-wrapper.primaryName" . }}
  labels:
    {{- include "diene-helm-wrapper.labels" . | nindent 4 }}
  annotations:
    {{- include "diene-helm-wrapper.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "diene-helm-wrapper.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.healthBackend.port }}
      targetPort: http
      protocol: TCP
{{- end }}
