schemaVersion: 2

types:
  - type: amend
    desc: Small amendments and typo fixes
    scopes:
      default:
        desc: Amend existing work
        release: false
  - type: build
    desc: Build-system changes
    scopes:
      default:
        desc: Update build machinery
        release: false
  - type: chore
    desc: Repository chores
    scopes:
      default:
        desc: Perform a chore
        release: false
  - type: ci
    desc: CI/CD changes
    scopes:
      default:
        desc: Update CI/CD
        release: false
  - type: config
    desc: Configuration changes
    scopes:
      default:
        desc: Update configuration
        release: false
  - type: dep
    desc: Dependency updates
    section: 🔼 Dependency Upstreams 🔼
    scopes:
      default:
        desc: Update a dependency
        release: false
      patch:
        desc: Patch dependency update
        release: patch
      minor:
        desc: Minor dependency update
        release: minor
      major:
        desc: Major dependency update
        release: major
  - type: docs
    desc: Documentation changes
    section: 📜 Documentation 📜
    scopes:
      default:
        desc: Update documentation
        release: false
  - type: feat
    desc: New features
    section: ✨ Features ✨
    scopes:
      default:
        desc: Add a feature
        release: minor
      breaking:
        desc: Add a breaking feature
        release: major
  - type: fix
    desc: Bug fixes
    section: 🐛 Bug Fixes 🐛
    scopes:
      default:
        desc: Fix a bug
        release: patch
  - type: perf
    desc: Performance improvements
    section: 🚀 Performance Improvement 🚀
    scopes:
      default:
        desc: Improve performance
        release: patch
  - type: refactor
    desc: Refactors
    scopes:
      default:
        desc: Refactor implementation
        release: minor
  - type: style
    desc: Non-functional style changes
    scopes:
      default:
        desc: Update style
        release: patch
  - type: test
    desc: Test changes
    section: 🧪 Tests 🧪
    scopes:
      default:
        desc: Add or correct tests
        release: minor

specialScopes:
  no-release:
    desc: Prevent release from happening
    release: false

keywords:
  - BREAKING CHANGE
  - BREAKING CHANGES
  - BREAKING

# Message rules for `releaser lint-commit`, which the commit-msg hook runs. These
# values are the tool's own defaults, written out rather than left implicit,
# because they are what a rejected commit will be measured against and a
# committer should be able to read them here.
lint:
  header:
    maxLength: 72
    minLength: 5
    forbiddenWords:
      - WIP
    forbidTrailingPunctuation: true
  body:
    maxLineLength: 80
    minLengthWhenPresent: 20
    requireBlankSecondLine: true
  ignore:
    - merge
    - revert
    - fixup
    - fixup-amend
    - squash

# `releaser conventions` writes `path` from this `template`, substituting the
# generated type/scope tables for CONVENTION_DOCS_PLACEHOLDER. A release run
# rewrites that file too, so anything a reader should find there has to live in
# this template - the generated block alone is tables and nothing else. The prose
# below is therefore not decoration: it is the only place the reading guide can
# survive regeneration.
conventions:
  path: docs/developer/CommitConventions.md
  template: |-
    # Commit conventions

    This repository follows [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).

    - `atomi_release.yaml` is the machine-readable source of truth: it owns the
      commit types, the scopes valid for each one, and the version bump each scope
      causes.
    - [The conventional-commits standard](../standards/conventional-commits/index.md)
      explains how to read that vocabulary and how to mark a breaking change.

    ## Status of this file

    This file is generated. `atomi_release.yaml` names this path in its
    `conventions.path` value, `releaser conventions` writes it, and a release run
    rewrites it as well. Change `atomi_release.yaml` and regenerate rather than
    editing this file: everything up to here comes from that file's
    `conventions.template`, and everything from the `type(scope)` line below is
    generated from the commit vocabulary.

    CONVENTION_DOCS_PLACEHOLDER

release:
  branches:
    - main
  tagFormat: 'v${version}'
  changelog:
    path: Changelog.md
    title: '# Changelog'
  commit:
    message: |-
      release: ${version}

      ${notes}
    # Every file a release writes has to be listed here: the releaser refuses the
    # release outright if a write lands outside this list, and a file that is
    # written but unlisted is never committed. Both files below are written by the
    # tool itself - the changelog and the generated conventions document.
    assets:
      - Changelog.md
      - docs/developer/CommitConventions.md
  github:
    enabled: true
    successComment: 'Released in ${version}.'
    releasedLabels:
      - released
  hooks:
    # Deliberately empty, and kept for that reason. This is where the
    # `@semantic-release/exec` hook point moved to when this configuration became
    # schemaVersion 2: a downstream node fills `prepare` with
    # `{ phase: beforeWrite | afterWrite, command: ... }` entries, usually an
    # `afterWrite` command that stamps the version into whatever file that node's
    # ecosystem versions.
    #
    # This workspace versions no manifest, so it fills nothing and stamps nothing.
    # The releaser does not write a version file on its own - it writes only the
    # changelog and the conventions document - so an unfilled `prepare` means no
    # version file exists to commit. If you add a command that writes one, add that
    # file to `commit.assets` above in the SAME edit; a stamped-but-unlisted file is
    # refused by the asset fence, and a listed-but-unstamped file is dead
    # configuration.
    prepare: []
    success: []
